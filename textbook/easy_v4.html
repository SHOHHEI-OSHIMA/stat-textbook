const DEEP_PAGES={"1.5.1":"\n<section class=\"deep-reader-section\">\n<h2>まず、何を導こうとしているのか</h2>\n<p>ここで一番混乱しやすいのは、「分散の式を導いている途中なのに、なぜ『分散の定義より』と言えるのか」です。実は、ここには<b>母分散</b>と<b>標本分散</b>という別の階層の量が同時に登場しています。</p>\n\n<div class=\"deep-reader-box\">\n<p><b>母分散</b></p>\n<p>$$\\sigma^2=V(X)=E[(X-\\mu)^2]$$</p>\n<p>これは確率変数 $X$ の本当の散らばりを表す、母集団側の定義済みの量です。</p>\n<p><b>標本分散</b></p>\n<p>$$S^2=\\frac{1}{n-1}\\sum_{i=1}^n(X_i-\\bar X)^2$$</p>\n<p>こちらは、未知の $\\sigma^2$ を有限個の標本から推定するための推定量です。</p>\n</div>\n\n<p>したがって、ここでの目的は「分散という概念そのものを定義する」ことではありません。すでに定義されている母分散 $\\sigma^2$ を、標本からどう推定すればよいか、特に<b>なぜ分母が $n$ ではなく $n-1$ なのか</b>を導いています。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>登場人物を固定値・確率変数に分ける</h2>\n<table class=\"deep-reader-table\">\n<tr><th>記号</th><th>何を表すか</th><th>標本を取り直すと変わる？</th></tr>\n<tr><td>$X_i$</td><td>$i$ 番目の観測を表す確率変数</td><td>変わる</td></tr>\n<tr><td>$\\bar X$</td><td>標本平均</td><td>変わる</td></tr>\n<tr><td>$\\mu$</td><td>母平均 $E[X]$</td><td>固定</td></tr>\n<tr><td>$\\sigma^2$</td><td>母分散</td><td>固定</td></tr>\n<tr><td>$S^2$</td><td>標本分散という推定量</td><td>変わる</td></tr>\n<tr><td>$E[\\cdot]$</td><td>中の確率変数の理論上の平均を取る演算子</td><td>演算</td></tr>\n</table>\n<p>$E$ は係数ではありません。「両辺に $E$ をかける」と言うときも、掛け算ではなく、両辺をそれぞれ期待値を取る操作に入れています。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>もし本当の平均 $\\mu$ を知っていたら、$n$ で割ればよい</h2>\n<p>まず、現実には知らない $\\mu$ を知っていると仮定します。そのとき自然な量は</p>\n<p>$$\\frac1n\\sum_{i=1}^n(X_i-\\mu)^2$$</p>\n<p>です。この期待値を取ります。</p>\n<p>$$E\\left[\\frac1n\\sum_{i=1}^n(X_i-\\mu)^2\\right]$$</p>\n<p>期待値は線形なので、固定係数 $1/n$ を外へ出し、和を分けられます。</p>\n<p>$$=\\frac1n\\sum_{i=1}^nE[(X_i-\\mu)^2]$$</p>\n<p>ここで使うのが<b>母分散の定義</b>です。</p>\n<p>$$E[(X_i-\\mu)^2]=\\sigma^2$$</p>\n<p>したがって</p>\n<p>$$=\\frac1n\\sum_{i=1}^n\\sigma^2$$</p>\n<p>同じ $\\sigma^2$ が $n$ 個あるので</p>\n<p>$$=\\frac1n n\\sigma^2$$</p>\n<p>よって</p>\n<p>$$=\\sigma^2.$$</p>\n<p>つまり、本当の平均 $\\mu$ が分かっているなら、分母は $n$ で問題ありません。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>問題は $\\mu$ が分からないこと</h2>\n<p>実際には $\\mu$ が未知なので、同じ標本から計算した $\\bar X$ を使います。</p>\n<p>$$\\sum_i(X_i-\\bar X)^2$$</p>\n<p>$\\bar X$ は、その標本に対して偏差平方和を最も小さくする中心です。つまり「データに最も都合のよい中心」を後から選んでいるので、真の中心 $\\mu$ を使うより偏差平方和が小さくなります。</p>\n<p>その小さくなる量を正確に計算します。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>偏差平方和の恒等式を1行ずつ作る</h2>\n<p>まず同じ $\\mu$ を足して引くだけです。</p>\n<p>$$X_i-\\bar X=(X_i-\\mu)-(\\bar X-\\mu).$$</p>\n<p>両辺を二乗して全て足します。</p>\n<p>$$\\sum_i(X_i-\\bar X)^2\n=\\sum_i\\{(X_i-\\mu)-(\\bar X-\\mu)\\}^2.$$</p>\n<p>$(a-b)^2=a^2-2ab+b^2$ を使って展開します。</p>\n<p>$$=\\sum_i(X_i-\\mu)^2\n-2(\\bar X-\\mu)\\sum_i(X_i-\\mu)\n+\\sum_i(\\bar X-\\mu)^2.$$</p>\n<p>最後の $(\\bar X-\\mu)^2$ は $i$ に依存しないので、同じものを $n$ 回足しています。</p>\n<p>$$=\\sum_i(X_i-\\mu)^2\n-2(\\bar X-\\mu)\\sum_i(X_i-\\mu)\n+n(\\bar X-\\mu)^2.$$</p>\n\n<p>真ん中の和を整理します。</p>\n<p>$$\\sum_i(X_i-\\mu)\n=\\sum_iX_i-\\sum_i\\mu$$</p>\n<p>$\\mu$ は固定値なので $\\sum_i\\mu=n\\mu$、また標本平均の定義から $\\sum_iX_i=n\\bar X$ です。</p>\n<p>$$=n\\bar X-n\\mu$$</p>\n<p>$$=n(\\bar X-\\mu).$$</p>\n<p>これを戻すと</p>\n<p>$$-2(\\bar X-\\mu)\\sum_i(X_i-\\mu)\n=-2n(\\bar X-\\mu)^2.$$</p>\n<p>最後の $+n(\\bar X-\\mu)^2$ と合わせて</p>\n<p>$$\\boxed{\n\\sum_i(X_i-\\bar X)^2\n=\\sum_i(X_i-\\mu)^2-n(\\bar X-\\mu)^2\n}.$$</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>両辺の期待値を取る</h2>\n<p>期待値の線形性を使います。</p>\n<p>$$E\\left[\\sum_i(X_i-\\bar X)^2\\right]\n=\nE\\left[\\sum_i(X_i-\\mu)^2\\right]\n-\nnE[(\\bar X-\\mu)^2].$$</p>\n<p>第1項は</p>\n<p>$$E\\left[\\sum_i(X_i-\\mu)^2\\right]\n=\\sum_iE[(X_i-\\mu)^2]\n=\\sum_i\\sigma^2\n=n\\sigma^2.$$</p>\n\n<p>第2項では</p>\n<p>$$E[(\\bar X-\\mu)^2]=V(\\bar X)$$</p>\n<p>を使います。なぜなら $E[\\bar X]=\\mu$ だから、$\\bar X-\\mu$ は標本平均の「平均からのズレ」そのものだからです。</p>\n\n<p>独立同分布なら</p>\n<p>$$V(\\bar X)\n=V\\left(\\frac1n\\sum_iX_i\\right).$$</p>\n<p>固定係数の分散は二乗で外に出るので</p>\n<p>$$=\\frac1{n^2}V\\left(\\sum_iX_i\\right).$$</p>\n<p>独立なら分散は足せるので</p>\n<p>$$=\\frac1{n^2}\\sum_iV(X_i).$$</p>\n<p>各 $V(X_i)=\\sigma^2$ だから</p>\n<p>$$=\\frac1{n^2}n\\sigma^2$$</p>\n<p>$$=\\frac{\\sigma^2}{n}.$$</p>\n\n<p>したがって</p>\n<p>$$E\\left[\\sum_i(X_i-\\bar X)^2\\right]\n=n\\sigma^2-n\\frac{\\sigma^2}{n}$$</p>\n<p>$$=n\\sigma^2-\\sigma^2$$</p>\n<p>$$=(n-1)\\sigma^2.$$</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>だから $n-1$ で割る</h2>\n<p>$$S^2=\\frac1{n-1}\\sum_i(X_i-\\bar X)^2$$</p>\n<p>と定義すれば</p>\n<p>$$E[S^2]\n=\\frac1{n-1}E\\left[\\sum_i(X_i-\\bar X)^2\\right]$$</p>\n<p>$$=\\frac1{n-1}(n-1)\\sigma^2$$</p>\n<p>$$=\\sigma^2.$$</p>\n<p>これが「不偏」の意味です。標本を何度も取り直して同じ式を使ったとき、その推定値の理論平均が真の母分散に一致します。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>自由度 $n-1$ は何を言っているか</h2>\n<p>偏差 $X_i-\\bar X$ は必ず</p>\n<p>$$\\sum_i(X_i-\\bar X)=0$$</p>\n<p>を満たします。したがって $n$ 個の偏差のうち $n-1$ 個を決めると、最後の1個は自動的に決まります。</p>\n<p>これが「自由度が1減る」という直感です。ただし、これだけが厳密な証明ではありません。上で行った期待値計算が $n-1$ 補正の数式上の根拠で、自由度はその構造を理解する別の見方です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>単位・次元で確認する</h2>\n<p>$X$ が cm なら、$\\mu,\\bar X$ も cm、偏差も cm です。</p>\n<p>$$X-\\mu:\\mathrm{cm}$$</p>\n<p>$$ (X-\\mu)^2:\\mathrm{cm}^2$$</p>\n<p>したがって分散 $\\sigma^2,S^2$ は cm²、標準偏差 $\\sigma,S$ は平方根を取るので cm に戻ります。</p>\n</section>\n","1.5.4":"\n<section class=\"deep-reader-section\">\n<h2>変動係数は何を測っているのか</h2>\n<p>標準偏差は「絶対的なばらつき」を表します。しかし、平均100のデータで標準偏差5と、平均1000のデータで標準偏差20を比べると、単純に20の方が大きいから「後者の方が不安定」とは言えません。</p>\n<p>そこで平均の大きさで標準偏差を割ります。</p>\n<p>$$CV=\\frac{s}{\\bar x}$$</p>\n<p>母集団なら</p>\n<p>$$CV=\\frac{\\sigma}{\\mu}.$$</p>\n<p>これは「平均に対して、標準偏差が何割の大きさか」を表します。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>数値例</h2>\n<p>材料A：$\\bar x=100,\\ s=5$ なら</p>\n<p>$$CV_A=\\frac5{100}=0.05=5\\%.$$</p>\n<p>材料B：$\\bar x=1000,\\ s=20$ なら</p>\n<p>$$CV_B=\\frac{20}{1000}=0.02=2\\%.$$</p>\n<p>標準偏差だけならBの20の方が大きいですが、平均に対する相対的な散らばりはAの方が大きいと分かります。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>なぜ単位が消えるのか</h2>\n<p>例えば強度なら、$s$ も $\\bar x$ も N/mm² です。</p>\n<p>$$\\frac{\\mathrm{N/mm^2}}{\\mathrm{N/mm^2}}=1.$$</p>\n<p>したがってCVは無次元です。単位やスケールが違うデータ同士を比較できるのが利点です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>いつ使ってはいけないか</h2>\n<p>平均が0に近いと、分母が小さいためCVは非常に大きく不安定になります。また摂氏温度のように0点が任意の尺度では、比そのものに意味がありません。</p>\n<p>長さ・質量・強度のように「0が量の不存在」を意味する比例尺度で使うのが自然です。</p>\n</section>\n","1.6.1":"\n<section class=\"deep-reader-section\">\n<h2>そもそもモーメントとは何か</h2>\n<p>モーメントは、ざっくり言えば<b>「基準からの距離を何乗して、重み付き平均するか」</b>です。</p>\n<p>構造力学で</p>\n<p>$$\\int y\\,dA,\\qquad \\int y^2\\,dA$$</p>\n<p>を考えるのと数学的発想は同じです。構造では面積 $dA$ を重みとして使い、統計では確率を重みとして使います。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>まず「母モーメント」と「標本モーメント」を分ける</h2>\n<p>ここが非常に重要です。</p>\n<div class=\"deep-reader-box\">\n<p><b>母集団側の $k$ 次中心モーメント</b></p>\n<p>$$\\mu_k=E[(X-\\mu)^k]$$</p>\n<p>これは確率分布そのものが持つ真の量です。$\\mu=E[X]$ も通常は未知です。</p>\n\n<p><b>標本を取る前の標本中心モーメントという推定量</b></p>\n<p>$$M_k=\\frac1n\\sum_{i=1}^n(X_i-\\bar X)^k$$</p>\n<p>標本を取り直すと変わるので確率変数です。</p>\n\n<p><b>実際にデータを観測した後の値</b></p>\n<p>$$m_k=\\frac1n\\sum_{i=1}^n(x_i-\\bar x)^k$$</p>\n<p>これは今回の標本について計算された固定値です。</p>\n</div>\n<p>つまり「モーメントを定義できる」ことと「その真の値を知っている」ことは別です。母平均 $\\mu$ も母分散 $\\sigma^2$ も定義はできますが、現実には標本から推定します。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>1次中心モーメント</h2>\n<p>$$E[X-\\mu]$$</p>\n<p>期待値の線形性より</p>\n<p>$$E[X-\\mu]=E[X]-E[\\mu].$$</p>\n<p>$\\mu$ は固定値なので $E[\\mu]=\\mu$、また $\\mu=E[X]$ です。</p>\n<p>$$=\\mu-\\mu=0.$$</p>\n<p>平均からの偏差をそのまま平均すると正負が打ち消し合うので、散らばりの尺度としては使えません。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>2次中心モーメント＝分散</h2>\n<p>$$E[(X-\\mu)^2]=\\sigma^2.$$</p>\n<p>二乗すると符号が消え、平均からの距離の大きさを測れます。これが分散です。</p>\n<p>$X$ が cm なら2次中心モーメントの単位は cm²です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>3次中心モーメント＝左右の非対称を拾う</h2>\n<p>$$E[(X-\\mu)^3].$$</p>\n<p>三乗は</p>\n<p>$$(-2)^3=-8,\\qquad 2^3=8$$</p>\n<p>のように符号が残るため、左側の大きな偏差と右側の大きな偏差を区別できます。</p>\n<p>ただし単位が元の単位の3乗になるため、そのままでは比較しにくい。そこで</p>\n<p>$$\\gamma_1=\\frac{E[(X-\\mu)^3]}{\\sigma^3}$$</p>\n<p>として無次元化した量が歪度です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>4次中心モーメント＝遠い値を強く強調する</h2>\n<p>$$E[(X-\\mu)^4].$$</p>\n<p>平均からのズレが $1,2,5$ なら、二乗は $1,4,25$、四乗は $1,16,625$ です。</p>\n<p>したがって4次中心モーメントは、平均から非常に遠い値に強く反応します。</p>\n<p>標準化した</p>\n<p>$$\\frac{E[(X-\\mu)^4]}{\\sigma^4}$$</p>\n<p>は尖度に関係し、正規分布では3です。3を引いたものを超過尖度と呼びます。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>標本モーメントは母モーメントと同じではない</h2>\n<p>ここも重要です。例えば2次では</p>\n<p>$$M_2=\\frac1n\\sum_i(X_i-\\bar X)^2$$</p>\n<p>ですが</p>\n<p>$$E[M_2]=\\frac{n-1}{n}\\sigma^2$$</p>\n<p>となり、母2次中心モーメント $\\sigma^2$ を少し小さく推定します。</p>\n<p>そのため2次では</p>\n<p>$$S^2=\\frac1{n-1}\\sum_i(X_i-\\bar X)^2$$</p>\n<p>という補正を使うと不偏になります。</p>\n\n<p>3次でも一般に</p>\n<p>$$E[M_3]\\ne \\mu_3$$</p>\n<p>です。独立同分布なら</p>\n<p>$$E[M_3]=\\frac{(n-1)(n-2)}{n^2}\\mu_3.$$</p>\n<p>したがって標本歪度・標本尖度には「単純な標本モーメント」と「有限標本バイアスを補正した定義」が複数存在します。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>次元で整理する</h2>\n<table class=\"deep-reader-table\">\n<tr><th>量</th><th>$X$ が cm のとき</th></tr>\n<tr><td>$X-\\mu$</td><td>cm</td></tr>\n<tr><td>2次中心モーメント</td><td>cm²</td></tr>\n<tr><td>3次中心モーメント</td><td>cm³</td></tr>\n<tr><td>4次中心モーメント</td><td>cm⁴</td></tr>\n<tr><td>歪度・尖度</td><td>無次元</td></tr>\n</table>\n<p>歪度では $\\sigma^3$、尖度では $\\sigma^4$ で割るため単位が消えます。</p>\n</section>\n","1.6.3":"\n<section class=\"deep-reader-section\">\n<h2>チェビシェフの不等式は何を言っているのか</h2>\n<p>$$P(|X-\\mu|\\ge k\\sigma)\\le\\frac1{k^2}$$</p>\n<p>という式は、<b>平均から遠く離れた値を大量に置くと、分散が大きくならざるを得ない</b>という事実を数式にしたものです。</p>\n<p>逆に言えば、分散が $\\sigma^2$ だと分かっているなら、平均から $k$ 標準偏差以上離れる確率には上限があります。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>記号を全部読む</h2>\n<p>$X$ は確率変数、$\\mu=E[X]$ は母平均、$\\sigma^2=V(X)$ は母分散、$\\sigma$ は標準偏差、$k>0$ は固定された数字です。</p>\n<p>例えば $k=2$ なら</p>\n<p>$$|X-\\mu|\\ge2\\sigma$$</p>\n<p>は「平均から2標準偏差以上離れる」という意味です。絶対値なので左右両側を含みます。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>まず直感的に導く</h2>\n<p>平均から $k\\sigma$ 以上離れている確率を</p>\n<p>$$p=P(|X-\\mu|\\ge k\\sigma)$$</p>\n<p>と置きます。</p>\n<p>この遠い領域にいる値は必ず</p>\n<p>$$|X-\\mu|\\ge k\\sigma$$</p>\n<p>なので、二乗すると</p>\n<p>$$ (X-\\mu)^2\\ge k^2\\sigma^2.$$</p>\n<p>つまり遠い値1個あたり、少なくとも $k^2\\sigma^2$ の偏差平方を持っています。</p>\n<p>そのような値が全体の割合 $p$ だけ存在するなら、偏差平方の平均である分散は少なくとも</p>\n<p>$$p\\,k^2\\sigma^2$$</p>\n<p>必要です。</p>\n<p>ところが実際の分散は $\\sigma^2$ なので</p>\n<p>$$\\sigma^2\\ge p\\,k^2\\sigma^2.$$</p>\n<p>$\\sigma^2>0$ として両辺を割ると</p>\n<p>$$1\\ge pk^2$$</p>\n<p>$$p\\le\\frac1{k^2}.$$</p>\n<p>したがって</p>\n<p>$$\\boxed{P(|X-\\mu|\\ge k\\sigma)\\le\\frac1{k^2}}.$$</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>$k=2$ なら何%なのか</h2>\n<p>$$P(|X-\\mu|\\ge2\\sigma)\\le\\frac14=25\\%.$$</p>\n<p>外側が最大25%なので、内側は</p>\n<p>$$P(|X-\\mu|<2\\sigma)\\ge1-\\frac14=\\frac34=75\\%.$$</p>\n<p>「75%が入る」ではなく、<b>少なくとも75%は入る</b>という保証です。実際には95%でも99%でも構いません。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>正規分布の95.45%と何が違うのか</h2>\n<p>正規分布なら</p>\n<p>$$P(|X-\\mu|<2\\sigma)\\approx95.45\\%.$$</p>\n<p>一方Chebyshevは75%以上しか保証しません。かなり緩いですが、それは分布の形を一切仮定していないからです。</p>\n<p>平均と有限分散さえあれば、左右非対称でも多峰性でも成り立つ。情報が少ない代わりに非常に一般的です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>厳密な証明：指示関数を使う</h2>\n<p>事象</p>\n<p>$$A=\\{|X-\\mu|\\ge k\\sigma\\}$$</p>\n<p>を考え、指示関数 $1_A$ を</p>\n<p>$$1_A=\\begin{cases}1&A\\text{ が起きる}\\\\0&A\\text{ が起きない}\\end{cases}$$</p>\n<p>と定義します。</p>\n<p>すると</p>\n<p>$$E[1_A]=P(A).$$</p>\n<p>また $(X-\\mu)^2\\ge0$ なので、$A$ 以外の部分を捨てれば</p>\n<p>$$E[(X-\\mu)^2]\\ge E[(X-\\mu)^2 1_A].$$</p>\n<p>$A$ 上では $(X-\\mu)^2\\ge k^2\\sigma^2$ だから</p>\n<p>$$E[(X-\\mu)^2 1_A]\n\\ge E[k^2\\sigma^2 1_A].$$</p>\n<p>$k^2\\sigma^2$ は固定値なので</p>\n<p>$$=k^2\\sigma^2E[1_A]$$</p>\n<p>$$=k^2\\sigma^2P(A).$$</p>\n<p>左端は分散の定義から $\\sigma^2$ なので</p>\n<p>$$\\sigma^2\\ge k^2\\sigma^2P(A).$$</p>\n<p>よって</p>\n<p>$$P(A)\\le\\frac1{k^2}.$$</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>Markov不等式との関係</h2>\n<p>実はChebyshevは、非負確率変数 $Y$ に対するMarkov不等式</p>\n<p>$$P(Y\\ge a)\\le\\frac{E[Y]}{a}$$</p>\n<p>へ</p>\n<p>$$Y=(X-\\mu)^2,\\qquad a=k^2\\sigma^2$$</p>\n<p>を入れただけです。</p>\n<p>つまり</p>\n<p>$$P((X-\\mu)^2\\ge k^2\\sigma^2)\n\\le\n\\frac{E[(X-\\mu)^2]}{k^2\\sigma^2}\n=\n\\frac{\\sigma^2}{k^2\\sigma^2}\n=\n\\frac1{k^2}.$$</p>\n<p>分散が2次モーメントなので、尾確率の上限に $1/k^2$ が現れるというつながりがあります。</p>\n</section>\n","2.5.1":"\n<section class=\"deep-reader-section\">\n<h2>$E[\\ ]$ は何者か</h2>\n<p>$E$ は係数ではなく、<b>期待値を取る演算子</b>です。</p>\n<p>離散型なら</p>\n<p>$$E[X]=\\sum_x xP(X=x)$$</p>\n<p>連続型なら</p>\n<p>$$E[X]=\\int x f_X(x)\\,dx.$$</p>\n<p>「実際に100回測った平均」ではなく、確率分布が与えられたときに定まる理論上の平均です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>実際の標本平均とは別物</h2>\n<p>実際に $N$ 回観測した平均は</p>\n<p>$$\\bar X_N=\\frac1N\\sum_{i=1}^N X_i.$$</p>\n<p>これは標本を取り直すと変わる確率変数です。一方 $E[X]$ は分布が固定されれば1つの固定値です。</p>\n<p>大数の法則は</p>\n<p>$$\\bar X_N\\to E[X]$$</p>\n<p>という形で、「実際の平均が理論平均へ近づく」ことを述べます。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>なぜ期待値には分配法則が成り立つのか</h2>\n<p>例えば離散確率変数 $X,Y$ について</p>\n<p>$$E[X+Y]\n=\\sum_x\\sum_y(x+y)P(X=x,Y=y).$$</p>\n<p>普通の代数の分配法則を使えば</p>\n<p>$$=\n\\sum_x\\sum_yxP(X=x,Y=y)\n+\n\\sum_x\\sum_yyP(X=x,Y=y).$$</p>\n<p>第1項で $x$ は $y$ に依存しないので</p>\n<p>$$=\\sum_xx\\sum_yP(X=x,Y=y).$$</p>\n<p>周辺化により</p>\n<p>$$\\sum_yP(X=x,Y=y)=P(X=x)$$</p>\n<p>なので</p>\n<p>$$=\\sum_xxP(X=x)=E[X].$$</p>\n<p>第2項も同様に $E[Y]$。したがって</p>\n<p>$$\\boxed{E[X+Y]=E[X]+E[Y]}.$$</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>固定係数は外へ出せる</h2>\n<p>$$E[aX]=\\sum_x axP(X=x)$$</p>\n<p>$a$ は固定値なので</p>\n<p>$$=a\\sum_xxP(X=x)$$</p>\n<p>$$=aE[X].$$</p>\n<p>以上より</p>\n<p>$$\\boxed{E[aX+bY]=aE[X]+bE[Y]}.$$</p>\n<p>これを期待値の線形性と呼びます。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>独立性は必要ない</h2>\n<p>期待値の和の線形性</p>\n<p>$$E[X+Y]=E[X]+E[Y]$$</p>\n<p>には独立性は不要です。例えば $Y=X$ という完全依存でも</p>\n<p>$$E[X+Y]=E[2X]=2E[X]=E[X]+E[Y].$$</p>\n<p>一方</p>\n<p>$$E[XY]=E[X]E[Y]$$</p>\n<p>は一般には成り立たず、独立性など追加条件が必要です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>なぜ掛け算には分配できないのか</h2>\n<p>$Y=X$ とすると</p>\n<p>$$E[XY]=E[X^2]$$</p>\n<p>ですが</p>\n<p>$$E[X]E[Y]=E[X]^2.$$</p>\n<p>一般に</p>\n<p>$$E[X^2]-E[X]^2=V(X)$$</p>\n<p>なので、分散が0でない限り両者は一致しません。</p>\n</section>\n","2.5.2":"\n<section class=\"deep-reader-section\">\n<h2>分散は「期待値を使った2次中心モーメント」</h2>\n<p>$$V(X)=E[(X-\\mu)^2],\\qquad \\mu=E[X].$$</p>\n<p>ここでは、平均からのズレを二乗して、その理論上の平均を取っています。</p>\n<p>$X-\\mu$ の期待値だけでは0になるため、散らばりの大きさを残すため二乗します。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>$V(X)=E[X^2]-E[X]^2$ を1行ずつ導く</h2>\n<p>定義から</p>\n<p>$$V(X)=E[(X-\\mu)^2].$$</p>\n<p>二乗を展開します。</p>\n<p>$$=E[X^2-2\\mu X+\\mu^2].$$</p>\n<p>期待値の線形性を使います。</p>\n<p>$$=E[X^2]-2\\mu E[X]+E[\\mu^2].$$</p>\n<p>$\\mu$ は固定値なので $E[\\mu^2]=\\mu^2$。また $E[X]=\\mu$ です。</p>\n<p>$$=E[X^2]-2\\mu^2+\\mu^2$$</p>\n<p>$$=E[X^2]-\\mu^2.$$</p>\n<p>したがって</p>\n<p>$$\\boxed{V(X)=E[X^2]-E[X]^2}.$$</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>なぜ固定値を期待値の外へ出せるのか</h2>\n<p>$c$ が固定値なら</p>\n<p>$$E[cX]=cE[X]$$</p>\n<p>なので、$-2\\mu$ のような量は外へ出せます。$\\mu$ は未知かもしれませんが、頻度論では「未知だが固定された母数」です。未知であることと、確率変数であることは別です。</p>\n</section>\n\n<section class=\"deep-reader-section\">\n<h2>標本分散とは別の階層</h2>\n<p>$V(X)=\\sigma^2$ は母集団の理論量です。実際のデータからは $\\mu$ も $\\sigma^2$ も通常分からないため、$\\bar X$ や $S^2$ を使って推定します。</p>\n<p>つまり</p>\n<p>$$\\text{母分散 }\\sigma^2\\quad\\text{と}\\quad\\text{標本分散 }S^2$$</p>\n<p>は同じ概念の「真値」と「推定量」であって、同一の数式ではありません。</p>\n</section>\n"};
const TOPIC_MODULES=[[["尺度","名義","順序","間隔","比例"],"尺度水準を『許される演算』から理解する","\n<p>尺度水準は単なる用語暗記ではなく、<b>どの演算に意味があるか</b>を決めます。名義尺度では等しい/違う、順序尺度ではさらに大小、間隔尺度では差、比例尺度では比まで意味を持ちます。</p>\n<p>例えば摂氏温度では $20^\\circ C$ は $10^\\circ C$ の2倍の「温かさ」とは言えません。0点が任意だからです。一方、質量20 kgは10 kgの2倍と言えます。これが変動係数を比例尺度で使う理由にもつながります。</p>\n"],[["度数分布","ヒストグラム","階級幅"],"度数分布とヒストグラムの設計","\n<p>ヒストグラムでは、元データを区間にまとめることで形を見やすくします。その代わり、階級境界・階級幅を変えると見え方も変わります。</p>\n<p>階級幅を小さくしすぎると標本ノイズを拾い、大きくしすぎると多峰性や歪みを消します。これは後のKDEで帯域幅 $h$ を選ぶ問題と同じ<b>バイアス–分散のトレードオフ</b>です。</p>\n"],[["算術平均","平均と中央値","中央値","最頻値","刈り込み平均"],"位置統計量は『どの損失を小さくするか』で決まる","\n<p>平均は $\\sum_i(x_i-c)^2$ を最小にする $c$、中央値は $\\sum_i|x_i-c|$ を最小にする $c$ です。したがって平均と中央値の違いは「中心の好み」ではなく、<b>損失関数の違い</b>です。</p>\n<p>二乗損失は大きな誤差を強く罰するため平均は外れ値に敏感です。絶対損失は線形に増えるため中央値は頑健です。この構造は後の最小二乗回帰・L1回帰・M推定へそのままつながります。</p>\n"],[["四分位","IQR","範囲"],"範囲とIQRは分布のどこを見るかが違う","\n<p>範囲 $\\\\max-\\min$ は両端の2点だけで決まり、1つの極端値で大きく変わります。IQR $=Q_3-Q_1$ は中央50%の幅なので、端の極端値を無視して中心部分の散らばりを見ます。</p>\n<p>したがってIQRは頑健ですが、尾部の情報を捨てています。何を「散らばり」と呼びたいかによって指標が変わります。</p>\n"],[["標準化"],"標準化は座標の原点と単位を変える","\n<p>$$Z=\\frac{X-\\mu}{\\sigma}$$</p>\n<p>では、まず $\\mu$ を引いて平均を0へ移し、次に $\\sigma$ で割って「1標準偏差」を新しい1単位にします。したがって $Z=2$ は「平均より2標準偏差上」です。</p>\n<p>標準化は物理単位を消して比較可能にしますが、元の単位の直感は失われます。PCAや回帰で標準化するかどうかは、単なる前処理ではなく『どの尺度で距離を測るか』というモデリング判断です。</p>\n"],[["共分散","ピアソン相関"],"共分散と相関の違い","\n<p>共分散</p>\n<p>$$Cov(X,Y)=E[(X-\\mu_X)(Y-\\mu_Y)]$$</p>\n<p>は、$X$と$Y$が同じ向きにずれると正、逆向きなら負になります。単位は $X$ の単位×$Y$ の単位です。</p>\n<p>相関は</p>\n<p>$$\\rho=\\frac{Cov(X,Y)}{\\sigma_X\\sigma_Y}$$</p>\n<p>と標準偏差で割って無次元化したものです。したがって尺度変更に強く、$-1$〜$1$に収まります。ただし相関0は一般に独立を意味しません。</p>\n"],[["順位相関","Spearman","Kendall"],"順位相関は値そのものより順序を残す","\n<p>順位相関では元の数値を順位へ置き換えます。そのため単調増加・単調減少の関係を捉えやすく、極端な値の大きさに引っ張られにくくなります。</p>\n<p>一方で、10と11の差と10と1000の差が順位上は同じ1段差になり得るため、距離情報は失います。頑健性と情報量の交換です。</p>\n"],[["M 推定","影響関数","破綻点","頑健"],"頑健統計は『少数の異常値で推定が壊れない』ことを設計する","\n<p>M推定は</p>\n<p>$$\\hat\\theta=\\arg\\min_\\theta\\sum_i\\rho(x_i-\\theta)$$</p>\n<p>と損失関数 $\\rho$ を一般化します。平均は二乗損失、中央値は絶対損失の特殊例です。</p>\n<p>影響関数はごく小さな汚染が推定量をどれだけ動かすか、破綻点は何割の汚染で推定を無限に壊せるかを測ります。頑健性は「外れ値を消す」ことではなく、<b>外れ値が存在しても推定手続き全体が極端に支配されないようにする</b>考えです。</p>\n"],[["カーネル密度","帯域幅"],"KDEはヒストグラムの『箱』を滑らかな山へ置き換える","\n<p>典型的なKDEは</p>\n<p>$$\\hat f_h(x)=\\frac1{nh}\\sum_{i=1}^nK\\!\\left(\\frac{x-X_i}{h}\\right).$$</p>\n<p>各データ点へ小さな山 $K$ を置き、その平均を密度とします。$h$ は山の幅で、小さいとギザギザ、大きいと滑らかになります。</p>\n<p>$h$ を小さくするとバイアスは減り分散は増え、大きくすると逆になります。したがって帯域幅選択は典型的なバイアス–分散問題です。</p>\n"],[["確率空間","標本空間","事象","Kolmogorov"],"確率空間は『起こり得る世界』を形式化する","\n<p>確率空間 $(\\\\Omega,\\\\mathcal F,P)$ では、$\\\\Omega$ が基本結果全体、$\\\\mathcal F$ が確率を割り当てられる事象の集合、$P$ が各事象へ0〜1を割り当てる関数です。</p>\n<p>有限サイコロでは全ての部分集合に確率を付けても問題ありませんが、連続空間では測度論的な矛盾を避けるため $\\\\mathcal F$ を指定します。</p>\n"],[["条件付き確率"],"条件付き確率は『情報を得た後に標本空間を絞る』","\n<p>$$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}$$</p>\n<p>は、$B$ が起きたという情報を得た後、世界を $B$ の中だけに絞り、その中で $A$ が占める割合を再計算しています。</p>\n<p>$P(A\\mid B)$ と $P(B\\mid A)$ は一般に異なります。条件の向きを逆にしないことが、Bayes・診断検査・因果推論で最重要です。</p>\n"],[["全確率","ベイズの定理","ベイズ"],"Bayesの定理は『逆向きの条件付き確率』を事前確率で補正する","\n<p>$$P(A\\mid B)=\\frac{P(B\\mid A)P(A)}{P(B)}.$$</p>\n<p>分子は「Aが元々どれくらい起こりやすいか」×「AならBがどれくらい起こりやすいか」。分母はB全体の起こりやすさで正規化しています。</p>\n<p>したがってBayesは単なる公式変形ではなく、<b>証拠Bを得た後にAへの信念を更新する</b>規則です。</p>\n"],[["独立"],"独立は『片方を知ってももう片方の確率が変わらない』","\n<p>独立なら</p>\n<p>$$P(A\\cap B)=P(A)P(B)$$</p>\n<p>であり、$P(B)>0$なら $P(A\\mid B)=P(A)$ です。つまりBを知ってもAへの情報が増えません。</p>\n<p>無相関 $Cov(X,Y)=0$ より強い条件です。正規分布のような特別な場合を除き、無相関でも非線形依存は残り得ます。</p>\n"],[["確率変数","分布関数"],"確率変数は『結果を数値へ写す関数』","\n<p>確率変数 $X$ は、標本空間の結果 $\\\\omega$ を実数へ写す関数 $X(\\\\omega)$ です。名前に「変数」とありますが、数学的には関数です。</p>\n<p>分布関数 $F_X(x)=P(X\\\\le x)$ は、どの閾値$x$までにどれだけ確率が累積したかを表し、離散・連続の両方で使える共通言語です。</p>\n"],[["離散と連続","離散","連続"],"離散型と連続型で『確率の置き場所』が違う","\n<p>離散型では一点に正の確率 $P(X=x)$ を置けます。連続型では一点の確率は0で、区間確率を密度の面積</p>\n<p>$$P(a<X<b)=\\int_a^bf(x)\\,dx$$</p>\n<p>で求めます。</p>\n<p>密度 $f(x)$ は確率そのものではなく「単位$x$あたりの確率の濃さ」なので、値が1を超えても問題ありません。</p>\n"],[["分位関数","分位"],"分位点はCDFを逆向きに読む","\n<p>CDFが「値$x$→累積確率$F(x)$」なら、分位関数は「確率$p$→その位置$x$」です。</p>\n<p>$$Q(p)=F^{-1}(p).$$</p>\n<p>中央値は $Q(0.5)$、第1四分位点は $Q(0.25)$。逆関数法による乱数生成でもこの関係をそのまま使います。</p>\n"],[["期待値"],"期待値は『確率で重み付けした理論平均』","\n<p>離散型なら</p>\n<p>$$E[g(X)]=\\sum_xg(x)P(X=x),$$</p>\n<p>連続型なら</p>\n<p>$$E[g(X)]=\\int g(x)f_X(x)\\,dx.$$</p>\n<p>実際に何回か測った平均ではなく、分布から定義される理論値です。$g(X)=X$なら平均、$g(X)=(X-\\mu)^2$なら分散になります。</p>\n"],[["分散とモーメント","分散"],"分散は『平均からの二乗距離の期待値』","\n<p>$$V(X)=E[(X-\\mu)^2]=E[X^2]-E[X]^2.$$</p>\n<p>二乗する理由は正負の打消しを防ぎ、大きな偏差を強く評価するためです。元の単位が$u$なら分散は$u^2$、標準偏差は$u$です。</p>\n"],[["モーメント母関数","特性関数"],"母関数は分布の情報を関数へ圧縮する","\n<p>モーメント母関数</p>\n<p>$$M_X(t)=E[e^{tX}]$$</p>\n<p>を $t=0$ で繰り返し微分すると $E[X^k]$ が取り出せます。特性関数 $\\\\varphi_X(t)=E[e^{itX}]$ は常に存在し、独立和では積になるため極限定理の証明に便利です。</p>\n"],[["Bernoulli","二項"],"Bernoulli・二項分布は0/1試行の積み上げ","\n<p>Bernoulli変数 $X_i\\\\in\\\\{0,1\\\\}$ を独立に $n$ 回行い、成功数</p>\n<p>$$S_n=\\sum_{i=1}^nX_i$$</p>\n<p>を数えると二項分布になります。平均は $np$、分散は $np(1-p)$。確率変数の和として理解すると、後のCLTとの接続も見えます。</p>\n"],[["Poisson"],"Poisson分布は一定率で起こるイベント数のモデル","\n<p>単位区間あたり平均率 $\\\\lambda$ の独立なイベント数をモデル化し、平均と分散がともに $\\\\lambda$ です。</p>\n<p>小さい確率のBernoulli試行を大量に重ねる極限としても現れます。観測データで分散が平均より大きい場合は過分散を疑います。</p>\n"],[["正規分布","正規"],"正規分布は平均と分散で完全に決まる特別な分布","\n<p>$$X\\sim N(\\mu,\\sigma^2)$$</p>\n<p>では $\\mu$ が位置、$\\sigma$ が幅を決めます。標準化 $Z=(X-\\mu)/\\sigma$ により $N(0,1)$ へ変換できます。</p>\n<p>正規分布が重要なのは、測定誤差などに自然に現れるだけでなく、CLTにより多数の独立な小さな寄与の和・平均が近似的に正規になるからです。</p>\n"],[["指数分布","Gamma","ガンマ"],"指数・GammaはPoisson過程の待ち時間とつながる","\n<p>Poisson過程で次の1イベントまでの待ち時間が指数分布、$k$イベントまでの待ち時間がGamma分布になります。</p>\n<p>指数分布はmemoryless性 $P(T>s+t\\mid T>s)=P(T>t)$ を持ち、一定ハザードの寿命モデルにもなります。</p>\n"],[["同時分布","周辺分布","条件付き分布"],"同時・周辺・条件付きは『情報を足す/消す』操作","\n<p>同時分布は $(X,Y)$ の組の全情報を持ちます。周辺分布は一方を和・積分で消し、条件付き分布は一方を知った後のもう一方の分布へ絞ります。</p>\n<p>$$f_X(x)=\\int f_{X,Y}(x,y)\\,dy,\\qquad\nf_{X\\mid Y}(x\\mid y)=\\frac{f_{X,Y}(x,y)}{f_Y(y)}.$$</p>\n"],[["条件付き期待値","全分散"],"条件付き期待値は『情報を知った後の平均』","\n<p>$E[X\\mid Y]$ は $Y$ が分かった後の $X$ の平均で、$Y$ の関数です。全期待値の法則</p>\n<p>$$E[X]=E[E[X\\mid Y]]$$</p>\n<p>は「条件ごとの平均を、その条件の起こりやすさでさらに平均すれば全体平均に戻る」という意味です。</p>\n<p>全分散公式</p>\n<p>$$V(X)=E[V(X\\mid Y)]+V(E[X\\mid Y])$$</p>\n<p>は「群内ばらつき＋群間ばらつき」というANOVAと同じ構造です。</p>\n"],[["変数変換","ヤコビアン"],"変数変換では確率質量を保存するため密度を補正する","\n<p>$Y=g(X)$ へ座標変換すると、同じ確率が別の幅へ引き伸ばされます。そのため密度には</p>\n<p>$$f_Y(y)=f_X(x)\\left|\\frac{dx}{dy}\\right|$$</p>\n<p>の補正が必要です。多変量ではJacobian行列式が体積変化率になります。</p>\n"],[["デルタ法"],"デルタ法はTaylor一次近似で分布を移す","\n<p>$\\hat\\theta$がほぼ正規でも $g(\\hat\\theta)$ の分布は直接分からないことがあります。そこで</p>\n<p>$$g(\\hat\\theta)\\approx g(\\theta)+g'(\\theta)(\\hat\\theta-\\theta)$$</p>\n<p>と局所線形化し、</p>\n<p>$$V(g(\\hat\\theta))\\approx[g'(\\theta)]^2V(\\hat\\theta)$$</p>\n<p>を得ます。</p>\n"],[["Markov","チェビシェフ","不等式"],"確率不等式は『分布形を知らなくても尾を抑える』","\n<p>Markovは非負確率変数 $Y$ に対して</p>\n<p>$$P(Y\\ge a)\\le \\frac{E[Y]}a.$$</p>\n<p>Chebyshevは $Y=(X-\\mu)^2$ と置いた特殊例です。強い分布仮定を置かない代わりに、境界は保守的になります。</p>\n"],[["収束の種類","確率収束","分布収束","概収束"],"確率変数の『収束』には強さがある","\n<p>確率収束は大きく外れる確率が0へ、概収束はほぼ全ての標本経路で値そのものが近づき、分布収束はCDFが近づくことを言います。</p>\n<p>一般に概収束⇒確率収束⇒分布収束という方向の含意があります。どの収束概念を使っているかで定理の強さが変わります。</p>\n"],[["大数の法則","弱法則","強法則"],"大数の法則は標本平均の安定性を保証する","\n<p>$$\\bar X_n=\\frac1n\\sum_{i=1}^nX_i$$</p>\n<p>が母平均 $\\mu$ へ近づくという定理です。個々の $X_i$ が $\\mu$ に近づくわけではありません。</p>\n<p>弱法則は確率収束、強法則は概収束という、より強い意味での収束を主張します。</p>\n"],[["中心極限定理","Berry–Esseen"],"CLTは平均の誤差を標準正規へ変換する","\n<p>$$\\frac{\\bar X_n-\\mu}{\\sigma/\\sqrt n}\\Rightarrow N(0,1).$$</p>\n<p>大数の法則が「どこへ行くか」を、CLTは「どんな形で揺れるか」を教えます。標準誤差 $\\\\sigma/\\sqrt n$、信頼区間、検定はここから生まれます。</p>\n<p>Berry–Esseenは有限$n$で正規近似がどのくらい速いかを上界で評価します。</p>\n"],[["標準誤差"],"標準誤差は『推定量そのものの標準偏差』","\n<p>個々のデータの標準偏差が $\\sigma$ でも、標本平均の標準偏差は</p>\n<p>$$SE(\\bar X)=\\frac{\\sigma}{\\sqrt n}.$$</p>\n<p>標本数を4倍にするとSEは半分です。標準偏差SDと標準誤差SEを混ぜないことが区間推定の基本です。</p>\n"],[["最大値の分布","Fisher–Tippett","極値"],"極値理論は平均ではなく最大・最小の尾を扱う","\n<p>独立同分布の最大値 $M_n=\\max X_i$ なら</p>\n<p>$$P(M_n\\le x)=F(x)^n.$$</p>\n<p>適切に位置・尺度を正規化した最大値の極限はGEV族へ向かいます。平均にCLTがあるように、最大値には極値理論があります。</p>\n"],[["信頼性指標"],"信頼性指標βは破壊確率を標準正規の距離へ写す","\n<p>$$P_f=\\Phi(-\\beta)$$</p>\n<p>と対応付けることで、非常に小さい破壊確率を「標準正規で何σ離れているか」という距離尺度へ変換します。FORMでは幾何学的な最短距離として現れます。</p>\n"],[["乗法原理","二項係数","包除","数え上げ"],"数え上げは確率計算の前段階","\n<p>有限で等確率な場合、確率は場合の数の比です。したがって順序を区別するか、復元するか、重複を許すかを先に決めます。</p>\n<p>二項係数 $\\\\binom nr$ は、順序ありで数えた同じ選択を $r!$ 回ずつ重複しているので割る、という構造です。</p>\n"],[["モンティ","検察官","条件付き独立"],"条件付き確率の落とし穴は『何を条件にしたか』","\n<p>Monty Hallでは司会者の行動規則が情報を持ちます。検察官の誤謬では $P(証拠\\mid 無罪)$ と $P(無罪\\mid 証拠)$ を取り違えます。</p>\n<p>どの確率でも、縦棒 $\\\\mid$ の右側は「すでに知っている世界」です。条件を変えると分母となる世界そのものが変わります。</p>\n"],[["母集団","標本","統計量","推定量","推定値"],"母数・推定量・推定値を3階層で分ける","\n<p>母数 $\\theta$ は母集団側の未知だが固定の量。推定量 $\\hat\\Theta(X_1,\\ldots,X_n)$ は標本を取る前には確率変数。実際のデータを入れた $\\hat\\theta$ は今回の固定された推定値です。</p>\n<p>統計学ではこの3階層を混ぜないことが非常に重要です。</p>\n"],[["標本分布"],"標本分布は『同じ推定量を標本抽出ごとに計算した分布』","\n<p>一つの標本から得た $\\bar x$ だけを見るのではなく、標本を何度も取り直して $\\bar X$ を計算したときの分布を考えます。これが標本分布です。</p>\n<p>標準誤差・信頼区間・検定は全て推定量の標本分布に基づきます。</p>\n"],[["χ²","t 分布","t$ 分布","F 分布"],"χ²・t・Fは正規標本の平方和・比から生まれる","\n<p>標準正規変数の平方和がχ²、正規変数を独立なχ²由来の尺度で割るとt、2つのχ²を自由度で割った比がFです。</p>\n<p>これらは暗記すべき別々の分布というより、<b>正規母集団から平均と分散を同時に推定すると自然に現れる親戚</b>です。</p>\n"],[["不偏性","一致性","有効性"],"推定量の良さには複数の軸がある","\n<p>不偏性は $E[\\hat\\theta]=\\theta$、一致性は $n\\to\\infty$ で $\\hat\\theta\\to\\theta$、有効性は同条件で分散が小さいことです。</p>\n<p>有限標本バイアスが少しあってもMSEが小さい推定量はあり、何を最適化するかで「良い推定量」が変わります。</p>\n"],[["平均二乗誤差","MSE"],"MSEはバイアスと分散を1つにまとめる","\n<p>$$MSE(\\hat\\theta)=E[(\\hat\\theta-\\theta)^2]\n=V(\\hat\\theta)+Bias(\\hat\\theta)^2.$$</p>\n<p>不偏性だけを見ると分散が巨大でもよいことになります。MSEは「中心のズレ」と「標本ごとの揺れ」を両方罰します。</p>\n"],[["モーメント法"],"モーメント法は理論モーメントと標本モーメントを一致させる","\n<p>母分布の理論モーメント $E_\\theta[X^k]$ を、標本モーメント $(1/n)\\sum X_i^k$ に等しいと置いて未知母数を解きます。</p>\n<p>計算が簡単な一方、最尤法より効率が低いこともあります。『母集団の特徴量を標本の特徴量で置き換える』という非常に直接的な推定法です。</p>\n"],[["尤度","最尤"],"尤度はデータを固定して母数を動かす","\n<p>確率モデル $f(x\\mid\\theta)$ を観測後に</p>\n<p>$$L(\\theta;x)=f(x\\mid\\theta)$$</p>\n<p>として $\\theta$ の関数と見ます。確率密度としての変数は$x$、尤度としての変数は$\\theta$です。</p>\n<p>最尤推定は観測データを最も相対的に説明しやすい $\\theta$ を選びます。</p>\n"],[["スコア","Fisher 情報","Fisher情報"],"スコアとFisher情報は尤度の傾きと曲率","\n<p>スコア</p>\n<p>$$U(\\theta)=\\frac{\\partial}{\\partial\\theta}\\ell(\\theta)$$</p>\n<p>は対数尤度の傾き。Fisher情報はその変動または負の期待曲率で、データが母数についてどれほど情報を持つかを表します。</p>\n<p>情報が大きいほどMLEの漸近分散は小さくなります。</p>\n"],[["漸近正規"],"漸近正規性は『大標本では推定誤差が正規に見える』","\n<p>多くの正則条件下で</p>\n<p>$$\\sqrt n(\\hat\\theta-\\theta_0)\\Rightarrow N(0,I(\\theta_0)^{-1}).$$</p>\n<p>この結果により、複雑なMLEでも標準誤差・Wald区間・検定を近似的に作れます。</p>\n"],[["Cramér","Cramer"],"Cramér–Rao下限は不偏推定量の分散の理論的下限","\n<p>正則条件下で不偏推定量 $\\hat\\theta$ は</p>\n<p>$$V(\\hat\\theta)\\ge\\frac1{I(\\theta)}$$</p>\n<p>を満たします。Fisher情報が大きいほど、原理的により精密な推定が可能です。下限に達する推定量は効率的です。</p>\n"],[["十分統計量","Rao–Blackwell"],"十分統計量は母数について必要な情報を失わない圧縮","\n<p>十分統計量 $T(X)$ を知れば、元データの残り部分が母数について追加情報を持たない、という意味です。</p>\n<p>Rao–Blackwellは任意の推定量を十分統計量で条件付き期待値化すると、同じ期待値で分散を小さくできることを示します。</p>\n"],[["信頼区間","被覆確率"],"信頼区間は『真値に確率を付ける』のではない","\n<p>頻度論では真の母数 $\\theta$ は固定です。ランダムなのは標本から作る区間 $C(X)$ で、</p>\n<p>$$P_\\theta(\\theta\\in C(X))=0.95$$</p>\n<p>という長期被覆率を保証します。</p>\n<p>観測後の具体的区間について「$\\theta$が95%の確率で入る」と読むのはBayes信用区間の解釈と混ざります。</p>\n"],[["ピボット"],"ピボット法は母数を含むが分布が母数に依存しない量を作る","\n<p>例えば既知σなら</p>\n<p>$$Z=\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\sim N(0,1).$$</p>\n<p>この分布が未知母数$\\mu$に依存しないので、確率不等式を$\\mu$について解けば信頼区間になります。</p>\n"],[["Wilson","Clopper","Wald"],"二項比率区間は有限標本で方法差が大きい","\n<p>Wald区間は単純な正規近似ですが境界0/1付近で被覆が悪くなります。WilsonはScore検定の反転、Clopper–Pearsonは正確二項分布の反転です。</p>\n<p>同じ「95%区間」でも、有限標本では被覆率と幅の性質が異なります。</p>\n"],[["ブートストラップ"],"Bootstrapは標本を『経験分布』として再標本化する","\n<p>未知母集団 $F$ の代わりに観測標本の経験分布 $\\hat F_n$ を使い、そこから復元抽出して推定量を繰り返し計算します。</p>\n<p>目的はデータを増やすことではなく、<b>推定量の標本分布を近似する</b>ことです。</p>\n"],[["ジャックナイフ"],"Jackknifeは1点ずつ抜いた変化からバイアス・分散を測る","\n<p>$n$個のデータから1点ずつ除いた $n$ 個の推定値を作り、推定量が1点にどれくらい依存するかを利用してバイアス・分散を近似します。</p>\n<p>影響関数の有限標本版に近い発想です。</p>\n"],[["帰無仮説","対立仮説"],"仮説検定は『H0を一旦仮定した世界』から出発する","\n<p>$H_0$を真と仮定し、その下で検定統計量がどのように揺れるかを計算します。観測結果がその世界で極端なら $H_0$ を棄却します。</p>\n<p>棄却できないことは $H_0$ の真を証明したことではありません。</p>\n"],[["二種類の過誤","有意水準","検出力"],"第I種・第II種過誤は片方を下げれば他方が増えやすい","\n<p>第I種過誤 $\\alpha$ は真の$H_0$を棄却、第II種過誤 $\\beta$ は偽の$H_0$を棄却できないこと。検出力は $1-\\beta$ です。</p>\n<p>同じ標本数なら棄却基準を厳しくして$\\alpha$を下げるほど検出力も下がりやすく、標本数設計が重要になります。</p>\n"],[["検定統計量","棄却域","片側","両側"],"片側・両側はデータを見る前に方向を決める","\n<p>片側検定は一方向の極端さだけへ有意水準を配分し、その方向の検出力を上げます。両側検定は両方向へ $\\alpha/2$ ずつ配ります。</p>\n<p>データを見て都合のよい方向へ片側化すると名目有意水準が崩れます。</p>\n"],[["Neyman–Pearson"],"Neyman–Pearson補題は単純仮説間で尤度比検定が最強","\n<p>$H_0:\\theta=\\theta_0$ と $H_1:\\theta=\\theta_1$ の単純仮説では、尤度比が大きいとき棄却する検定が、同じ第I種過誤率の中で最大検出力を持ちます。</p>\n"],[["尤度比検定","Wald 検定","スコア検定"],"LR・Wald・Scoreは同じ尤度曲面を別の場所から測る","\n<p>LRは制約あり/なし最大尤度の差、Waldは推定値と帰無値の距離、Scoreは帰無値での傾きを使います。大標本では漸近的に同じχ²分布へ近づきます。</p>\n"],[["p 値","p値"],"p値は『H0の下で今以上に極端なデータの確率』","\n<p>$$p=P(T\\text{が観測値以上に極端}\\mid H_0).$$</p>\n<p>$P(H_0\\mid data)$ではありません。また効果の大きさでもありません。大標本なら小さな効果でも非常に小さいp値になり得ます。</p>\n"],[["z 検定","t 検定","Welch"],"zとtの違いは分散推定の追加不確実性","\n<p>母標準偏差σ既知ならz、未知で標本標準偏差Sへ置き換えるとt分布が現れます。Welch t検定は2群の等分散を仮定せず、各群の分散を別々に使います。</p>\n"],[["χ² 検定","F 検定","分散の検定"],"分散検定は正規標本の平方和分布を使う","\n<p>正規母集団では</p>\n<p>$$\\frac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2_{n-1}.$$</p>\n<p>2つの独立なχ²を自由度で割った比がFになるため、分散比検定にF分布が現れます。</p>\n"],[["分割表","適合度","独立性の検定"],"χ²統計量は観測度数と期待度数の差を規格化して足す","\n<p>$$X^2=\\sum\\frac{(O-E)^2}{E}.$$</p>\n<p>期待度数からのズレを、そのセルの典型的変動スケール $\\\\sqrt E$ で見ています。自由度は総数制約や推定パラメータの数だけ減ります。</p>\n"],[["ノンパラメトリック","Wilcoxon","Mann–Whitney","Kruskal","符号検定","並べ替え"],"ノンパラメトリックは『仮定ゼロ』ではなく別の情報を使う","\n<p>順位・符号・交換可能性などを使い、正規分布のような具体的分布形への依存を弱めます。その代わり、順位へ変えることで距離情報を捨てることもあります。</p>\n"],[["効果量","Cohen"],"効果量は『どれくらい違うか』を標本数から分離する","\n<p>Cohenの$d$は平均差を標準偏差で割って無次元化します。p値と違い、標本数が大きいだけで自動的に大きくなる尺度ではありません。</p>\n"],[["多重比較","Bonferroni","Holm","Benjamini","FDR","FWER"],"多重検定は『試行回数を増やすと偶然の当たりも増える』","\n<p>FWERは1個でも偽陽性が出る確率、FDRは棄却した中での偽発見割合の期待値です。Bonferroni/HolmはFWER、BHはFDRを主に制御します。</p>\n"],[["同等性検定"],"同等性検定は『差が小さい』を帰無仮説の組み方から変える","\n<p>通常検定の非有意は「差がない」の証明ではありません。同等性検定では実務上意味のある最小差 $\\\\Delta$ を決め、差が $[-\\\\Delta,\\Delta]$ 内にあることを検証します。</p>\n"],[["単回帰","最小二乗","残差"],"回帰は条件付き平均と残差へ分解する","\n<p>$$Y_i=\\beta_0+\\beta_1x_i+\\varepsilon_i.$$</p>\n<p>OLSは残差平方和を最小化します。切片ありOLSでは残差和0、説明変数と残差の内積0という直交性が最適条件から生まれます。</p>\n"],[["決定係数","R²","R^2"],"R²は標本内の平方和分解の割合","\n<p>切片あり回帰で</p>\n<p>$$R^2=1-\\frac{RSS}{TSS}.$$</p>\n<p>訓練標本内でどれだけ変動を説明したかであり、因果性・正しいモデル・外挿性能を保証しません。</p>\n"],[["正規方程式","ハット行列","射影"],"重回帰は高次元空間への直交射影","\n<p>OLSの一階条件</p>\n<p>$$X^T(y-X\\hat\\beta)=0$$</p>\n<p>は残差が説明変数空間に直交することを意味します。ハット行列 $H=X(X^TX)^{-1}X^T$ は $y$ をその空間へ射影します。</p>\n"],[["Gauss–Markov"],"Gauss–MarkovはOLSがBLUEになる条件を言う","\n<p>線形モデル、$E[\\varepsilon\\mid X]=0$、等分散・無相関などの条件下で、OLSは線形不偏推定量の中で最小分散です。正規性はBLUEのためには不要で、厳密なt/F推論のために追加されます。</p>\n"],[["多重共線性"],"多重共線性は予測より係数解釈を不安定にする","\n<p>説明変数同士が強く相関すると $X^TX$ がほぼ特異になり、係数の分散が大きくなります。予測の線形結合は安定でも、個々の係数の符号・大きさが標本で大きく変わることがあります。</p>\n"],[["レバレッジ","Cook","影響点"],"影響点はY方向の外れとX空間の遠さを分けて見る","\n<p>レバレッジ $h_{ii}$ はX空間でどれほど遠いか、studentized residualはY方向のズレ、Cook距離はその点を除いたとき回帰全体がどれほど動くかを測ります。</p>\n"],[["不均一分散","頑健標準誤差","サンドイッチ"],"不均一分散はOLS係数より標準誤差公式をまず壊す","\n<p>$E[\\varepsilon\\mid X]=0$ が正しければOLS係数は一定条件下で一致しますが、通常の $Var(\\varepsilon\\mid X)=\\sigma^2$ を使うSEが誤ります。</p>\n<p>サンドイッチ推定量は分散構造を柔軟にし、HC3等は有限標本補正を加えます。</p>\n"],[["AIC","BIC","変数選択"],"情報量規準は適合度と複雑さを同時に罰する","\n<p>訓練尤度だけなら複雑なモデルほど良くなりがちです。AIC/BICは</p>\n<p>$$-2\\log L+\\text{penalty}$$</p>\n<p>の形で複雑さへ罰則を加えます。AICは予測寄り、BICは真モデル選択の漸近的一貫性を重視する性質があります。</p>\n"],[["GLM","ロジスティック","ポアソン回帰","IRLS"],"GLMは平均と線形予測子をリンク関数で結ぶ","\n<p>$$g(E[Y\\mid X])=X\\beta.$$</p>\n<p>ロジスティックではlogit、Poissonではlogを使い、平均が許される範囲に収まるよう変換します。IRLSは尤度方程式を重み付き最小二乗として反復的に解きます。</p>\n"],[["混合効果","変量効果","ランダム効果"],"混合効果モデルは階層による相関を明示する","\n<p>同じ個人・建物・ロット内の観測は共通要因で相関します。ランダム切片・傾きを入れることで、群間差と群内誤差を分けてモデル化します。</p>\n"],[["ANOVA","一元配置","平方和"],"ANOVAは全変動を群間と群内へ分ける","\n<p>$$Y_{ij}-\\bar Y=(\\bar Y_i-\\bar Y)+(Y_{ij}-\\bar Y_i).$$</p>\n<p>これを二乗して足すと交差項が消え、全平方和=群間平方和+群内平方和。F比は「群効果＋ノイズ」を「ノイズ」で割る構造です。</p>\n"],[["交互作用"],"交互作用は『一方の効果が他方の水準で変わる』","\n<p>加法モデルならAの効果はBのどの水準でも同じです。交互作用項があると、その差そのものがBによって変わります。交互作用図では線の非平行性として現れます。</p>\n"],[["乱塊","split-plot","分割法"],"ブロック化・split-plotは実験の無作為化単位をモデルへ反映する","\n<p>ブロック化は既知の nuisance variation を取り除きます。split-plotでは因子ごとに無作為化単位が違うため、誤差項も階層化します。</p>\n"],[["実験計画","無作為化","反復"],"実験計画の質は解析より前に決まる","\n<p>無作為化は交絡を平均化、反復は誤差分散を推定、局所管理は既知変動を減らします。悪いデータ生成を高度な解析で完全に救うことはできません。</p>\n"],[["2^k","要因配置","直交表","一部実施"],"要因実験は主効果と交互作用を直交的に分ける","\n<p>$-1,+1$符号化すると、直交設計では主効果・交互作用の推定が互いに独立に近くなります。一部実施では実験数を減らす代わりにaliasingが生じます。</p>\n"],[["応答曲面"],"応答曲面法は実験計画と最適化の橋","\n<p>最適付近で二次式を当て、勾配と曲率から最適条件を探します。単なる回帰ではなく、次にどこを実験するかという逐次設計と組み合わせます。</p>\n"],[["共分散行列","平均ベクトル"],"多変量では分散が行列になる","\n<p>共分散行列 $\\Sigma$ の対角は各変数の分散、非対角は共分散です。任意方向$a$の分散は</p>\n<p>$$V(a^TX)=a^T\\Sigma a\\ge0.$$</p>\n<p>この二次形式がPCA・Mahalanobis距離・多変量正規の幾何の中心です。</p>\n"],[["Mahalanobis"],"Mahalanobis距離は共分散で白色化した距離","\n<p>$$d_M^2=(x-\\mu)^T\\Sigma^{-1}(x-\\mu).$$</p>\n<p>分散が大きい方向の差を軽く、分散が小さい方向の差を重くし、相関方向も補正します。</p>\n"],[["PCA","主成分"],"PCAは分散最大方向を順に探す固有値問題","\n<p>単位ベクトル$a$へ射影した分散は $a^T\\Sigma a$。$a^Ta=1$ の下で最大化すると</p>\n<p>$$\\Sigma a=\\lambda a.$$</p>\n<p>最大固有値の固有ベクトルが第1主成分です。固有値はその主成分の分散です。</p>\n"],[["SVD"],"SVDはデータ行列からPCAを直接得る","\n<p>中心化データ $X=UDV^T$ とすると、$V$ の列が主成分方向、$D^2/(n-1)$ が共分散行列の固有値です。</p>\n<p>数値計算では共分散行列を明示的に作らずSVDする方が安定なことがあります。</p>\n"],[["因子分析"],"因子分析は観測相関を潜在因子で説明する生成モデル","\n<p>$$X=\\Lambda F+\\varepsilon.$$</p>\n<p>PCAが総分散を圧縮するのに対し、因子分析は共通因子が共分散を生み、独自誤差が残るというモデルを置きます。</p>\n"],[["k-means","クラスター"],"クラスタリングは『似ている』の定義が先","\n<p>距離尺度・標準化・linkageを変えるとクラスタは変わります。k-meansは群内平方和最小化で、局所最適と初期値に依存します。</p>\n"],[["判別","Fisher の線形判別"],"Fisher判別は群間距離を群内分散で規格化する","\n<p>2群なら</p>\n<p>$$J(w)=\\frac{(w^T\\mu_1-w^T\\mu_2)^2}{w^TS_Ww}$$</p>\n<p>を最大化し、群平均を離しつつ群内散らばりを小さくする方向を探します。</p>\n"],[["次元の呪い"],"次元の呪いは高次元でデータ密度が急速に薄くなること","\n<p>次元が増えると同じ標本数でも空間を覆えず、最近傍までの距離が大きくなります。距離・密度・局所平均を使う手法が不安定になります。</p>\n"],[["事前","事後","尤度"],"Bayes更新は事前×尤度を正規化して事後にする","\n<p>$$p(\\theta\\mid y)\\propto p(y\\mid\\theta)p(\\theta).$$</p>\n<p>事前はデータ前の不確実性、尤度はデータと各母数の整合度、事後はデータ後の不確実性です。</p>\n"],[["共役"],"共役事前は更新後も同じ分布族へ戻る","\n<p>Beta–Binomial、Gamma–Poisson、Normal–Normalなどでは、事後パラメータが『事前情報＋データ情報』の形になります。計算の簡単さと更新の可視性が利点です。</p>\n"],[["Jeffreys","弱情報","無情報"],"事前分布は『何も言わない』より『どこまで言うか』を明示する","\n<p>一様事前はパラメータ変換で一様でなくなるため、完全な無情報性は座標依存です。Jeffreys事前はFisher情報で変換不変性を持たせます。</p>\n<p>実務では弱情報事前と事前予測チェックで、あり得ない領域だけを抑える設計が有効です。</p>\n"],[["事後予測"],"事後予測は母数不確実性を積分して新データを予測する","\n<p>$$p(\\tilde y\\mid y)=\\int p(\\tilde y\\mid\\theta)p(\\theta\\mid y)\\,d\\theta.$$</p>\n<p>母数を点推定へ固定せず、事後分布全体で平均するため、母数不確実性も予測へ反映されます。</p>\n"],[["Bayes因子","WAIC","LOO"],"Bayesモデル比較には『証拠』と『予測』の2方向がある","\n<p>Bayes因子は周辺尤度比でモデル証拠を比較し、事前分布に敏感です。WAIC/LOOは未観測データへの予測性能を評価します。目的が違うため同じランキングになるとは限りません。</p>\n"],[["階層モデル","部分プーリング"],"階層モデルは完全共有と完全分離の中間","\n<p>群ごと別推定は小標本群が不安定、全群同一は群差を無視します。階層モデルは群効果を共通分布から生成したと考え、情報を部分的に共有します。</p>\n"],[["MCMC","収束診断"],"MCMCは独立標本ではなくMarkov連鎖","\n<p>目標事後を定常分布に持つ連鎖を作り、長期サンプルで期待値を近似します。自己相関があるため反復数より実効標本サイズが重要です。</p>\n<p>$\\hat R$、trace、divergenceなど複数の診断を合わせます。</p>\n"],[["定常性","弱定常"],"時系列の定常性は『同じルールを時間全体に使える』前提","\n<p>弱定常では平均一定、分散一定、自己共分散が時点ではなくラグだけに依存します。過去で推定した依存構造を未来へ適用できる基礎です。</p>\n"],[["ランダムウォーク","単位根","ADF"],"ランダムウォークはショックが永続する非定常過程","\n<p>$$X_t=X_{t-1}+\\varepsilon_t$$</p>\n<p>なら $Var(X_t)=t\\sigma^2$ と増え、一定分散でないため非定常です。ADFは単位根ありを帰無に置きます。</p>\n"],[["自己相関","PACF","ACF"],"ACFとPACFは時間依存の見え方を分ける","\n<p>ACFは $Corr(X_t,X_{t-k})$、PACFは中間ラグの線形影響を除いた残りの相関です。ARではPACFが、MAではACFが次数で切れるという理論パターンがモデル同定に使われます。</p>\n"],[["MA(q)","AR(p)","ARMA"],"ARとMAは過去の『値』か『ショック』か","\n<p>ARは過去の観測値、MAは過去の誤差ショックで現在を表します。AR(1)の $|\\phi|<1$ は過去ショックの影響 $\\phi^k$ が消える定常条件です。</p>\n"],[["ARIMA","差分"],"差分はレベルではなく変化量を定常化する","\n<p>$$\\Delta X_t=X_t-X_{t-1}.$$</p>\n<p>ランダムウォークなら差分後は白色雑音です。ARIMAの$I$は何回差分したかを表します。</p>\n"],[["Box–Jenkins"],"Box–Jenkinsは同定→推定→診断の反復","\n<p>ACF/PACFで候補を作り、係数推定し、残差に自己相関が残っていないか診断します。残差が白色雑音になって初めて『時間構造を取り切った』と考えます。</p>\n"],[["状態空間","カルマン"],"状態空間モデルは見えない状態と観測ノイズを分ける","\n<p>状態方程式が真の状態の時間発展、観測方程式がセンサーとの関係を表します。Kalman filterは予測分布と新観測をそれぞれの不確実性で重み付け融合します。</p>\n"],[["スペクトル","Wiener","ペリオドグラム"],"スペクトルは分散を周波数ごとへ分解する","\n<p>自己共分散とスペクトル密度はFourier変換対です。時間領域の相関と周波数領域のエネルギー分布は同じ情報の別表現です。</p>\n"],[["GARCH"],"GARCHは平均ではなく条件付き分散を時変にする","\n<p>大きな変動が続くvolatility clusteringを、過去の二乗ショックと過去分散から現在分散を予測することで表します。</p>\n"],[["見せかけの回帰"],"非定常系列同士では無関係でも高R²が出る","\n<p>独立なランダムウォーク同士でも持続性のため高い相関・有意t値が出ることがあります。差分や共和分の確認なしに通常回帰を当てるのは危険です。</p>\n"],[["生存関数","ハザード","累積ハザード"],"生存関数とハザードは同じ寿命分布を別角度から見る","\n<p>$$S(t)=P(T>t),\\quad h(t)=\\frac{f(t)}{S(t)},\\quad\nH(t)=\\int_0^t h(u)du,\\quad S(t)=e^{-H(t)}.$$</p>\n<p>ハザードは確率ではなく、そこまで生存した条件下での瞬間的故障率です。</p>\n"],[["打ち切り"],"打ち切りは『値が無い』のではなく不等式情報がある","\n<p>右打ち切りなら寿命が少なくとも$c$以上と分かっています。尤度では故障観測に$f(t)$、右打ち切りに$S(t)$を使い、情報を捨てません。</p>\n"],[["Kaplan","Greenwood","Nelson"],"KMは故障時点ごとの条件付き生存率を掛ける","\n<p>$$\\hat S(t)=\\prod_{t_j\\le t}\\left(1-\\frac{d_j}{n_j}\\right).$$</p>\n<p>各時点で『直前まで生きた中で今回も生き残る割合』を掛けていきます。Greenwood公式はその曲線の分散を近似します。</p>\n"],[["Cox","比例ハザード","部分尤度"],"Coxモデルは基準ハザードを指定せず倍率だけ推定する","\n<p>$$h(t\\mid x)=h_0(t)e^{x^T\\beta}.$$</p>\n<p>イベント時点のリスク集合で条件付き確率を作ると共通の $h_0(t)$ が消え、$\\beta$だけの部分尤度が得られます。</p>\n"],[["AFT","加速寿命"],"AFTは寿命時間そのものを倍率で伸縮する","\n<p>$$\\log T=x^T\\beta+\\varepsilon.$$</p>\n<p>係数はハザード倍率ではなく寿命時間の倍率として解釈します。Coxと同じ生存解析でも解釈対象が違います。</p>\n"],[["Weibull","バスタブ"],"Weibull形状母数は故障率の時間変化を表す","\n<p>形状母数<1でハザード低下、=1で一定、>1で増加。初期故障・偶発故障・摩耗故障という信頼性工学の直感と対応します。</p>\n"],[["直列系","並列系","k-out-of-n"],"系信頼性は論理構造を確率へ翻訳する","\n<p>独立直列系は全て生存する必要があるので $R=\\prod R_i$。並列系は全て故障したときのみ系故障なので $R=1-\\prod(1-R_i)$。</p>\n"],[["再現期間","POT","一般化パレート"],"再現期間は周期ではなく平均超過待ち時間","\n<p>年超過確率$p$なら再現期間 $T=1/p$。100年再現値は100年ごとに必ず1回ではなく、各年の超過確率約1%という意味です。</p>\n<p>POTは閾値超過を全て使い、超過量を一般化Paretoでモデル化します。</p>\n"],[["FORM","限界状態","構造信頼性"],"構造信頼性は限界状態面を越える確率を求める","\n<p>$$g(X)>0:\\text{安全},\\qquad g(X)\\le0:\\text{破壊}.$$</p>\n<p>FORMは入力を標準正規空間へ写し、原点から $g=0$ 面までの最短距離 $\\beta$ を求め、その点で一次近似します。</p>\n"],[["潜在結果","個体因果効果","SUTVA"],"因果効果は観測できない反実仮想との差","\n<p>$$\\tau_i=Y_i(1)-Y_i(0).$$</p>\n<p>同一個体では片方しか観測できません。因果推論の根本問題は、この欠測された反実仮想を研究設計・仮定・比較群で補うことです。</p>\n"],[["DAG","d 分離","バックドア","合流点"],"DAGは因果仮定と条件付けの効果を可視化する","\n<p>バックドア経路は交絡を表し、適切な変数調整で閉じます。一方 $X\\to C\\leftarrow Y$ のコライダーを条件付けると、本来閉じていた経路が開き見かけの関連が生じます。</p>\n"],[["傾向スコア"],"傾向スコアは処置確率へ共変量を圧縮する","\n<p>$$e(X)=P(A=1\\mid X).$$</p>\n<p>マッチング・層別・IPWに使い、処置群と対照群の共変量バランスを作ります。推定後は必ずバランスと共通サポートを診断します。</p>\n"],[["二重頑健"],"二重頑健は2モデルのどちらか一方の正しさで一致性を守る","\n<p>アウトカムモデルと処置モデルを組み合わせ、一定条件下でどちらか一方が正しく指定されていれば一致性を保ちます。両方誤れば保証はありません。</p>\n"],[["操作変数","2SLS","LATE"],"IVは外生的な処置変動だけを使う","\n<p>操作変数は処置へ影響するがアウトカムへ直接影響しない等の強い条件を要求します。2SLSは第一段階で処置をIVから予測し、その予測成分で結果を回帰します。</p>\n<p>推定対象は通常complierのLATEで、全体ATEと一致するとは限りません。</p>\n"],[["差の差","DID"],"DIDは処置群の変化から対照群の変化を引く","\n<p>$$DID=(Y_{T,after}-Y_{T,before})-(Y_{C,after}-Y_{C,before}).$$</p>\n<p>処置がなければ両群が平行に動いたという平行トレンド仮定が鍵です。</p>\n"],[["回帰不連続","RDD"],"RDDは閾値直前直後を局所的に比較する","\n<p>処置割当が閾値で不連続に変わる制度を利用し、閾値近傍で他要因が滑らかに変化するなら結果のジャンプを因果効果として識別します。</p>\n"],[["バイアス–分散","過学習"],"予測誤差はノイズ・Bias²・Varianceへ分解できる","\n<p>柔軟なモデルはBiasを減らしやすい一方、標本変動へ敏感になりVarianceが増えます。過学習は訓練ノイズまで学び、未見誤差が増える状態です。</p>\n"],[["交差検証","k-fold","LOO"],"CVは未見誤差をデータ内で近似する","\n<p>学習と検証を分け、検証側を一度もfitに使わず評価します。標準化・特徴選択・補完もfold内でfitしないと情報リークになります。</p>\n"],[["Ridge","Lasso","Elastic Net","正則化"],"正則化は少しBiasを入れてVarianceを下げる","\n<p>RidgeはL2で連続縮約、LassoはL1の角により係数を0へ、Elastic Netは両者を併用します。$\\lambda$ は訓練誤差ではなくCVで選びます。</p>\n"],[["k 近傍","k近傍","kNN"],"kNNは局所平均だが高次元で距離が壊れる","\n<p>$k$が小さいと低Bias高Variance、大きいと高Bias低Variance。尺度の違いが距離を支配するので標準化が重要です。</p>\n"],[["決定木","CART","剪定"],"決定木は特徴空間を矩形へ再帰分割する","\n<p>最も損失を減らす変数・閾値で二分し続けます。深い木は高Varianceなので、cost-complexity pruning等で枝を落とします。</p>\n"],[["バギング","ランダムフォレスト"],"Baggingは不安定なモデルを平均してVarianceを下げる","\n<p>Bootstrap標本ごとの木を平均します。Random Forestはさらに分割候補特徴をランダム化し、木同士の相関を下げて平均効果を高めます。</p>\n"],[["勾配ブースティング","ブースティング"],"Boostingは残った誤差を逐次修正する","\n<p>現在モデルの損失の負勾配を次の弱学習器で近似し、小さく足し込みます。Baggingの並列平均とは対照的です。</p>\n"],[["SVM","サポートベクトル","カーネル"],"SVMは分類境界よりマージンを最大化する","\n<p>境界に最も近い点までの距離を最大化します。Kernel trickは $K(x,x')=\\phi(x)^T\\phi(x')$ のみ計算し、高次元特徴を明示せず非線形境界を作ります。</p>\n"],[["ガウス過程"],"Gaussian Processは関数そのものに確率分布を置く","\n<p>$$f\\sim GP(m,k).$$</p>\n<p>任意有限点での関数値が多変量正規になり、カーネルが滑らかさ・相関長さを決めます。予測平均と同時に予測分散が得られます。</p>\n"],[["ROC","AUC","較正"],"分類性能には順位と確率精度の2軸がある","\n<p>ROC/AUCは正例を負例より高く順位付けできるか、calibrationは0.7と予測した事例が実際に約70%陽性かを見ます。AUCが高くても較正が良いとは限りません。</p>\n"],[["共形予測","交換可能性"],"Conformal predictionは順位対称性から有限標本被覆を作る","\n<p>分布形を特定せず、calibration scoreの順位と交換可能性を使って予測区間を作ります。保証は主に周辺被覆であり、各$x$での条件付き被覆とは異なります。</p>\n"],[["疑似乱数","Mersenne","PCG","LCG","種"],"疑似乱数は決定論的な再現可能列","\n<p>seedと内部状態から決定論的に生成されるため、同じseedなら同じ結果を再現できます。科学計算では再現性、並列計算では独立streamの管理が重要です。</p>\n"],[["逆関数法","棄却法","Box–Muller"],"一様乱数から任意分布を作る","\n<p>逆関数法は $X=F^{-1}(U)$、棄却法は引きやすい提案分布から候補を出し受理確率で補正、Box–Mullerは2次元正規の極座標変換を使います。</p>\n"],[["モンテカルロ","Monte Carlo"],"Monte Carloは期待値を標本平均で近似する","\n<p>積分を期待値へ書き換え、独立サンプル平均で近似します。CLTにより標準誤差は概ね</p>\n<p>$$SE\\propto n^{-1/2}.$$</p>\n<p>誤差半減に約4倍の試行が必要です。</p>\n"],[["稀事象","重点サンプリング","対照変量","層化サンプリング"],"Variance reductionは同じ期待値をより少ない試行で推定する","\n<p>対照変量は既知期待値との相関でノイズを相殺、重点サンプリングは重要領域を多く引き $f/q$ で重み補正、層化は全領域を計画的に覆います。</p>\n"],[["Latin Hypercube","LHS"],"LHSは各入力の分位区間を一度ずつ使う","\n<p>各変数の累積確率を$n$層に分け、各層から1点ずつ選ぶため、単純乱数より1次元周辺を均等に覆います。</p>\n"],[["EM アルゴリズム","EM"],"EMは潜在変数を期待値で埋めて尤度を上げる","\n<p>E-stepで潜在変数の条件付き期待を取り、M-stepで期待完全対数尤度を最大化します。Jensen不等式で構成した下限を交互に改善するため尤度は減りません。</p>\n"],[["Newton","Fisher スコアリング","準 Newton","数値最適化"],"数値最適化は勾配と曲率で尤度山を登る","\n<p>Newton法は局所二次近似の頂点へ更新し、Fisher scoringは観測Hessianの代わりに期待情報を使います。初期値・スケーリング・局所解も推定の一部です。</p>\n"],[["標本調査","層化抽出","クラスター抽出","系統抽出"],"標本調査では抽出設計そのものが確率モデル","\n<p>単純無作為抽出、層化、クラスター、多段抽出で包含確率と分散が変わります。層化は精度を上げやすく、クラスター抽出はコストを下げる一方、群内相関で設計効果が増えることがあります。</p>\n"],[["欠測","MCAR","MAR","MNAR","多重代入","MICE"],"欠測は『なぜ欠けたか』が推論を決める","\n<p>MCARは何にも依存しない、MARは観測済み情報を条件にすれば未観測値へ依存しない、MNARは未観測値自体へ依存します。</p>\n<p>多重代入は欠測値を1個に決め打ちせず、複数補完によって補完不確実性を最終分散へ反映します。</p>\n"],[["コンクリート","受入検査","特性値"],"材料強度では平均より下側保証を考える","\n<p>平均が高くても弱い側の個体が危険です。標本平均・標本SD、母集団下側分位点、その分位点の信頼下限を区別します。</p>\n"],[["疲労","run-out"],"run-outは寿命値ではなく右打ち切り情報","\n<p>試験上限まで壊れなかった供試体は「寿命=上限」ではありません。「寿命は少なくとも上限以上」です。右打ち切りとして生存尤度へ残します。</p>\n"],[["年最大風速","観測の連続性"],"極値解析の前に観測系列の同質性を確認する","\n<p>観測所移転・計器変更・周辺環境・高さ変更は人工的な段差を作ります。非定常気候トレンドと観測系変更を混同しないことが重要です。</p>\n"],[["構造モニタリング","季節変動"],"SHMでは環境変動を損傷信号から分離する","\n<p>固有振動数等は温度・湿度・運用でも変わります。環境共変量や季節性をモデル化し、その説明後の残差で異常を見る方が自然です。</p>\n"]];
const CATEGORY_MODULES={"purpose":"\n<section class=\"deep-reader-section\"><h2>この章を読む前の地図</h2>\n<p>「この章の目的」は単なる前書きではありません。ここで、前章までのどの道具を使い、何を新しく推論できるようにするのかを確認してください。式を読む前に、入力・出力・仮定を文章で言える状態にすると後の数式が迷子になりません。</p></section>\n","python":"\n<section class=\"deep-reader-section\"><h2>Python節の読み方</h2>\n<p>コードを実行して数字が出たら終わりではありません。まず小さな手計算例と一致するか、次に1つの入力だけを動かして結果が理論どおり変わるか、最後に乱数seed・標本数・数値誤差へ感度がないかを確認してください。</p>\n<p>ライブラリ関数の戻り値が、本文のどの数式のどの量に対応するかも必ず対応付けます。</p></section>\n","exercise":"\n<section class=\"deep-reader-section\"><h2>演習の取り組み方</h2>\n<p>計算前に、①求める量、②既知/未知、③固定/ランダム、④必要な仮定、⑤使う定義・定理、⑥単位を書き出してください。答え合わせでは数値だけでなく、どの一行で何を使ったかを説明できるかを確認します。</p></section>\n","references":"\n<section class=\"deep-reader-section\"><h2>参考文献の読み方</h2>\n<p>参考文献は全部を最初から読む必要はありません。本文で曖昧だった定義・証明・実務上の注意に対応する箇所を逆引きします。理論書では仮定と定理、応用書ではデータ生成過程と診断、論文では対象母集団・標本サイズ・評価指標を優先して確認してください。</p></section>\n","summary":"\n<section class=\"deep-reader-section\"><h2>まとめ節で確認すること</h2>\n<p>章の公式を列挙するだけでなく、「何を知りたいとき、どの道具を、どの仮定で使うか」を自分の言葉で再構成してください。似た公式の違いを説明できることが理解の基準です。</p></section>\n"};

  st.textContent=`
    .deep-edition-mark{
      display:inline-block;margin:.45rem 0 1rem;padding:.3rem .6rem;border-radius:999px;

function typeset(win, root){
  try{
    if(win.MathJax && win.MathJax.startup && win.MathJax.startup.promise){
      win.MathJax.startup.promise.then(()=>{
        try{ win.MathJax.typesetPromise([root]).catch(()=>{}); }catch(e){}
      }).catch(()=>{});
    } else if(win.__mj){
      const p=win.__mj();
      if(p&&p.catch)p.catch(()=>{});
    }
  }catch(e){}
}


function noteKeyFromHeading(h){
  const m=norm(h.textContent).match(/^(\d+(?:\.\d+){1,2})\b/);
  return m ? m[1] : null;
}

function plainFromHTML(doc, html){
  const box=doc.createElement('div');
  box.innerHTML=html||'';
  return (box.innerText||box.textContent||'').replace(/\n{3,}/g,'\n\n').trim();
}

function extractSectionText(h){
  const level=Number((h.tagName||'H6').slice(1))||6;
  const chunks=[];
  let n=h.nextElementSibling;
  while(n){
    if(/^H[1-6]$/.test(n.tagName||'') && Number(n.tagName.slice(1))<=level) break;
    if(n.classList && (
      n.classList.contains('deep-note') ||
      n.classList.contains('deep-ask-row') ||
      n.classList.contains('deep-chapter') ||
      n.classList.contains('deep-edition-mark')
    )){
      n=n.nextElementSibling; continue;
    }
    const t=(n.innerText||n.textContent||'').replace(/\s+/g,' ').trim();
    if(t) chunks.push(t);
    if(chunks.join('\n').length>6500) break;
    n=n.nextElementSibling;
  }
  let out=chunks.join('\n').trim();
  if(!out){
    const blk=h.closest && h.closest('.blk');
    if(blk) out=(blk.innerText||blk.textContent||'').replace(/\s+/g,' ').trim();
  }
  return out.slice(0,6500);
}

function currentHeading(doc, win){
  const hs=[...doc.querySelectorAll('#view h2,#view h3,#view h4')];
  if(!hs.length) return null;
  const y=Math.min(win.innerHeight*.42,320);
  let best=hs[0];
  for(const h of hs){
    const r=h.getBoundingClientRect();
    if(r.top<=y) best=h;
    else break;
  }
  return best;
}

function buildStudyPrompt(doc, win, h, obj, userQuestion){
  const title=norm(h ? h.textContent : '現在の箇所');
  const original=h ? extractSectionText(h) : '';
  const supplement=obj ? plainFromHTML(doc,obj.html) : '';
  const selected=(win.getSelection && win.getSelection().toString()||'').trim().slice(0,2500);

  return [
    '私は統計学をこの教材で勉強しています。以下の箇所について質問します。',
    '',
    '【回答のしかた】',
    '・内容を簡略化して終わらせず、原文と同等以上の深さを保ってください。',
    '・式は途中を飛ばさず、必要なら1行ずつ変形してください。',
    '・新しい記号が出たら、その記号が何を表すか説明してください。',
    '・「なぜ今この式を考えるのか」「どの定義・定理を使ったのか」も説明してください。',
    '・前提知識が不足していそうなら、その前提まで遡って説明してください。',
    '・直感だけでなく、数式上の理由も示してください。',
    '・できれば小さな数値例も使ってください。',
    '',
    '【読んでいる節】',
    title,
    original ? '\n【原文の周辺】\n'+original : '',
    supplement ? '\n【教材内の行間補足】\n'+supplement : '',
    selected ? '\n【いま選択している箇所】\n'+selected : '',
    '',
    '【私の質問】',
    (userQuestion||'この箇所を、何が起きているのかから丁寧に説明してください。')
  ].filter(Boolean).join('\n');
}

function copyText(doc, text){
  const ta=doc.createElement('textarea');
  ta.value=text;
  ta.setAttribute('readonly','');
  ta.style.position='fixed';
  ta.style.left='-9999px';
  ta.style.top='0';
  doc.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ ok=doc.execCommand('copy'); }catch(e){}
  ta.remove();
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{});
    ok=true;
  }
  return ok;
}

function toast(doc, msg){
  let t=doc.getElementById('deep-ask-toast');
  if(!t){
    t=doc.createElement('div');
    t.id='deep-ask-toast';
    t.className='deep-ask-toast';
    doc.body.appendChild(t);
  }
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2600);
}

function askChatGPT(doc, win, h, obj){
  const q=win.prompt('ChatGPTに何を聞きたいですか？\n（空欄でも、その箇所の丁寧な説明を依頼できます）','');
  if(q===null) return;
  const prompt=buildStudyPrompt(doc,win,h,obj,q.trim());
  const ok=copyText(doc,prompt);
  toast(doc, ok
    ? '質問文をコピーしました。ChatGPTが開いたら貼り付けて送信してください。'
    : '質問文のコピーに失敗しました。もう一度押してください。');
  // APIは使わず、通常のChatGPTを開く。iOSでは端末設定によりアプリ/ブラウザのどちらかで開く。
  setTimeout(()=>{
    try{ win.top.location.href='https://chatgpt.com/'; }
    catch(e){ win.open('https://chatgpt.com/','_blank'); }
  },180);
}

function cloneOriginalSection(doc,h){
  const box=doc.createElement('div');
  box.className='deep-reader-original-body';
  const ns=sectionNodes(h);
  if(ns.length){
    ns.forEach(n=>box.appendChild(n.cloneNode(true)));
  }else{
    const blk=h.closest&&h.closest('.blk');
    if(blk) box.appendChild(blk.cloneNode(true));
  }
  box.querySelectorAll('.deep-note,.deep-action-row,.deep-ask-row,.deep-chapter,.deep-edition-mark').forEach(x=>x.remove());
  return box;

function chapterNumberForHeading(h){
  const h1=h.closest('#view')&&h.closest('#view').querySelector('h1');
  const t=norm(h1?h1.textContent:'');
  if(/^序章/.test(t))return '0';
  const m=t.match(/^第(\d+)章/);
  return m?m[1]:'';
}

function deepTopicExtras(title){
  let out='';
  KEY_HELP.forEach(([terms,block])=>{
    if(terms.some(t=>title.includes(t))) out+=block;
  });
  return out;
}

function matchedTopicModules(title){
  const blocks=[];
  TOPIC_MODULES.forEach(([terms,head,html])=>{
    if(terms.some(t=>title.includes(t))){
      blocks.push(`<section class="deep-reader-section"><h2>${head}</h2>${html}</section>`);
    }
  });
  return blocks.join('');
}

function categoryDeepModule(title){
  if(title.includes('この章の目的')) return CATEGORY_MODULES.purpose;
  if(title.includes('Python')) return CATEGORY_MODULES.python;
  if(title.includes('演習') || title==='課題') return CATEGORY_MODULES.exercise;
  if(title.includes('参考文献')) return CATEGORY_MODULES.references;
  if(title.includes('まとめ')) return CATEGORY_MODULES.summary;
  return '';
}

    <div class="deep-reader-head">
      <div class="deep-reader-head-inner">
        <button class="deep-reader-back" type="button">← 教材へ戻る</button>
        <div class="deep-reader-title"></div>
        <div style="display:flex;gap:.35rem">
          <button class="deep-reader-navbtn deep-prev" type="button" aria-label="前の項目">‹</button>
          <button class="deep-reader-navbtn deep-next" type="button" aria-label="次の項目">›</button>
        </div>
      </div>
    </div>
    <main class="deep-reader-content"></main>`;
  doc.body.appendChild(r);
  r.querySelector('.deep-reader-back').onclick=()=>closeDeepReader(doc);
  return r;
}

function closeDeepReader(doc){
  const r=doc.getElementById('deep-reader');
  if(!r)return;
  r.hidden=true;
  doc.body.style.overflow=r.dataset.oldOverflow||'';
}

function openDeepReader(doc,win,h,obj){
  const r=ensureDeepReader(doc,win);
  const title=norm(h.textContent);
  const key=noteKeyFromHeading(h);
  const hs=[...doc.querySelectorAll('#view h2,#view h3,#view h4')].filter(x=>!x.closest('.deep-reader'));
  const idx=hs.indexOf(h);
  const prev=idx>0?hs[idx-1]:null;
  const next=idx>=0&&idx<hs.length-1?hs[idx+1]:null;
  const main=r.querySelector('.deep-reader-content');
  const custom=key&&DEEP_PAGES[key]?DEEP_PAGES[key]:'';

  main.innerHTML=`
    <div class="deep-reader-kicker">${key?'SECTION '+key:'DEEP DIVE'}</div>
    <h1 class="deep-reader-h1">${title.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</h1>
    ${buildUniversalDeepIntro(doc,h,obj)}
    ${custom || `
      <section class="deep-reader-section">
        <h2>この節を原文の深さのまま読む</h2>
        <p>以下では原文の定義・式・例を中心に据えます。上のテーマ別解説と照らし合わせ、式が出るたびに「何を入力して何を出力する式か」「どの定義・仮定を使ったか」「観測前と観測後のどちらの量か」を確認します。</p>
        <p>原文を短い言い換えへ置き換えず、原文そのものを残して補助線を増やす設計です。</p>
      </section>`}
    <section class="deep-reader-original">
      <h2>原文をそのまま確認する</h2>
      <p>以下は元教材のこの節です。内容を削って簡単にするのではなく、上の解説と行き来しながら読みます。</p>
      <div class="deep-original-slot"></div>
    </section>
    <div class="deep-reader-check">
      <p><b>理解チェック：</b>この節を読み終えたら、①この式は何を求める式か、②各記号の意味、③固定値と確率変数の区別、④式変形で使った根拠、⑤単位・次元、⑥前提仮定、の6点を自分の言葉で説明できるか確認してください。</p>
    </div>
    <div class="deep-reader-bottom">
      <button class="deep-reader-ask" type="button">💬 このページについてChatGPTに質問する</button>
      <span style="font-size:.78rem;opacity:.7">原文の深さを保ったまま、行間を埋める版</span>
    </div>`;

  const slot=main.querySelector('.deep-original-slot');
  slot.replaceWith(cloneOriginalSection(doc,h));

  r.querySelector('.deep-reader-title').textContent=title;
  const pb=r.querySelector('.deep-prev');
  const nb=r.querySelector('.deep-next');
  pb.disabled=!prev; nb.disabled=!next;
  pb.style.opacity=prev?'1':'.35';
  nb.style.opacity=next?'1':'.35';
  pb.onclick=()=>{ if(prev){ const k=noteKeyFromHeading(prev); openDeepReader(doc,win,prev,k?(NOTES[k]||fallbackNote(k,norm(prev.textContent))):fallbackNonNumeric(norm(prev.textContent))); } };
  nb.onclick=()=>{ if(next){ const k=noteKeyFromHeading(next); openDeepReader(doc,win,next,k?(NOTES[k]||fallbackNote(k,norm(next.textContent))):fallbackNonNumeric(norm(next.textContent))); } };
  main.querySelector('.deep-reader-ask').onclick=()=>askChatGPT(doc,win,h,obj);

  if(r.hidden){
    r.dataset.oldOverflow=doc.body.style.overflow||'';
    doc.body.style.overflow='hidden';
  }
  r.hidden=false;
  r.scrollTop=0;
  typeset(win,r);
}

function fallbackNote(key,title){
  const ch=(key&&key.split('.')[0]) || '14';
  let html='<p><b>この節で扱うもの：</b>「'+title.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'」です。</p>';
  html += CH_GUIDE[ch] || CH_GUIDE['14'];
  let hit=0;
  KEY_HELP.forEach(([terms,block])=>{
    if(terms.some(t=>title.includes(t))){ html+=block; hit++; }
  });
  if(!hit){
    html += '<p><b>読み方：</b>新しい記号は「固定値か確率変数か」、期待値・分散は「何を繰り返した平均/散らばりか」、変換式は「両辺の単位・次元が一致するか」を確認してください。</p>';
  }
  html += '<p>原文の式で「この1行はどこから？」となったら、その直前の定義・仮定まで戻るのが正攻法です。</p>';
  return {title:'この節の位置づけと読み方',html:html,open:false};
}
function fallbackNonNumeric(title){
  if(title==='課題') return {title:'課題の取り組み方',html:'<p>①何を推定・検定するか、②使えるデータ、③必要な仮定、④結果の単位と不確実性、を先に書き出してから計算してください。</p>',open:false};
  if(title.includes('データ')) return {title:'データを触る前の確認',html:'<p>列名・単位・欠測・測定時点・観測条件・重複・外れ値候補を確認してから統計手法を選びます。</p>',open:false};
  return null;
}

let busy=false;
function inject(){
  if(busy)return;
  busy=true;
  try{
    const doc=frame.contentDocument;
    const win=frame.contentWindow;
    if(!doc||!win)return;
    installStyle(doc);
    const view=doc.getElementById('view');
    if(!view)return;
    ensureAskFab(doc,win);

    const h1=view.querySelector('h1');
    if(h1 && !h1.dataset.deepDone){
      h1.dataset.deepDone='1';
      const t=norm(h1.textContent);
      let key=null;
      if(/^序章/.test(t))key='0';
      else{
        const m=t.match(/^第(\d+)章/);
        if(m)key=m[1];
      }
      if(key && CHAPTER[key]){
        const mark=doc.createElement('div');
        mark.className='deep-edition-mark';
        mark.textContent='全項目・1ページ徹底解説 v4';
        h1.insertAdjacentElement('afterend',mark);
        const c=doc.createElement('div');
        c.className='deep-chapter';
        c.innerHTML=CHAPTER[key];
        mark.insertAdjacentElement('afterend',c);
        typeset(win,c);
      }
    }

    view.querySelectorAll('h2,h3,h4').forEach(h=>{
      if(h.dataset.deepDone)return;
      h.dataset.deepDone='1';
      const ht=norm(h.textContent);
      const m=ht.match(/^(\d+(?:\.\d+){1,2})\b/);
      const key=m?m[1]:null;
      const obj=key ? (NOTES[key] || fallbackNote(key,ht)) : fallbackNonNumeric(ht);
      if(!obj)return;
      const d=makeDetails(doc,obj);
      h.insertAdjacentElement('afterend',d);
      addAskRow(doc,win,h,obj,d);
      typeset(win,d);
    });
  } finally {
    busy=false;
  }
}

frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const view=doc&&doc.getElementById('view');
    if(view){
      new MutationObserver(()=>setTimeout(inject,20)).observe(view,{childList:true,subtree:true});
    }
    setTimeout(inject,50);
    setTimeout(inject,300);
    setTimeout(inject,1000);
  }catch(e){}
});
</script>
</body>
</html>
