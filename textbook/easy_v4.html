const CHAPTER={"0": "\n<p><b>この本を読むときの最重要ルール：</b>式を見たら、まず「何が固定値で、何が取り直すたびに変わる量か」を分けます。</p>\n<p>統計学は大きく、<b>記述 → 確率 → 推定 → 検定 → モデル化</b>の順で積み上がります。第1章では手元の値 \$x_1,\\ldots,x_n\$ を扱い、第2章からは観測前のランダムな量 \$X_1,\\ldots,X_n\$ を扱います。第3章では、そのランダムな標本を使って、未知だが固定された母数 \$\\mu,\\sigma^2,\\theta\$ を推定します。</p>\n<p>この「小文字／大文字」「固定／ランダム」の区別が曖昧なまま進むと、期待値・標本分布・不偏性が突然見えます。逆にここを毎回確認すれば、後半の式の多くは自然につながります。</p>\n", "1": "\n<p><b>第1章の役割は「得られたデータの形を言葉と数で表す」ことです。</b></p>\n<p>この段階では、平均や分散を「母集団を推定する道具」として急いで考えなくて構いません。まず、与えられた \$x_1,\\ldots,x_n\$ をどう要約するかを理解します。</p>\n<p>ただし第1章の平均・分散・相関は、第2章以降で確率変数の平均・分散・共分散へそのまま拡張されます。そのため、単なる公式暗記ではなく「何を測っている量か」を意識してください。</p>\n", "2": "\n<p><b>第2章から、統計学の「時間」が観測後から観測前へ移ります。</b></p>\n<p>第1章の \$x=5\$ はすでに決まった値ですが、第2章の \$X\$ は「これから観測したら何になるか分からない量」です。そこで、1回の値ではなく「どの値がどれくらいの確率で出るか」という分布を扱います。</p>\n<p>期待値・分散・大数の法則・中心極限定理は、すべて「同じ仕組みから何度もデータを取り直したらどうなるか」を記述する道具です。</p>\n", "3": "\n<p><b>第3章の中心は「未知の固定値を、ランダムな標本から当てる」ことです。</b></p>\n<p>母平均 \$\\mu\$ や母分散 \$\\sigma^2\$ は、知らないだけで固定されています。一方、標本平均 \$\\bar X\$ や標本分散 \$S^2\$ は、どの標本を引くかで変わるため確率変数です。</p>\n<p>この章では「よい推定量とは何か」を、不偏性・分散・MSE・一致性など複数の尺度で評価します。「不偏なら常に最良」ではないことも重要です。</p>\n", "4": "\n<p><b>仮説検定は「仮説が正しい確率」を直接計算する仕組みではありません。</b></p>\n<p>まず \$H_0\$ が正しい世界を仮定し、その世界で現在のデータ以上に極端な結果がどれくらい起こるかを測ります。この「仮定 → データの珍しさ」という向きを崩さないことが、p値の誤解を防ぐ鍵です。</p>\n", "5": "\n<p><b>回帰では「平均的な構造」と「そこからのばらつき」を分離します。</b></p>\n<p>\$Y=X\\beta+\\varepsilon\$ のうち、\$X\\beta\$ が系統的な部分、\$\\varepsilon\$ が説明しきれない部分です。最小二乗法だけでなく、係数の標本分布・標準誤差・診断まで含めて1つの体系として見ます。</p>\n", "6": "\n<p><b>ANOVAは平均差を調べるのに「分散の比」を使います。</b></p>\n<p>群の平均が本当に違うなら、群どうしのばらつきは、同じ群の中の自然なばらつきより大きくなるはずです。この発想が平方和分解と \$F\$ 比につながります。</p>\n", "7": "\n<p><b>多変量解析は、1変数の平均・分散をベクトルと行列へ拡張した世界です。</b></p>\n<p>共分散行列、固有値、固有ベクトルは新しい別世界ではなく、第1〜2章の分散・共分散を多数の変数についてまとめて表したものです。</p>\n", "8": "\n<p><b>ベイズ統計では、未知パラメータそのものの不確実さを確率分布で表します。</b></p>\n<p>事前分布 \$p(\\theta)\$、尤度 \$p(y\\mid\\theta)\$、事後分布 \$p(\\theta\\mid y)\$ の3つを明確に区別すると、章全体が整理されます。</p>\n", "9": "\n<p><b>時系列では「順番を入れ替えられない」ことが本質です。</b></p>\n<p>通常の標本では独立同分布を置くことが多いですが、時系列では \$X_t\$ と \$X_{t-1}\$ が関係します。その依存構造を自己相関やARモデルとして記述します。</p>\n", "10": "\n<p><b>この章では「普通の値」ではなく、寿命・破壊・極端値を扱います。</b></p>\n<p>生存時間解析・信頼性工学・極値統計はいずれも、平均付近だけを見ていては答えられない問題を扱うための道具です。</p>\n", "11": "\n<p><b>因果推論では、観測できなかった世界をどう扱うかが中心です。</b></p>\n<p>同じ対象について \$Y(1)\$ と \$Y(0)\$ を同時には観測できません。この「因果推論の根本問題」を、無作為化・DAG・傾向スコアなどでどう補うかを学びます。</p>\n", "12": "\n<p><b>統計的機械学習では、説明より予測性能を優先する場面が増えます。</b></p>\n<p>ただし基礎は同じで、標本から学習した規則が別の標本でも通用するか、つまり汎化を考えます。バイアス・分散、正則化、交差検証はそのための道具です。</p>\n", "13": "\n<p><b>計算統計は、第2章の確率論をアルゴリズムに変える章です。</b></p>\n<p>期待値を標本平均で近似する、大数の法則で精度を保証する、分布から乱数を作る、といった考えがモンテカルロ法・LHS・EMなどへつながります。</p>\n", "14": "\n<p><b>ここでは「正しい公式を選ぶ」だけでは足りません。</b></p>\n<p>現実のデータには外れ値、欠測、打ち切り、測定条件の変化があります。解析前にデータ生成過程を疑い、仮定を確認し、結果の頑健性を見るところまでが統計解析です。</p>\n"};
const NOTES={"0.1": {"title": "統計学の全体像：なぜ確率論が必要になるのか", "html": "\n<p><b>記述統計</b>は「今回得たデータ」に関する話です。たとえば5人の身長が与えられたら、その5人の平均は普通の算術で求められます。</p>\n<p>一方、<b>推測統計</b>では「今回の5人は、もっと大きな母集団をどれくらい代表しているか」を考えます。ここで「別の5人を選んだら平均は変わる」という不確実性が生じるため、確率論が必要になります。</p>\n<p>つまり確率論は、統計学とは別の飾りではなく、<b>標本を取り直したときの揺らぎを記述する言語</b>です。</p>\n", "open": true}, "0.3": {"title": "数学的前提をどう読むか", "html": "\n<p>微積分・線形代数が出てきても、最初からすべてを独立に復習する必要はありません。統計で出てきた瞬間に「この操作は何をしているのか」を確認する方が効率的です。</p>\n<p>たとえば積分は、連続分布で「細かい確率×値」を全部足す操作として期待値に現れます。固有値分解は、多変量データの「よく散らばる方向」を探すPCAで現れます。</p>\n", "open": false}, "0.5": {"title": "記号を読むための地図", "html": "\n<p><b>大文字と小文字を最初に分けます。</b></p>\n<ul>\n<li>\$X\$：観測前。何になるかまだ分からない確率変数</li>\n<li>\$x\$：観測後。すでに値が決まった実現値</li>\n<li>\$\\mu,\\sigma^2,\\theta\$：母集団側のパラメータ。未知でも固定</li>\n<li>\$\\bar X,S^2,\\hat\\theta\$：標本から計算する量。標本を取り直すと変わる</li>\n</ul>\n<p>たとえば「日本人成人男性の真の平均身長」を \$\\mu\$ とします。値を知らなくても、その母集団を固定した瞬間に \$\\mu\$ は1つの値です。</p>\n<p>一方、100人を抽出して計算する \$\\bar X\$ は、誰が選ばれるかで変わるので確率変数です。実際に100人を選んで \$\\bar x=171.2\$ cm と出た後は、その171.2はただの数です。</p>\n<p><b>\$E[\\cdot]\$</b>は「確率的に変わる量を、同じ仕組みで何度も発生させたときの平均」を取る演算です。</p>\n", "open": true}, "1.2": {"title": "尺度は「使ってよい演算」を決める", "html": "\n<p>名義・順序・間隔・比例尺度の違いは分類問題ではなく、<b>どんな計算が意味を持つか</b>を決めます。</p>\n<p>たとえば順序尺度では「A&gt;B」は言えても、AとBの差がBとCの差と同じとは限りません。比例尺度では0が絶対的なので「2倍」も意味を持ちます。</p>\n<p>統計手法を選ぶ前に尺度を確認するのは、計算可能だからではなく、<b>その計算に意味があるか</b>を確認するためです。</p>\n", "open": false}, "1.3.1": {"title": "度数分布表は情報を捨てて構造を見る", "html": "\n<p>ヒストグラムや度数分布表は、個々の観測値を階級へまとめるため、元データの細部を捨てます。その代わり、中心・広がり・歪み・多峰性などの<b>分布の形</b>が見えます。</p>\n<p>「要約」は必ず情報損失を伴います。平均もヒストグラムも同じです。大切なのは、目的に必要な構造を残しているかです。</p>\n", "open": false}, "1.3.2": {"title": "階級幅が変わると「見える物語」も変わる", "html": "\n<p>階級幅が細かすぎると偶然のギザギザを構造だと誤認しやすく、太すぎると本当の多峰性や歪みを消します。</p>\n<p>これは後のカーネル密度推定の帯域幅、機械学習のモデル複雑度と同じ<b>バイアス–分散の問題</b>です。細かいほど柔軟ですがノイズも拾います。</p>\n", "open": false}, "1.4.1": {"title": "平均はなぜこの式なのか", "html": "\n<p>算術平均</p>\n<p>\$$\\bar x=\\frac1n\\sum_{i=1}^n x_i\$$</p>\n<p>は単なる慣習ではありません。平均 \$\\bar x\$ は、二乗誤差</p>\n<p>\$$\\sum_i(x_i-c)^2\$$</p>\n<p>を最小にする \$c\$ です。微分すると</p>\n<p>\$$-2\\sum_i(x_i-c)=0\$$</p>\n<p>となり、\$\\sum_i x_i=nc\$、したがって \$c=\\bar x\$ が出ます。</p>\n<p>つまり平均は、<b>二乗距離で測ったときのデータの中心</b>です。この性質が最小二乗法へつながります。</p>\n", "open": false}, "1.4.2": {"title": "中央値が絶対偏差を最小化する直感", "html": "\n<p>中央値 \$m\$ は</p>\n<p>\$$\\sum_i |x_i-c|\$$</p>\n<p>を最小にします。</p>\n<p>\$c\$ を少し右へ動かすと、\$c\$ より左にある点との距離は増え、右にある点との距離は減ります。左右の点の数が同じになるところでは、右へ動かしても左へ動かしても改善しません。それが中央値です。</p>\n<p>このため、二乗誤差を使う平均よりも、絶対値誤差を使う中央値の方が外れ値に頑健です。</p>\n", "open": true}, "1.4.3": {"title": "平均には「目的関数」が隠れている", "html": "\n<p>算術平均・幾何平均・調和平均は、同じものの別表記ではありません。何を「同じ重み」と考えるかで適切な平均が変わります。</p>\n<p>成長率の積には幾何平均、速度のような逆数関係には調和平均が自然です。「平均を取る」という操作の前に、<b>何を保存したいか</b>を考えます。</p>\n", "open": false}, "1.5.1": {"title": "標本分散の \$n-1\$ を、途中式を飛ばさず導く", "html": "\n<p><b>まず目的：</b>母集団の本当の分散 \$\\sigma^2\$ を、標本から推定したいとします。</p>\n<p>標本を取る前の</p>\n<p>\$$S^2=\\frac{1}{n-1}\\sum_{i=1}^n(X_i-\\bar X)^2\$$</p>\n<p>は、標本の取り方で値が変わるので確率変数です。「この推定量を何度も使ったら平均的に \$\\sigma^2\$ を当てるか」を調べるために \$E[S^2]\$ を考えます。</p>\n\n<p><b>Step 1：真の平均 \$\\mu\$ を足して引く。</b></p>\n<p>\$$\nX_i-\\bar X=(X_i-\\mu)-(\\bar X-\\mu).\n\$$</p>\n<p>ここでは何も仮定していません。同じ \$\\mu\$ を足して引いただけです。</p>\n\n<p><b>Step 2：二乗して全部足す。</b></p>\n<p>\$$\n\\sum_i(X_i-\\bar X)^2\n=\\sum_i\\{(X_i-\\mu)-(\\bar X-\\mu)\\}^2.\n\$$</p>\n<p>展開すると</p>\n<p>\$$\n\\sum_i(X_i-\\mu)^2\n-2(\\bar X-\\mu)\\sum_i(X_i-\\mu)\n+n(\\bar X-\\mu)^2.\n\$$</p>\n\n<p><b>Step 3：真ん中の和を整理する。</b></p>\n<p>\$$\n\\sum_i(X_i-\\mu)\n=\\sum_iX_i-n\\mu\n=n\\bar X-n\\mu\n=n(\\bar X-\\mu).\n\$$</p>\n<p>したがって</p>\n<p>\$$\n-2(\\bar X-\\mu)\\sum_i(X_i-\\mu)\n=-2n(\\bar X-\\mu)^2.\n\$$</p>\n<p>最後の \$+n(\\bar X-\\mu)^2\$ と合わせれば</p>\n<p>\$$\n\\sum_i(X_i-\\bar X)^2\n=\\sum_i(X_i-\\mu)^2-n(\\bar X-\\mu)^2.\n\$$</p>\n\n<p><b>Step 4：期待値を取る。</b></p>\n<p>分散の定義より</p>\n<p>\$$\nE[(X_i-\\mu)^2]=\\sigma^2.\n\$$</p>\n<p>よって第1項は \$n\\sigma^2\$ です。</p>\n\n<p>また \$E[\\bar X]=\\mu\$ なので</p>\n<p>\$$\nE[(\\bar X-\\mu)^2]=V(\\bar X).\n\$$</p>\n<p>独立同分布なら</p>\n<p>\$$\nV(\\bar X)\n=V\\!\\left(\\frac1n\\sum_iX_i\\right)\n=\\frac1{n^2}\\sum_iV(X_i)\n=\\frac1{n^2}n\\sigma^2\n=\\frac{\\sigma^2}{n}.\n\$$</p>\n\n<p>したがって</p>\n<p>\$$\nE\\!\\left[\\sum_i(X_i-\\bar X)^2\\right]\n=n\\sigma^2-n\\frac{\\sigma^2}{n}\n=(n-1)\\sigma^2.\n\$$</p>\n<p>そこで \$n-1\$ で割れば</p>\n<p>\$$\nE[S^2]=\\sigma^2.\n\$$</p>\n\n<p><b>自由度の直感：</b>\$\\bar X\$ を使った偏差は必ず \$\\sum_i(X_i-\\bar X)=0\$ を満たします。\$n\$ 個の偏差を自由に決められず、最後の1個は残り \$n-1\$ 個から決まります。これが「自由度 \$n-1\$」です。</p>\n<p><b>注意：</b>「自由度が1減るから \$n-1\$」だけでは証明ではありません。上の期待値計算が厳密な理由で、自由度はそれを幾何学的に理解する説明です。</p>\n", "open": true}, "1.5.2": {"title": "IQRはなぜ外れ値に強いか", "html": "\n<p>範囲 \$\\max x-\\min x\$ は両端の2点だけで決まるため、1個の極端値で大きく変わります。</p>\n<p>IQR \$=Q_3-Q_1\$ は中央50%だけを見るので、端の少数の異常値の影響を受けにくいです。これは「データの一部を意図的に無視する代わりに頑健性を得る」という考えです。</p>\n", "open": false}, "1.5.4": {"title": "変動係数は「単位を消した標準偏差」だが万能ではない", "html": "\n<p>変動係数 \$CV=s/\\bar x\$ は、平均に対して標準偏差がどれくらい大きいかを表します。単位が消えるので、単位やスケールの異なる量を比較できます。</p>\n<p>ただし平均が0付近だと不安定になります。また温度の摂氏のように0が任意な尺度では、CVの意味は弱くなります。比例尺度で使うのが基本です。</p>\n", "open": false}, "1.6.1": {"title": "モーメントは分布の形を数値化する", "html": "\n<p>1次中心モーメントは0、2次中心モーメントが分散、3次を標準化したものが歪度、4次を標準化したものが尖度です。</p>\n<p>「モーメント」という言葉は力学のモーメントと同様に、基準点からの距離のべきで重み付けして形を要約する発想です。</p>\n", "open": false}, "1.6.3": {"title": "標準化の意味：単位を捨て、平均0・分散1へ移す", "html": "\n<p>\$$\nz_i=\\frac{x_i-\\bar x}{s}\n\$$</p>\n<p>は、まず平均を引いて中心を0へ移し、次に標準偏差で割って1標準偏差を「1」という単位に変えています。</p>\n<p>標準化後の値は「平均から何標準偏差離れているか」と読めます。この考えがz検定・正規分布・機械学習の前処理まで続きます。</p>\n", "open": false}, "1.7.1": {"title": "共分散と相関を符号から理解する", "html": "\n<p>共分散</p>\n<p>\$$\n\\operatorname{Cov}(X,Y)=E[(X-\\mu_X)(Y-\\mu_Y)]\n\$$</p>\n<p>では、両方が平均より上なら積は正、両方が下でも積は正、片方だけ上なら負になります。したがって平均すると「同じ向きに動く傾向」が正、「逆向き」が負になります。</p>\n<p>ただし共分散は単位に依存します。そこで</p>\n<p>\$$\n\\rho=\\frac{\\operatorname{Cov}(X,Y)}{\\sigma_X\\sigma_Y}\n\$$</p>\n<p>と標準偏差で割ると、単位のない \$[-1,1]\$ の相関係数になります。</p>\n<p><b>重要：</b>相関0は一般には独立を意味しません。独立なら共分散0ですが、逆は通常成り立ちません。</p>\n", "open": true}, "1.8": {"title": "頑健性は「1点の異常で結論が壊れないか」という視点", "html": "\n<p>平均や分散は全観測を二乗誤差で強く使うため、外れ値に敏感です。中央値やMADは一部の極端値が動いても結論が変わりにくいです。</p>\n<p>統計量を選ぶときは効率だけでなく、「現実のデータに少量の汚染が入ったときにどうなるか」も評価します。</p>\n", "open": false}, "1.9": {"title": "変換は「データを誤魔化す」ためではなく構造を見やすくする", "html": "\n<p>対数変換は、掛け算的な変動を足し算的な変動へ変えます。たとえば \$Y=AX^\\beta\$ に対数を取れば</p>\n<p>\$$\n\\log Y=\\log A+\\beta\\log X\n\$$</p>\n<p>となり、直線関係として扱えます。</p>\n<p>ただし変換後の平均を元の尺度へ戻すときは、単純に逆変換すればよいとは限りません。非線形変換では \$E[g(X)]\\neq g(E[X])\$ が一般的です。</p>\n", "open": false}, "2.2.1": {"title": "標本空間・事象・確率を分ける", "html": "\n<p>\$\\Omega\$ は「起こり得る結果を全部並べた集合」、事象 \$A\$ はその一部、\$P(A)\$ はその事象に割り当てられた確率です。</p>\n<p>サイコロなら \$\\Omega=\\{1,2,3,4,5,6\\}\$、偶数という事象は \$A=\\{2,4,6\\}\$、公平なら \$P(A)=3/6\$ です。</p>\n<p>確率変数はこのあと登場し、\$\\Omega\$ 上の結果を数へ写します。標本空間と確率変数を混ぜないことが大切です。</p>\n", "open": true}, "2.2.2": {"title": "Kolmogorovの公理から何が生まれるか", "html": "\n<p>確率の公理は少数ですが、そこから補集合・和事象・単調性など多くの計算規則が導かれます。</p>\n<p>たとえば \$A\$ と \$A^c\$ は互いに排反で全体を作るため</p>\n<p>\$$\nP(A)+P(A^c)=P(\\Omega)=1,\n\$$</p>\n<p>よって \$P(A^c)=1-P(A)\$ です。公式として暗記するより、公理から出ていると理解すると応用が利きます。</p>\n", "open": false}, "2.3.1": {"title": "条件付き確率は「分母となる世界を変える」", "html": "\n<p>\$$\nP(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}\n\$$</p>\n<p>は、\$B\$ が起きたと分かったので、世界全体ではなく \$B\$ の中だけを100%として割合を取り直しています。</p>\n<p>分母が \$P(B)\$ になるのは、考えている母集団そのものを \$B\$ に縮めたからです。</p>\n", "open": true}, "2.3.2": {"title": "Bayesの定理は「条件の向きを反転する」", "html": "\n<p>観測したいのはしばしば \$P(\\text{原因}\\mid\\text{結果})\$ ですが、モデルとして分かりやすいのは \$P(\\text{結果}\\mid\\text{原因})\$ です。Bayesの定理は両者をつなぎます。</p>\n<p>\$$\nP(A\\mid B)=\\frac{P(B\\mid A)P(A)}{P(B)}.\n\$$</p>\n<p>分子の \$P(B\\mid A)P(A)\$ は「Aが起こり、かつBが観測される重み」、分母 \$P(B)\$ は全候補の重みを足して正規化する項です。</p>\n", "open": false}, "2.3.3": {"title": "独立は「情報を得ても確率が変わらない」", "html": "\n<p>\$A\$ と \$B\$ が独立とは</p>\n<p>\$$\nP(A\\mid B)=P(A)\n\$$</p>\n<p>と考えるのが直感的です。\$B\$ を知っても \$A\$ の確率が変わりません。</p>\n<p>これと同値なのが \$P(A\\cap B)=P(A)P(B)\$ です。排反とは全く別物です。排反な2事象は同時に起きないため、正の確率を持つならむしろ独立ではありません。</p>\n", "open": false}, "2.4.1": {"title": "確率変数とは何か：名前に惑わされない", "html": "\n<p><b>確率変数は「確率」ではなく「関数」です。</b></p>\n<p>\$$\nX:\\Omega\\to\\mathbb R\n\$$</p>\n<p>は、起こった結果 \$\\omega\$ を実数 \$X(\\omega)\$ に変換します。</p>\n<p>たとえばコイン2回なら \$\\Omega=\\{HH,HT,TH,TT\\}\$ として、「表の枚数」を \$X\$ とすれば</p>\n<ul>\n<li>\$X(HH)=2\$</li>\n<li>\$X(HT)=X(TH)=1\$</li>\n<li>\$X(TT)=0\$</li>\n</ul>\n<p>です。</p>\n<p>統計の実用上は、<b>「観測前で値がまだ確定していない数」</b>と捉えると十分です。観測前は \$X\$、観測後に3.2が出たなら実現値 \$x=3.2\$ です。</p>\n<p>分布関数</p>\n<p>\$$\nF_X(x)=P(X\\le x)\n\$$</p>\n<p>は「横軸の値 \$x\$ までに、確率がどれくらい累積したか」を表します。</p>\n", "open": true}, "2.4.2": {"title": "離散型と連続型で「1点の確率」が違う", "html": "\n<p>離散型では \$P(X=x)\$ が正の値を持てます。一方、連続型では通常 \$P(X=x)=0\$ です。</p>\n<p>連続型で0になるのは「その値が起こらない」からではなく、無限に細かい1点の幅が0だからです。確率は区間</p>\n<p>\$$\nP(a\\le X\\le b)=\\int_a^b f(x)\\,dx\n\$$</p>\n<p>として面積で得ます。</p>\n", "open": false}, "2.4.3": {"title": "分位点はCDFの逆向き", "html": "\n<p>CDFが「値 \$x\$ → そこまでの確率 \$p\$」を返すのに対し、分位関数は「確率 \$p\$ → その位置の値 \$x\$」を返します。</p>\n<p>中央値は \$p=0.5\$ の分位点、95パーセンタイルは \$p=0.95\$ の分位点です。信頼区間や極値統計でも頻繁に使います。</p>\n", "open": false}, "2.5.1": {"title": "期待値はどこから出てきたのか", "html": "\n<p><b>期待値は「ランダムな量を1つの代表値に要約したい」という要求から出てきます。</b></p>\n<p>離散型では</p>\n<p>\$$\nE[X]=\\sum_i x_i\\,P(X=x_i).\n\$$</p>\n<p>これは「各値 × その値が現れる長期的割合」を足した加重平均です。</p>\n<p>たとえば公平なサイコロなら</p>\n<p>\$$\nE[X]=1\\frac16+2\\frac16+\\cdots+6\\frac16=3.5.\n\$$</p>\n<p>3.5の目は存在しません。期待値は「次回3.5が出る」という予言ではなく、<b>繰り返したときの平均の中心</b>です。</p>\n<p>連続型では値が無限にあるため、和を積分へ置き換えて</p>\n<p>\$$\nE[X]=\\int_{-\\infty}^{\\infty}x f(x)\\,dx\n\$$</p>\n<p>とします。</p>\n<p>統計で期待値が重要なのは、\$\\bar X,S^2,\\hat\\theta\$ などの<b>推定量そのものが確率変数</b>だからです。「推定を何度も繰り返したら平均的にどこへ来るか」を \$E[\\hat\\theta]\$ で調べます。</p>\n", "open": true}, "2.5.2": {"title": "分散の定義と \$E[X^2]-E[X]^2\$ の導出", "html": "\n<p>分散の定義は</p>\n<p>\$$\nV(X)=E[(X-\\mu)^2],\\qquad \\mu=E[X].\n\$$</p>\n<p>展開すると</p>\n<p>\$$\nE[X^2-2\\mu X+\\mu^2]\n=E[X^2]-2\\mu E[X]+\\mu^2.\n\$$</p>\n<p>\$E[X]=\\mu\$ なので</p>\n<p>\$$\nV(X)=E[X^2]-2\\mu^2+\\mu^2\n=E[X^2]-\\mu^2.\n\$$</p>\n<p>よって</p>\n<p>\$$\nV(X)=E[X^2]-E[X]^2.\n\$$</p>\n<p>後者は計算用の公式、前者は意味を表す定義、と区別すると分かりやすいです。</p>\n", "open": true}, "2.5.3": {"title": "母関数は「分布の情報を別の関数へ詰め込む」", "html": "\n<p>モーメント母関数 \$M_X(t)=E[e^{tX}]\$ は、一見唐突ですが、\$e^{tX}\$ をTaylor展開すると</p>\n<p>\$$\ne^{tX}=1+tX+\\frac{t^2X^2}{2!}+\\cdots\n\$$</p>\n<p>なので、期待値を取ることで \$E[X],E[X^2],\\ldots\$ が係数として現れます。</p>\n<p>微分して \$t=0\$ を代入すればモーメントが取り出せるため「母関数」と呼ばれます。</p>\n", "open": false}, "2.7.1": {"title": "同時・周辺・条件付き分布の関係", "html": "\n<p>同時分布 \$p(x,y)\$ は \$X,Y\$ を一緒に見た分布です。周辺分布は片方を無視して足し合わせます。</p>\n<p>離散型なら</p>\n<p>\$$\np_X(x)=\\sum_y p(x,y).\n\$$</p>\n<p>条件付き分布は \$Y=y\$ に世界を絞り</p>\n<p>\$$\np(x\\mid y)=\\frac{p(x,y)}{p_Y(y)}\n\$$</p>\n<p>と再正規化します。</p>\n", "open": false}, "2.7.2": {"title": "共分散0と独立は違う", "html": "\n<p>独立なら \$E[XY]=E[X]E[Y]\$ なので共分散は0です。</p>\n<p>しかし共分散0は「線形な一緒の動きがない」ことしか保証しません。たとえば \$X\$ が0を中心に対称で \$Y=X^2\$ なら強い依存関係がありますが、共分散は0になり得ます。</p>\n", "open": false}, "2.7.3": {"title": "条件付き期待値は「情報を得た後の最善の平均」", "html": "\n<p>\$$\nE[X\\mid Y]\n\$$</p>\n<p>は、\$Y\$ が分かった後での \$X\$ の平均です。\$Y\$ の値によって変わるので、一般には定数ではなく \$Y\$ の関数です。</p>\n<p>全期待値の公式</p>\n<p>\$$\nE[X]=E[E[X\\mid Y]]\n\$$</p>\n<p>は「まず各グループ内で平均し、そのグループ平均を全体で平均すれば全体平均になる」と読めます。</p>\n<p>全分散の公式</p>\n<p>\$$\nV(X)=E[V(X\\mid Y)]+V(E[X\\mid Y])\n\$$</p>\n<p>は「全体のばらつき＝グループ内のばらつき＋グループ間平均のばらつき」です。ANOVAの思想にも直結します。</p>\n", "open": true}, "2.8.1": {"title": "変数変換で密度にヤコビアンが必要な理由", "html": "\n<p>確率そのものは変数名を変えても保存されます。小区間で</p>\n<p>\$$\nf_X(x)\\,dx=f_Y(y)\\,dy\n\$$</p>\n<p>である必要があります。</p>\n<p>したがって \$y=g(x)\$ なら</p>\n<p>\$$\nf_Y(y)=f_X(x)\\left|\\frac{dx}{dy}\\right|.\n\$$</p>\n<p>ヤコビアンは「座標を変えたとき、幅や面積がどれくらい伸び縮みするか」を補正しています。</p>\n", "open": false}, "2.9": {"title": "確率不等式は「分布の形を知らなくても言える保証」", "html": "\n<p>MarkovやChebyshevの不等式は、正規分布のような具体的形を仮定せず、期待値や分散だけから確率を上から抑えます。</p>\n<p>保証は保守的ですが、仮定が少ないため理論上非常に強い道具です。大数の法則の証明にも使われます。</p>\n", "open": false}, "2.10.1": {"title": "収束は「何が、どんな意味で近づくか」を区別する", "html": "\n<p>確率収束・概収束・分布収束は同じ「近づく」ではありません。</p>\n<p>統計でまず重要なのは確率収束</p>\n<p>\$$\nX_n\\xrightarrow{p}c,\n\$$</p>\n<p>つまり任意の \$\\varepsilon&gt;0\$ について</p>\n<p>\$$\nP(|X_n-c|>\\varepsilon)\\to0\n\$$</p>\n<p>となることです。「大きく外れる確率が0へ行く」と読めます。</p>\n", "open": false}, "2.10.2": {"title": "大数の法則が保証しているもの", "html": "\n<p>大数の法則は、各 \$X_i\$ が \$\\mu\$ に近づくとは言っていません。</p>\n<p>\$$\n\\bar X_n=\\frac1n\\sum_{i=1}^nX_i\n\$$</p>\n<p>という<b>平均</b>が \$\\mu\$ に近づきます。</p>\n<p>直感的には、独立な誤差の正負が平均化によって打ち消されるためです。標本平均を母平均の推定に使える根拠の1つです。</p>\n", "open": true}, "2.11.1": {"title": "中心極限定理：何が正規分布になるのか", "html": "\n<p>中心極限定理が正規分布にすると言っているのは、元データ \$X_i\$ ではありません。</p>\n<p>\$$\n\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}\n\$$</p>\n<p>という<b>標本平均の標準化誤差</b>です。</p>\n<p>元の分布が歪んでいても、一定の条件の下で \$n\$ が大きいと、この量の分布が標準正規分布へ近づきます。</p>\n<p>ここから</p>\n<p>\$$\n\\bar X\\approx N\\!\\left(\\mu,\\frac{\\sigma^2}{n}\\right)\n\$$</p>\n<p>という近似が生まれ、信頼区間・検定が作れます。</p>\n", "open": true}, "2.11.4": {"title": "標準誤差 \$\\sigma/\\sqrt n\$ の意味", "html": "\n<p>標本平均の分散は</p>\n<p>\$$\nV(\\bar X)=\\frac{\\sigma^2}{n},\n\$$</p>\n<p>なので標準偏差は</p>\n<p>\$$\n\\operatorname{SE}(\\bar X)=\\frac{\\sigma}{\\sqrt n}.\n\$$</p>\n<p>データそのものの散らばりが \$\\sigma\$、<b>標本平均を取り直したときの散らばり</b>が \$\\sigma/\\sqrt n\$ です。</p>\n<p>標本数を4倍にしても誤差は1/4ではなく1/2になる、という \$\\sqrt n\$ 則が重要です。</p>\n", "open": false}, "3.2.1": {"title": "母集団・標本・統計量・推定量を完全に分離する", "html": "\n<p><b>母数：</b>\$\\mu,\\sigma^2,\\theta\$。未知でも、頻度論では固定された値。</p>\n<p><b>標本：</b>\$X_1,\\ldots,X_n\$。母集団からランダムに得られるため確率変数。</p>\n<p><b>統計量：</b>\$T(X_1,\\ldots,X_n)\$。標本だけから計算され、未知母数そのものを式に含まない量。</p>\n<p><b>推定量：</b>母数を当てる目的で使う統計量。</p>\n<p><b>推定値：</b>実際のデータを推定量へ代入して得られた具体的な数。</p>\n<p>例：\$\\bar X\$ は推定量、実データから得た \$\\bar x=12.4\$ は推定値です。</p>\n", "open": true}, "3.2.2": {"title": "標本分布は「統計量を何度も計算した分布」", "html": "\n<p>100人を抽出して平均 \$\\bar X\$ を計算する実験を1万回繰り返すと、1万個の平均ができます。その分布が \$\\bar X\$ の<b>標本分布</b>です。</p>\n<p>元データの分布と標本平均の分布は別物です。標準誤差は後者の標準偏差です。</p>\n<p>推測統計では「今回の統計量がどれくらい珍しいか」を判断するため、統計量の標本分布が中心になります。</p>\n", "open": true}, "3.2.3": {"title": "\$\\chi^2\$ と \$t\$ がどこから出るか", "html": "\n<p>正規母集団では、平均と分散に関する標準化量が特別な分布を持ちます。</p>\n<p>母分散が既知なら</p>\n<p>\$$\n\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\sim N(0,1).\n\$$</p>\n<p>しかし現実には \$\\sigma\$ も未知なことが多いため、\$\\sigma\$ を \$S\$ に置き換えると追加の不確実性が生じ、</p>\n<p>\$$\n\\frac{\\bar X-\\mu}{S/\\sqrt n}\\sim t_{n-1}\n\$$</p>\n<p>となります。\$t\$ 分布の裾が正規分布より厚いのは、この「分母も推定している不確実性」を反映しています。</p>\n", "open": false}, "3.3.1": {"title": "不偏・一致・有効は別の性質", "html": "\n<p><b>不偏：</b></p>\n<p>\$$\nE[\\hat\\theta]=\\theta.\n\$$</p>\n<p>何度も標本を取り直した推定値の平均が真値になる、という性質です。今回の推定値が真値に近いことは保証しません。</p>\n\n<p><b>一致：</b></p>\n<p>\$$\n\\hat\\theta_n\\xrightarrow{p}\\theta.\n\$$</p>\n<p>標本数を増やすと、真値から大きく外れる確率が0へ近づく性質です。</p>\n\n<p><b>有効：</b>同じ条件の推定量の中で分散が小さいことです。</p>\n<p>不偏だが分散が大きい推定量と、少しバイアスがあるが分散が小さい推定量では、後者のMSEが小さいこともあります。</p>\n", "open": true}, "3.3.2": {"title": "MSEがバイアスと分散へ分解できる理由", "html": "\n<p>\$$\n\\operatorname{MSE}(\\hat\\theta)=E[(\\hat\\theta-\\theta)^2].\n\$$</p>\n<p>\$\\hat\\theta-\\theta\$ を</p>\n<p>\$$\n(\\hat\\theta-E[\\hat\\theta])+(E[\\hat\\theta]-\\theta)\n\$$</p>\n<p>と分けて二乗し、期待値を取ると交差項が0になり、</p>\n<p>\$$\n\\operatorname{MSE}(\\hat\\theta)\n=V(\\hat\\theta)+\\operatorname{Bias}(\\hat\\theta)^2\n\$$</p>\n<p>が得られます。</p>\n<p>「ばらつき」と「中心のズレ」の両方を同時に評価する尺度です。機械学習のバイアス–分散の考え方にもつながります。</p>\n", "open": false}, "3.4": {"title": "モーメント法：理論の特徴量と標本の特徴量を一致させる", "html": "\n<p>母集団の理論モーメント \$E[X],E[X^2],\\ldots\$ はパラメータ \$\\theta\$ の関数です。一方、標本モーメント</p>\n<p>\$$\n\\frac1n\\sum_iX_i,\\qquad \\frac1n\\sum_iX_i^2\n\$$</p>\n<p>はデータから計算できます。</p>\n<p>両者を等しいと置いて \$\\theta\$ を解くのがモーメント法です。大数の法則により、標本モーメントが母モーメントへ近づくことが背景にあります。</p>\n", "open": false}, "3.5.1": {"title": "尤度と確率の「同じ式・違う見方」", "html": "\n<p>確率モデル \$p(x\\mid\\theta)\$ では、通常 \$\\theta\$ を固定して「どんな \$x\$ が出るか」を考えます。</p>\n<p>観測後は \$x\$ がすでに決まっています。そこで同じ式を</p>\n<p>\$$\nL(\\theta;x)=p(x\\mid\\theta)\n\$$</p>\n<p>と書き、「どの \$\\theta\$ ならこの \$x\$ がもっとも自然か」を比較します。これが尤度です。</p>\n<p><b>尤度は \$\\theta\$ の確率分布ではありません。</b> \$\\theta\$ について積分して1になる必要もありません。</p>\n<p>独立標本なら同時確率が積になるため</p>\n<p>\$$\nL(\\theta)=\\prod_i f(x_i\\mid\\theta).\n\$$</p>\n<p>積は計算しにくいので対数を取り</p>\n<p>\$$\n\\ell(\\theta)=\\sum_i\\log f(x_i\\mid\\theta)\n\$$</p>\n<p>を最大化します。対数は単調増加なので最大位置は変わりません。</p>\n", "open": true}, "3.5.2": {"title": "スコアとFisher情報量を「坂」と「曲率」で理解する", "html": "\n<p>スコア</p>\n<p>\$$\nU(\\theta)=\\frac{\\partial \\ell(\\theta)}{\\partial\\theta}\n\$$</p>\n<p>は対数尤度の傾きです。最尤点では通常この傾きが0になります。</p>\n<p>Fisher情報量は、尤度の山が平均的にどれくらい鋭いかを表します。山が鋭いほど、\$\\theta\$ を少し動かしただけで適合度が下がるため、\$\\theta\$ を精密に特定できます。</p>\n<p>情報量が大きいほど最尤推定量の漸近分散が小さくなる、という関係につながります。</p>\n", "open": false}, "3.5.3": {"title": "漸近正規性は「大標本で推定誤差が正規化される」", "html": "\n<p>適切な条件の下で最尤推定量は</p>\n<p>\$$\n\\sqrt n(\\hat\\theta-\\theta)\n\\overset{d}{\\longrightarrow}\nN(0,I(\\theta)^{-1})\n\$$</p>\n<p>のように正規分布へ近づきます。</p>\n<p>これは「\$\\hat\\theta\$ 自体が必ず正規分布」という主張ではありません。標本数が大きいときの<b>推定誤差</b>の近似です。</p>\n", "open": false}, "3.6": {"title": "Cramér–Rao下限は「不偏推定の精度に限界がある」", "html": "\n<p>どれほど工夫しても、所定の正則条件の下では不偏推定量の分散を</p>\n<p>\$$\nV(\\hat\\theta)\\ge \\frac{1}{I(\\theta)}\n\$$</p>\n<p>より小さくできない、という下限です。</p>\n<p>Fisher情報量が「データが持つ \$\\theta\$ についての情報量」、その逆数が「避けられない推定誤差」と対応します。</p>\n", "open": false}, "3.7": {"title": "十分統計量は「パラメータについて必要な情報を圧縮する」", "html": "\n<p>十分統計量 \$T(X)\$ は、元データが持つ \$\\theta\$ に関する情報を失わずに圧縮した量です。</p>\n<p>Rao–Blackwell定理は、ある不偏推定量を十分統計量で条件付き期待値にすると、分散を悪化させず改善できることを述べます。</p>\n<p>条件付き期待値が「情報を得た後の平均」であることが、ここで推定理論の道具になります。</p>\n", "open": false}, "3.8.1": {"title": "信頼区間の95%は「手続きの成功率」", "html": "\n<p>頻度論では母数 \$\\theta\$ は固定されています。したがって、計算後の1つの区間について「\$\\theta\$ が95%の確率で入る」とは通常解釈しません。</p>\n<p>95%信頼区間とは、同じ方法で標本抽出と区間作成を何度も繰り返すと、作られた区間の95%が真の \$\\theta\$ を含むような<b>手続き</b>です。</p>\n<p>ランダムなのは区間の端点であり、真値ではありません。</p>\n", "open": true}, "3.8.2": {"title": "z区間とt区間の違いは「\$\\sigma\$ を知っているか」", "html": "\n<p>母分散が既知なら</p>\n<p>\$$\n\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}\n\$$</p>\n<p>を使えます。未知なら \$\\sigma\$ を \$S\$ に置き換えるため、分母の推定誤差を含めた \$t\$ 分布を使います。</p>\n<p>標本数が増えると \$S\$ が \$\\sigma\$ をよく近似するので、\$t\$ 分布は正規分布へ近づきます。</p>\n", "open": false}, "3.8.3": {"title": "被覆確率をシミュレーションで考える", "html": "\n<p>真の \$\\mu\$ を固定し、100個の標本を取り、それぞれ95%信頼区間を作ると、長期的には約95本が真の \$\\mu\$ を横切ります。</p>\n<p>これが「被覆」の意味です。1本だけ見ていると直感しづらいため、信頼区間は反復実験を想像すると理解しやすくなります。</p>\n", "open": false}, "3.9.1": {"title": "ブートストラップは「標本を仮の母集団にする」", "html": "\n<p>本当の母集団から何度も標本を取り直せれば、推定量の標本分布を直接観察できます。しかし現実には元の母集団へ戻れません。</p>\n<p>そこで手元の標本を仮の母集団とみなし、そこから復元抽出して「取り直し」を模倣します。</p>\n<p>各再標本で統計量を計算し、その分布から標準誤差や区間を推定します。</p>\n", "open": true}, "3.10": {"title": "ジャックナイフは「1点ずつ抜いて影響を見る」", "html": "\n<p>観測 \$i\$ を1つ抜いた推定値 \$\\hat\\theta_{(-i)}\$ を全部計算します。</p>\n<p>どの点を抜くと推定値が大きく動くかを見ることで、バイアスや分散、個々の観測の影響を評価できます。回帰の影響診断にも同じ発想が現れます。</p>\n", "open": false}, "4.2.1": {"title": "帰無仮説は「一旦仮定する基準世界」", "html": "\n<p>\$H_0\$ を真だと仮定し、その世界でデータがどれくらい極端かを測ります。</p>\n<p>検定は \$P(H_0\\mid\\text{data})\$ を直接計算するものではありません。計算しているのは \$P(\\text{data or more extreme}\\mid H_0)\$ 側です。</p>\n", "open": true}, "4.2.2": {"title": "第I種・第II種過誤を2×2表で考える", "html": "\n<p>現実が \$H_0\$ / \$H_1\$、判定が棄却 / 非棄却、という2×2表を作ると整理できます。</p>\n<p>本当は \$H_0\$ なのに棄却するのが第I種過誤 \$\\alpha\$。本当は \$H_1\$ なのに棄却できないのが第II種過誤 \$\\beta\$。検出力は \$1-\\beta\$ です。</p>\n", "open": false}, "4.3.1": {"title": "p値の条件の向きを絶対に逆にしない", "html": "\n<p>p値は</p>\n<p>\$$\nP(\\text{観測値以上に極端}\\mid H_0)\n\$$</p>\n<p>です。</p>\n<p>\$$\nP(H_0\\mid\\text{data})\n\$$</p>\n<p>ではありません。後者を求めたいなら、事前分布を含むベイズ的枠組みが必要です。</p>\n", "open": true}, "4.4.1": {"title": "t統計量は「差を標準誤差で測った距離」", "html": "\n<p>\$$\nt=\\frac{\\bar X-\\mu_0}{S/\\sqrt n}\n\$$</p>\n<p>は、「観測された平均と仮説値の差」が、標本平均の典型的な揺らぎ \$S/\\sqrt n\$ の何倍かを測っています。</p>\n<p>分子だけでは単位やノイズ量が違うデータを比較できないため、標準誤差で尺度をそろえます。</p>\n", "open": false}, "4.10": {"title": "検出力と標本数の関係", "html": "\n<p>標本数を増やすと標準誤差が概ね \$1/\\sqrt n\$ で小さくなるため、同じ効果量でも検定統計量が大きくなりやすく、検出力が上がります。</p>\n<p>「有意差が出なかった」は「差がない」と同義ではありません。単に標本数が小さく、検出力が不足している可能性があります。</p>\n", "open": false}, "5.2": {"title": "単回帰を条件付き平均として読む", "html": "\n<p>\$$\nY=\\beta_0+\\beta_1X+\\varepsilon\n\$$</p>\n<p>で \$E[\\varepsilon\\mid X]=0\$ なら</p>\n<p>\$$\nE[Y\\mid X]=\\beta_0+\\beta_1X.\n\$$</p>\n<p>つまり回帰直線は、個々の \$Y\$ を完全に当てる線ではなく、<b>Xが与えられたときのYの平均</b>を表します。</p>\n", "open": true}, "5.3": {"title": "行列表現は単回帰をまとめ書きしたもの", "html": "\n<p>\$$\n\\mathbf y=\\mathbf X\\boldsymbol\\beta+\\boldsymbol\\varepsilon\n\$$</p>\n<p>は、新しい概念というより、多数の観測と多数の説明変数を1つの式にまとめたものです。</p>\n<p>最小二乗解</p>\n<p>\$$\n\\hat\\beta=(X^\\top X)^{-1}X^\\top y\n\$$</p>\n<p>は、残差平方和を最小にする連立方程式の解です。</p>\n", "open": false}, "5.4": {"title": "Gauss–Markovの「最良」の範囲", "html": "\n<p>BLUEのBはBestですが、「あらゆる推定方法の中で最良」ではありません。</p>\n<p><b>線形かつ不偏な推定量</b>というクラスの中で、所定の誤差条件の下で分散最小、という限定された主張です。</p>\n", "open": false}, "5.6": {"title": "多重共線性は予測より係数解釈を壊しやすい", "html": "\n<p>説明変数どうしがほぼ同じ情報を持つと、どちらの変数へ効果を割り当てるかが不安定になります。</p>\n<p>そのため係数の標準誤差が大きくなり、符号や大きさが標本によって変わりやすくなります。予測値自体は比較的安定なこともあります。</p>\n", "open": false}, "5.7": {"title": "残差診断はモデルの仮定をデータへ問い返す", "html": "\n<p>回帰式を当てた後に終わりではありません。残差に構造が残っていれば、モデルが説明できていない情報があります。</p>\n<p>曲線パターンなら非線形性、扇形なら不均一分散、時系列パターンなら独立性違反などを疑います。</p>\n", "open": false}, "5.9": {"title": "一般化線形モデルは3部品に分ける", "html": "\n<p>GLMは次の3つで整理できます。</p>\n<ol>\n<li>応答変数の分布</li>\n<li>線形予測子 \$\\eta=X\\beta\$</li>\n<li>平均 \$\\mu\$ と \$\\eta\$ を結ぶリンク関数 \$g(\\mu)=\\eta\$</li>\n</ol>\n<p>ロジスティック回帰なら二項分布＋logitリンク、Poisson回帰ならPoisson分布＋logリンクです。</p>\n", "open": false}, "6.2": {"title": "ANOVAの平方和分解は「全体＝群間＋群内」", "html": "\n<p>観測値の全平均との差を</p>\n<p>\$$\ny_{ij}-\\bar y=(\\bar y_i-\\bar y)+(y_{ij}-\\bar y_i)\n\$$</p>\n<p>と「群平均の差」と「群内の差」に分けます。</p>\n<p>これを二乗和にすると、条件の下で交差項が消え、全平方和が群間平方和＋群内平方和へ分解されます。</p>\n", "open": true}, "7.4": {"title": "PCAを最適化問題として理解する", "html": "\n<p>第1主成分は、単位ベクトル \$a\$ に対して射影 \$a^\\top X\$ の分散</p>\n<p>\$$\nV(a^\\top X)=a^\\top\\Sigma a\n\$$</p>\n<p>を最大化する方向です。</p>\n<p>\$\\|a\\|=1\$ の制約下で最大化すると、\$\\Sigma\$ の最大固有値に対応する固有ベクトルが出ます。だからPCAに固有値分解が現れます。</p>\n", "open": true}, "8.2": {"title": "Bayesの式を『更新』として読む", "html": "\n<p>\$$\np(\\theta\\mid y)\n=\\frac{p(y\\mid\\theta)p(\\theta)}{p(y)}\n\\propto p(y\\mid\\theta)p(\\theta).\n\$$</p>\n<p>事後分布は「尤度×事前分布」を正規化したものです。</p>\n<p>データと整合する \$\\theta\$ は尤度で重くなり、事前にもっともらしい \$\\theta\$ は事前分布で重くなります。</p>\n", "open": true}, "9.4": {"title": "自己相関は『時間差つきの相関』", "html": "\n<p>ラグ \$k\$ の自己相関は \$X_t\$ と \$X_{t-k}\$ の相関です。</p>\n<p>通常の相関が2つの別変数の関係を見るのに対し、自己相関は同じ変数を時間だけずらして比較します。</p>\n", "open": false}, "10.2": {"title": "ハザードは確率ではなく『瞬間的な率』", "html": "\n<p>生存関数 \$S(t)=P(T&gt;t)\$ は時刻 \$t\$ を超えて生存する確率です。</p>\n<p>ハザード \$h(t)\$ は「\$t\$ まで生き残ったという条件の下で、直後にイベントが起きる瞬間的な率」です。</p>\n<p>したがってハザードは1を超えることもあり、直接の確率とは違います。</p>\n", "open": false}, "10.8": {"title": "構造信頼性を確率問題へ翻訳する", "html": "\n<p>限界状態関数</p>\n<p>\$$\ng(X)=R-S\n\$$</p>\n<p>を考え、\$g&gt;0\$ を安全、\$g\\le0\$ を破壊とすれば、破壊確率は</p>\n<p>\$$\nP_f=P(g(X)\\le0)\n\$$</p>\n<p>です。耐力 \$R\$ と荷重効果 \$S\$ の不確実性を1つの確率問題へまとめています。</p>\n", "open": true}, "11.3": {"title": "因果効果は『見えない差』", "html": "\n<p>個体 \$i\$ の因果効果は</p>\n<p>\$$\nY_i(1)-Y_i(0)\n\$$</p>\n<p>ですが、同じ個体について処置あり・なしを同時に観測できません。片方は必ず反実仮想です。</p>\n<p>無作為化は、個体ごとの見えない差を直接観測する代わりに、群平均どうしを比較可能にします。</p>\n", "open": true}, "12.3": {"title": "バイアス–分散は『平均的なズレ』と『標本間の揺れ』", "html": "\n<p>単純すぎるモデルは真の構造を表現できずバイアスが大きくなります。複雑すぎるモデルは標本ごとの偶然を拾い、分散が大きくなります。</p>\n<p>汎化誤差を小さくするには、この2つのバランスを取る必要があります。</p>\n", "open": false}, "12.4": {"title": "交差検証は未知データを擬似的に作る", "html": "\n<p>学習に使ったデータで評価すると、過学習したモデルほど良く見えます。</p>\n<p>そこで一部を学習から外し、未使用データとして評価します。これを分割を変えて繰り返し、未知データでの性能を近似します。</p>\n", "open": false}, "13.4": {"title": "モンテカルロ積分は『期待値を平均で計算する』", "html": "\n<p>積分を</p>\n<p>\$$\nI=\\int h(x)f(x)\\,dx=E[h(X)]\n\$$</p>\n<p>と期待値に書き換えます。</p>\n<p>大数の法則により</p>\n<p>\$$\nI\\approx\\frac1N\\sum_{i=1}^N h(X_i)\n\$$</p>\n<p>と標本平均で近似できます。確率論がそのまま数値計算法になります。</p>\n", "open": true}, "13.5": {"title": "LHSが単純乱数より均等になる理由", "html": "\n<p>各入力変数の累積確率区間を \$N\$ 個に分け、各層から必ず1点ずつ取ります。</p>\n<p>そのため、単純乱数で起こり得る「ある領域に点が固まり、別の領域が空白になる」現象を抑えられます。</p>\n", "open": false}, "14.2": {"title": "実データでは『推定値』より『不確実性込みの結論』を見る", "html": "\n<p>コンクリート強度の標本平均だけを報告しても、標本数やばらつきが分かりません。</p>\n<p>設計・受入判断では、推定値に標準誤差や信頼区間、下側特性値を組み合わせ、「どこまでなら安全側に言えるか」を評価します。</p>\n", "open": false}};
const V1_NOTES={"0.2":{"title":"章立ては『問題の種類』が変わる順番","html":"<p>第1章は観測済みデータの要約、第2章は観測前の不確実性、第3〜4章は未知母数の推定・検定、第5章以降は回帰・多変量・時系列・因果・予測へ進みます。</p>\n<p>特に第1〜3章の平均・分散・期待値・標本分布・標準誤差は後半の共通言語です。</p>","open":false},"0.4":{"title":"式を読むときの3点チェック","html":"<p>毎回、①今何を求めたいか、②固定値か確率変数か、③両辺の単位・次元が合うか、を先に確認してください。</p>\n<p>例えば $E[\\bar X]=\\mu$ では、$\\bar X$ は標本を取り直すと変わる確率変数ですが、$E[\\ ]$ を通した後は固定値になります。</p>","open":false},"1.1":{"title":"記述統計は今回のデータをどう圧縮するか","html":"<p>平均・中央値・分散・相関は、元データを少数の数字へ圧縮する道具です。圧縮には必ず情報損失があるため、中心・散らばり・形・外れ値・変数間関係を別々に見ます。</p>","open":true},"1.3":{"title":"ヒストグラムと確率密度は別物","html":"<p>ヒストグラムは有限個の観測データから作る要約です。後で出る密度関数 $f(x)$ は確率モデルそのものです。標本を取り直せばヒストグラムは変わります。</p>","open":false},"1.4":{"title":"『中心』は目的関数で変わる","html":"<p>二乗距離を最小にする中心が平均、絶対距離を最小にする中心が中央値です。どちらが正しいかではなく、何を損失と考えるかで選びます。</p>","open":false},"1.4.4":{"title":"平均と中央値の差は歪みの手掛かり","html":"<p>右に長い尾があると大きな値が平均を右へ引っ張り、典型的には平均が中央値より大きくなります。ただし2つの値だけで分布形を完全には決められません。</p>","open":false},"1.5":{"title":"散らばりは中心からの距離をどう集計するか","html":"<p>分散は二乗距離、MADは絶対距離、IQRは中央50%の幅を使います。同じ『ばらつき』でも外れ値への感度が違います。</p>","open":false},"1.5.1":{"title":"母分散の定義と標本分散の導出を分ける","html":"<p><b>まず、2種類の分散を分けます。</b></p>\n<ul>\n<li>母分散：$\\sigma^2=V(X)=E[(X-\\mu)^2]$。これは確率変数 $X$ の散らばりの<b>定義</b>。</li>\n<li>標本分散：$S^2=\\dfrac1{n-1}\\sum_i(X_i-\\bar X)^2$。未知の $\\sigma^2$ を標本から当てる<b>推定量</b>。</li>\n</ul>\n<p>したがって「分散の定義より $E[(X_i-\\mu)^2]=\\sigma^2$」は、今導こうとしている標本分散を先取りしているのではありません。すでに定義済みの母分散を出発点に、標本分散の形を導いています。</p>\n\n<p><b>$E[\\ ]$ は係数ではなく演算子です。</b> 「両辺に $E$ をかける」は掛け算ではなく、両辺をそれぞれ期待値を取る操作へ入れるという意味です。</p>\n<p>$E[X]$ は実際に何回か測った平均ではなく、確率分布から決まる理論上の平均です。実際の $N$ 回平均は</p>\n<p>$$\\bar X_N=\\frac1N\\sum_{i=1}^N X_i$$</p>\n<p>で、$N$ を増やすとこれが $E[X]$ へ近づくのが大数の法則です。</p>\n\n<p>もし真の平均 $\\mu$ が既知なら</p>\n<p>$$E\\!\\left[\\frac1n\\sum_i(X_i-\\mu)^2\\right]\n=\\frac1n\\sum_iE[(X_i-\\mu)^2]\n=\\sigma^2.$$</p>\n<p>ところが $\\mu$ は未知なので、同じデータから計算した $\\bar X$ を中心に使います。$\\bar X$ はデータに最も都合のよい中心なので、偏差平方和は平均的に少し小さくなります。</p>\n\n<p>恒等式</p>\n<p>$$\\sum_i(X_i-\\bar X)^2\n=\\sum_i(X_i-\\mu)^2-n(\\bar X-\\mu)^2$$</p>\n<p>に期待値を取ると、第1項は $n\\sigma^2$、第2項は</p>\n<p>$$nE[(\\bar X-\\mu)^2]=nV(\\bar X)\n=n\\frac{\\sigma^2}{n}=\\sigma^2$$</p>\n<p>なので</p>\n<p>$$E\\!\\left[\\sum_i(X_i-\\bar X)^2\\right]=(n-1)\\sigma^2.$$</p>\n<p>そこで $n-1$ で割れば $E[S^2]=\\sigma^2$ になります。</p>\n\n<p><b>次元チェック：</b>$X$ が cm なら $X-\\mu$ は cm、$(X-\\mu)^2$ と $\\sigma^2$ は cm²、標準偏差 $\\sigma$ は cm です。</p>","open":true},"1.5.3":{"title":"MADは二乗しない散らばり","html":"<p>分散はズレを二乗するので大きな外れ値を強調します。絶対偏差は $|x_i-c|$ を使い、外れ値への増え方が線形です。中央値からの絶対偏差の中央値MADはさらに頑健です。</p>","open":false},"1.5.4":{"title":"変動係数＝平均に対する相対的な散らばり","html":"<p>標準偏差 $s$ は絶対的なばらつき、変動係数</p>\n<p>$$CV=\\frac{s}{\\bar x}$$</p>\n<p>は平均値の大きさに対して標準偏差が何割かを表します。</p>\n<p>例えば $(\\bar x,s)=(100,5)$ なら5%、$(1000,20)$なら2%。後者は標準偏差自体は大きいですが、平均に対する相対変動は小さいと読めます。</p>\n<p>$s$ と $\\bar x$ は同じ単位なのでCVは無次元です。ただし平均が0付近では不安定で、摂氏温度のように0が恣意的な尺度には向きません。</p>","open":true},"1.6":{"title":"中心と幅だけでは分布の形は決まらない","html":"<p>平均と分散が同じでも、左右対称か、片側に尾が長いか、極端値が出やすいかは違います。そこで高次モーメントや箱ひげ図を使います。</p>","open":false},"1.6.1":{"title":"モーメントを構造力学との対応から理解する","html":"<p><b>モーメントは『基準からの距離を何乗して重み付き平均するか』です。</b> 構造力学の $\\int y\\,dA$、$\\int y^2\\,dA$ と同じ発想で、統計では面積の代わりに確率を重みとして使います。</p>\n<p>原点まわりの $k$ 次モーメントは $E[X^k]$、平均まわりの $k$ 次中心モーメントは $E[(X-\\mu)^k]$ です。</p>\n<p><b>1次：</b> $E[X-\\mu]=0$。正負の偏差が打ち消し合います。</p>\n<p><b>2次：</b> $E[(X-\\mu)^2]=\\sigma^2$。二乗で符号を消し、散らばりを測ります。</p>\n<p><b>3次：</b> $E[(X-\\mu)^3]$。奇数乗なので符号が残り、右尾・左尾の非対称を捉えます。標準化した</p>\n<p>$$\\gamma_1=\\frac{E[(X-\\mu)^3]}{\\sigma^3}$$</p>\n<p>が歪度です。</p>\n<p><b>4次：</b> $E[(X-\\mu)^4]$。遠い値を非常に強く増幅します。標準化した $E[(X-\\mu)^4]/\\sigma^4$ は尖度に関係し、正規分布では3です。</p>\n<p>$X$ が cm なら $k$ 次中心モーメントは cm$^k$。歪度・尖度は $\\sigma^k$ で割るため無次元になります。</p>","open":true},"1.6.2":{"title":"箱ひげ図の外れ値は『異常』と同義ではない","html":"<p>$1.5IQR$ルールは外れた点を目立たせる機械的な規則です。測定ミスなのか、別集団なのか、正しい極端値なのかはデータ生成過程を確認して判断します。</p>","open":false},"1.7":{"title":"2変数では『一緒に動くか』を測る","html":"<p>分散は1変数の散らばり、共分散は2変数が同じ方向へ動く傾向です。この発想を多数の変数へ拡張したものが共分散行列です。</p>","open":false},"1.7.2":{"title":"Anscombeの四つ組：要約値だけでは形が見えない","html":"<p>平均・分散・相関・回帰直線がほぼ同じでも、散布図は全く違うデータが作れます。相関や回帰を使う前に図を見る理由です。</p>","open":false},"1.7.3":{"title":"順位相関は値より順序を見る","html":"<p>Spearman相関は値を順位へ変えてから相関を取るため、単調だが非線形な関係を拾いやすく、外れ値にも比較的頑健です。その代わり値同士の距離情報は捨てます。</p>","open":false},"1.7.4":{"title":"分割表はカテゴリ変数版の関係を見る道具","html":"<p>カテゴリ同士では各組合せの件数を表にし、独立ならどの程度の件数になるはずかという期待度数と比較します。第4章の $\\chi^2$ 検定へつながります。</p>","open":false},"2.1":{"title":"確率論は『標本を取り直した世界』を記述する","html":"<p>第1章の $x_i$ は観測済みの固定値でした。第2章の $X_i$ は観測前の確率変数です。期待値・分散・分布は今回の値ではなく、起こり得る全体を対象にします。</p>","open":true},"2.2":{"title":"確率空間は結果・事象・確率の3点セット","html":"<p>厳密には $(\\Omega,\\mathcal F,P)$。$\\Omega$が結果全体、$\\mathcal F$が確率を割り当てる事象集合、$P$が確率規則です。有限例では $\\mathcal F$ を意識しなくても困りにくいですが、連続空間では必要です。</p>","open":false},"2.5":{"title":"期待値・分散は確率分布を数値へ圧縮する","html":"<p>期待値は位置、分散は幅、高次モーメントは形を要約します。第1章の標本平均・標本分散がデータ側の要約だったのに対し、ここは確率分布側の理論量です。</p>","open":false},"2.6":{"title":"分布名は生成メカニズムとして覚える","html":"<p>二項分布は固定回数の成功数、Poissonは一定率のイベント数、指数分布は待ち時間、正規分布は多数の小さな加法効果、というように『何がデータを生むか』と結び付けると理解しやすくなります。</p>","open":false},"2.8.2":{"title":"デルタ法は非線形関数を局所的に直線化する","html":"<p>$$g(\\hat\\theta)\\approx g(\\theta)+g'(\\theta)(\\hat\\theta-\\theta)$$</p>\n<p>とTaylor一次展開し、$\\hat\\theta$ の近似正規性を $g(\\hat\\theta)$ へ移します。非線形でも真値近傍では直線として扱う発想です。</p>","open":false},"2.10":{"title":"大数の法則は個々の観測ではなく平均が近づく","html":"<p>$X_i$ 自体が $\\mu$ へ近づくわけではありません。近づくのは $\\bar X_n=(1/n)\\sum_iX_i$ です。標本平均を母平均推定に使える基礎です。</p>","open":true},"2.11":{"title":"中心極限定理は平均の誤差の形を与える","html":"<p>大数の法則は『どこへ行くか』、中心極限定理は『どんな形で揺れるか』を教えます。標準化した標本平均</p>\n<p>$$\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}$$</p>\n<p>が正規分布へ近づくため、標準誤差・信頼区間・検定が作れます。</p>","open":true},"3.1":{"title":"推定は未知の固定値をランダムな標本から当てる","html":"<p>頻度論では母数 $\\theta$ は未知でも固定。ランダムなのは標本と推定量 $\\hat\\theta$ です。推定量の性能を反復標本で評価します。</p>","open":true},"3.8":{"title":"区間推定は不確実性ごと報告する","html":"<p>点推定だけでは標本数やばらつきが見えません。信頼区間は推定量の標本分布を使い、同じ手続きを反復したときの被覆率を表します。</p>","open":false},"4.1":{"title":"検定は仮説世界でデータの珍しさを見る","html":"<p>$H_0$を一旦正しいと仮定し、その世界で観測値以上に極端な結果がどれくらい起こるかを測ります。『棄却できない』は『真と証明した』ではありません。</p>","open":true},"5.1":{"title":"回帰は条件付き平均をモデル化する","html":"<p>回帰の中心は $E[Y\\mid X]$。説明変数が与えられたときの平均構造と、個々の観測のズレ $\\varepsilon$ を分けて考えます。</p>","open":true},"6.1":{"title":"ANOVAは平均差を分散の比で見る","html":"<p>群平均が同じなら群間ばらつきは群内ノイズと同程度。平均差があれば群間ばらつきが相対的に大きくなるため、その比をF統計量にします。</p>","open":true},"7.1":{"title":"多変量解析は多数の変数の幾何","html":"<p>1変量の平均が平均ベクトル、分散が共分散行列へ拡張されます。距離・方向・射影として式を見ると理解しやすくなります。</p>","open":true},"8.1":{"title":"ベイズは未知量にも確率分布を持たせて更新する","html":"<p>事前分布 $p(\\theta)$ を尤度 $p(y\\mid\\theta)$ で重み付けし、事後分布 $p(\\theta\\mid y)$ へ更新します。頻度論と『何に確率を付けるか』が違います。</p>","open":true},"9.1":{"title":"時系列では順番そのものが情報","html":"<p>時系列では昨日と今日の近さが構造なので、観測順序を入れ替えられません。独立性を捨て、時間依存を自己相関やARモデルで表します。</p>","open":true},"10.1":{"title":"寿命・信頼性・極値は分布の尾を扱う","html":"<p>平均付近ではなく、故障までの時間・破壊確率・最大荷重など稀で重要な領域を扱います。打ち切りや尾部仮定が結果へ強く効きます。</p>","open":true},"11.1":{"title":"因果推論は介入したらどうなるかを知りたい","html":"<p>相関は一緒に動くこと、因果効果は実際に処置を変えたときの結果差です。観測データから因果を言うには識別仮定が必要です。</p>","open":true},"12.1":{"title":"機械学習は未知データで当たるかを中心に置く","html":"<p>訓練データへの適合ではなく、未見データへの汎化性能を評価します。過学習・正則化・交差検証はこの目的のための道具です。</p>","open":true},"13.1":{"title":"計算統計は確率論をアルゴリズムへ変える","html":"<p>解析解が難しい期待値・積分・尤度を乱数と反復計算で近似します。大数の法則やCLTが数値誤差評価へそのまま使われます。</p>","open":true},"14.1":{"title":"実データでは分析前にデータ生成過程を疑う","html":"<p>単位・欠測・外れ値・測定条件・時点・打ち切り・重複を確認してからモデルを当てます。きれいな推定値でも入力が壊れていれば意味がありません。</p>","open":true}};
Object.assign(NOTES,V1_NOTES);
const CH_GUIDE={"0":"<p>序章では記号と学習地図を作ります。式より先に『何を表す記号か』を確認してください。</p>","1":"<p>第1章は観測済みデータの要約です。中心・散らばり・形のどれを測るか、単位がどうなるかを確認します。</p>","2":"<p>第2章は観測前の確率変数です。何がランダムで、期待値を取った後に何が固定値になるかを区別します。</p>","3":"<p>第3章は未知だが固定された母数をランダムな推定量で当てます。母数・推定量・推定値を混ぜないことが重要です。</p>","4":"<p>第4章は帰無仮説下の標本分布から判断します。p値の条件の向きと第I/II種過誤を確認します。</p>","5":"<p>第5章は条件付き平均と誤差を分けます。係数推定と標準誤差、適合と予測を分けます。</p>","6":"<p>第6章は全体のばらつきを要因別に分解します。どの平方和が信号で、どれがノイズかを見ます。</p>","7":"<p>第7章はベクトル・行列で多数の平均・分散・共分散をまとめます。高次元の幾何として読むと理解しやすいです。</p>","8":"<p>第8章は事前・尤度・事後のどれを見ているかを必ず区別します。</p>","9":"<p>第9章は時間依存を扱います。時点とラグ、定常と非定常を区別します。</p>","10":"<p>第10章は寿命・尾・破壊を扱います。打ち切りと尾部仮定を意識します。</p>","11":"<p>第11章は因果効果を識別するための仮定が主役です。調整すべき変数と調整してはいけない変数を区別します。</p>","12":"<p>第12章は未知データへの汎化が目的です。訓練誤差と検証誤差を分けます。</p>","13":"<p>第13章は確率論を計算へ変えます。近似値だけでなくMonte Carlo誤差と再現性も結果の一部です。</p>","14":"<p>第14章は実データ生成過程を疑います。モデルより先にデータ品質と観測条件を確認します。</p>","15":"<p>付録は用語確認用です。単語だけでなく本文の定義・式・使用場面へ戻る索引として使います。</p>"};
const KEY_HELP=[[["自由度"],"<p><b>自由度：</b>独立に動かせる情報の個数です。推定した制約・パラメータ分だけ典型的に減ります。</p>"],[["標準誤差"],"<p><b>標準誤差：</b>データの標準偏差ではなく、推定量を標本抽出ごとに計算したときの標準偏差です。</p>"],[["尤度"],"<p><b>尤度：</b>観測データを固定し、母数を動かして相対的な適合度を見る関数です。</p>"],[["信頼区間"],"<p><b>信頼区間：</b>真値がランダムなのではなく、反復標本で作る区間の被覆率を保証する頻度論的手続きです。</p>"],[["相関"],"<p><b>相関：</b>関連の尺度であり、因果を自動的には意味しません。</p>"],[["正規"],"<p><b>正規分布：</b>『データは何でも正規』ではありません。CLTで正規へ近づくのは標準化した平均誤差です。</p>"],[["最尤"],"<p><b>最尤：</b>尤度最大化が目的であり、不偏性を直接最適化しているわけではありません。</p>"],[["分散"],"<p><b>次元：</b>元の量が単位 $u$ なら分散は $u^2$、標準偏差は $u$ です。</p>"],[["回帰"],"<p><b>回帰：</b>通常は個々の値そのものではなく $E[Y\\mid X]$ という条件付き平均をモデル化します。</p>"],[["検出力"],"<p><b>検出力：</b>本当に効果があるときに検定がそれを見つける確率 $1-\\beta$ です。</p>"],[["交互作用"],"<p><b>交互作用：</b>一方の要因の効果が、もう一方の水準で変わることです。</p>"],[["打ち切り"],"<p><b>打ち切り：</b>値が無いのではなく、境界以上/以下までしか分からないという情報です。</p>"],[["標準化"],"<p><b>標準化：</b>中心を引いて尺度で割り、平均から何標準偏差離れているかという無次元量へ変えます。</p>"],[["極値","再現期間"],"<p><b>極値：</b>分布の中心ではなく尾を推定します。少数の極端値と外挿仮定へ強く依存します。</p>"],[["MCMC"],"<p><b>MCMC：</b>標本は独立ではないため、反復回数だけでなく収束・自己相関・実効標本サイズを見ます。</p>"],[["欠測"],"<p><b>欠測：</b>なぜ欠けたかというMCAR/MAR/MNAR仮定が解析法の妥当性を決めます。</p>"],[["交差検証"],"<p><b>交差検証：</b>前処理も学習fold内だけでfitしないと情報リークになります。</p>"]];
const V2A={"2.2.3":{"title":"確率の解釈：計算規則と意味付けを分ける","html":"<p>Kolmogorovの公理は確率の計算規則を与えますが、「確率を何と解釈するか」は別の層です。頻度論では長期頻度、ベイズでは知識の不確実性として読む場面があります。</p>\n<p>数学的な $P(A)$ の操作は同じでも、「未知母数に確率を付けるか」は枠組みで異なります。第8章でこの違いが重要になります。</p>","open":false},"2.6.1":{"title":"分布一覧は4点セットで読む","html":"<p>各分布について、①取り得る値の範囲、②パラメータの意味、③平均・分散、④どんな生成メカニズムから出るか、をセットで確認します。</p>\n<p>特にGamma分布などはrate/scaleのパラメータ化で式が変わるので、記号だけ暗記せず定義を確認してください。</p>","open":false},"2.6.2":{"title":"離散分布は『数える量』をモデル化する","html":"<p>Bernoulliは1回の0/1、二項は固定回数中の成功数、幾何は最初の成功までの回数、Poissonは一定区間のイベント数です。</p>\n<p>値が $0,1,2,\\ldots$ のように飛び飛びなら、確率質量関数 $P(X=x)$ を使います。</p>","open":false},"2.6.3":{"title":"連続分布は一点ではなく区間に確率を持つ","html":"<p>連続型では $P(X=x)=0$ で、区間確率を</p>\n<p>$$P(a<X<b)=\\int_a^b f(x)\\,dx$$</p>\n<p>として密度の面積で計算します。密度 $f(x)$ 自体は確率ではないため、1を超えることもあります。</p>","open":false},"2.6.4":{"title":"分布間の関係を知るとt・χ²・Fが突然見えなくなる","html":"<p>標準正規変数の平方和から $\\chi^2$ 分布、標準正規を独立な $\\chi^2$ 由来の尺度で割ると $t$ 分布、独立な $\\chi^2$ を自由度で割った比から $F$ 分布が出ます。</p>\n<p>第3〜6章でこれらが使われるのは、平均や分散の標本分布がこの構造を持つからです。</p>","open":false},"2.7":{"title":"多変量分布は『組として起こる確率』を持つ","html":"<p>$X$と$Y$を別々の周辺分布だけで見ると、両者が一緒にどう動くかという情報が失われます。同時分布 $f_{X,Y}(x,y)$ が組合せ全体の情報を持ちます。</p>\n<p>周辺化は一方を積分・和で消す操作、条件付けは一方の値を知った後の世界へ絞る操作です。</p>","open":false},"2.7.4":{"title":"多変量正規分布は楕円の向きと幅を共分散行列が決める","html":"<p>1変量正規が $\\mu,\\sigma^2$ で決まるのに対し、多変量正規は平均ベクトル $\\boldsymbol\\mu$ と共分散行列 $\\Sigma$ で決まります。</p>\n<p>等密度面は楕円体で、$\\Sigma$ の固有ベクトルが主軸方向、固有値が各方向の分散を決めます。PCAの幾何と直結します。</p>","open":false},"2.8":{"title":"変数変換は確率を保存して座標を変える","html":"<p>$Y=g(X)$ へ変換しても、同じ事象の確率は変わりません。ただし座標の幅が伸び縮みするので、密度はその補正を受けます。</p>\n<p>1変数なら $f_Y(y)=f_X(x)|dx/dy|$。ヤコビアンは『座標変換による体積変化』の補正です。</p>","open":false},"2.11.2":{"title":"CLTの証明は特性関数で『和を積にする』","html":"<p>独立な確率変数の和の特性関数は各特性関数の積になります。標準化した和について各特性関数を0近傍でTaylor展開し、$n\\to\\infty$ の極限を取ると $e^{-t^2/2}$ が現れます。</p>\n<p>これは標準正規分布の特性関数なので、分布収束が示されます。細部より『和→積→Taylor→正規の特性関数』という骨格を掴んでください。</p>","open":false},"2.11.3":{"title":"Berry–EsseenはCLTの有限nでの誤差を評価する","html":"<p>CLTは極限で正規になると述べるだけで、$n=30$なら必ず十分とは言いません。Berry–Esseenは3次絶対モーメント等の条件の下、CDFの近似誤差を概ね $C/\\sqrt n$ で抑えます。</p>\n<p>元分布が強く歪む・重い尾を持つほど、同じ$n$でも正規近似が遅くなり得ます。</p>","open":false},"2.12":{"title":"極値の漸近は平均のCLTとは別の世界","html":"<p>平均は多数の寄与の和なのでCLTが自然ですが、最大値は最も極端な1点だけで決まります。そのため極限分布は正規ではなくGEV族になります。</p>\n<p>最大風速・洪水・最大応答など、設計の尾部問題ではこちらの理論が重要です。</p>","open":false},"2.12.1":{"title":"最大値の分布はCDFをn乗すれば出る","html":"<p>独立同分布 $X_1,\\ldots,X_n$ の最大値 $M_n=\\max X_i$ について</p>\n<p>$$P(M_n\\le x)=P(X_1\\le x,\\ldots,X_n\\le x)=F(x)^n.$$</p>\n<p>最大値のCDFが簡単に書けるのは、全てが$x$以下である事象へ言い換えられるからです。</p>","open":false},"2.12.2":{"title":"Fisher–Tippett–Gnedenkoは最大値のCLTに相当する","html":"<p>適切な位置・尺度で正規化した最大値が非退化な極限を持つなら、その極限はGumbel・Fréchet・Weibull型を含むGEV族に限られる、という定理です。</p>\n<p>母分布全体の形ではなく、尾の性質がどの極値型へ入るかを決めます。</p>","open":false},"2.12.3":{"title":"CLTと極値理論の違いを意識する","html":"<p>CLTは『平均』の中心付近、極値理論は『最大・最小』の尾部を扱います。同じデータでも目的量が違えば使う漸近理論が違います。</p>","open":false},"2.13.1":{"title":"年最大値とGumbel：毎年の最大だけを並べる","html":"<p>年ごとの最大荷重・風速を1点ずつ取り、その最大値系列へ極値分布を当てるのがblock maximaの考えです。GumbelはGEVの形状母数0に対応します。</p>","open":false},"2.13.2":{"title":"材料強度に対数正規を使う理由を物理と支持範囲で考える","html":"<p>強度のように正値で、複数の倍率的要因が積み重なる量では対数を取ると加法構造になり、対数正規が自然なモデルになることがあります。</p>\n<p>ただし『正値だから必ず対数正規』ではなく、データと生成機構の確認が必要です。</p>","open":false},"2.13.3":{"title":"信頼性指標βは破壊確率を標準正規尺度へ写す","html":"<p>標準正規CDFを $\\Phi$ とすると典型的に</p>\n<p>$$P_f=\\Phi(-\\beta),\\qquad \\beta=-\\Phi^{-1}(P_f).$$</p>\n<p>$\\beta$ が大きいほど破壊確率が小さい尺度になります。FORMでは標準正規空間で限界状態面までの最短距離として現れます。</p>","open":false},"2.17.1":{"title":"『同様に確からしい』が成り立つときだけ場合の数で割る","html":"<p>$P(A)=|A|/|\\Omega|$ は全ての基本結果が等確率のときだけ使えます。サイコロでも偏ったサイコロなら場合の数だけでは確率は決まりません。</p>","open":false},"2.17.2":{"title":"乗法原理は段階ごとの選択肢を掛ける","html":"<p>第1段階に $a$ 通り、第2段階に各場合 $b$ 通りなら全体は $ab$ 通り。独立確率を掛ける話とは似ていますが、ここではまず『場合の数』を数えています。</p>","open":false},"2.17.3":{"title":"標本抽出は順序×復元の2軸で4種類","html":"<p>順序を区別する/しない、同じ対象を再び選べる/選べない、の2軸で公式が変わります。組合せ公式を選ぶ前にこの2点を言葉で確認します。</p>","open":false},"2.17.4":{"title":"二項係数は順序を捨てた分だけ割る","html":"<p>$n$個から$r$個を順序なしで選ぶとき、順序ありの $n(n-1)\\cdots(n-r+1)$ では同じ集合を $r!$ 回数えているので</p>\n<p>$$\\binom nr=\\frac{n!}{r!(n-r)!}$$</p>\n<p>となります。</p>","open":false},"2.18.1":{"title":"Bayesのオッズ形式は『事前オッズ×尤度比』","html":"<p>$$\\frac{P(A\\mid B)}{P(A^c\\mid B)}\n=\\frac{P(A)}{P(A^c)}\n\\times\n\\frac{P(B\\mid A)}{P(B\\mid A^c)}.$$</p>\n<p>左が事後オッズ、最初が事前オッズ、最後が尤度比です。証拠が事前の信念を何倍にするか、と読めます。</p>","open":false},"2.18.2":{"title":"検察官の誤謬は条件の向きを逆にする誤り","html":"<p>$P(証拠\\mid 無罪)$ が小さいことと、$P(無罪\\mid 証拠)$ が小さいことは同じではありません。後者には有罪/無罪の事前確率も必要です。</p>","open":false},"2.18.3":{"title":"条件付き独立は『Zを知ればXとYの残りの関係が消える』","html":"<p>$X\\perp Y\\mid Z$ は、$Z$を固定した各世界で $X$ と $Y$ が独立という意味です。無条件では関連していても条件付き独立になることがあります。</p>","open":false},"2.18.4":{"title":"Monty Hallは司会者の行動が情報を持つ","html":"<p>司会者は必ずハズレ扉を知っていて開けるため、開いた扉はランダムな除外ではありません。最初の選択が当たりの確率1/3は変わらず、残りの未選択扉へ2/3が集まります。</p>","open":false},"3.5.4":{"title":"MLEの不変性と不偏性は別物","html":"<p>$\\hat\\theta$ が $\\theta$ のMLEなら、通常 $g(\\theta)$ のMLEは $g(\\hat\\theta)$ です。これは最尤点の変換に関する性質です。</p>\n<p>しかし $E[g(\\hat\\theta)]=g(E[\\hat\\theta])$ は一般に成り立たないので、不変性から不偏性は出ません。</p>","open":false},"3.8.4":{"title":"二項比率の区間は小標本でWaldが崩れやすい","html":"<p>Wald区間は $\\hat p\\pm z\\sqrt{\\hat p(1-\\hat p)/n}$ と簡単ですが、$p$が0/1近傍または$n$が小さいと被覆率が悪くなります。</p>\n<p>Wilsonは検定統計量を$p$について解き、Clopper–Pearsonは二項分布を直接反転します。</p>","open":false},"3.8.5":{"title":"デルタ法による区間は変換後のSEを一次近似する","html":"<p>$$V(g(\\hat\\theta))\\approx [g'(\\theta)]^2V(\\hat\\theta)$$</p>\n<p>として変換後の標準誤差を求め、近似正規区間を作ります。標本が小さい、非線形が強い場合は近似誤差が大きくなり得ます。</p>","open":false},"3.9.2":{"title":"ブートストラップ区間は何を補正するかで違う","html":"<p>Percentileは再標本推定値の分位点をそのまま使い、Basicは元推定値の周りに反転し、BCaはバイアスと歪みを補正します。同じ再標本化でも区間の構成法は別です。</p>","open":false},"3.9.3":{"title":"ブートストラップは万能ではない","html":"<p>元標本が母集団を十分代表していることが前提です。極端な小標本、境界パラメータ、最大値、強い依存などでは単純なi.i.d.ブートストラップが不適切なことがあります。</p>","open":false},"3.11":{"title":"材料強度の特性値は平均より下側リスクを狙う","html":"<p>平均強度が高くても下側の弱い個体が問題になります。そこで母集団の低い分位点や、その推定不確実性を考慮した下側限界を使います。</p>\n<p>『母集団5%分位点』と『その分位点を高い信頼度で保証する値』は別物です。</p>","open":false},"3.15.1":{"title":"Wald区間はCLTを素朴に反転した区間","html":"<p>二項比率で $\\hat p\\approx N(p,p(1-p)/n)$ とし、未知の$p$を標準誤差中でも$\\hat p$へ置換して得るのがWald区間です。この二重近似が境界付近で弱くなります。</p>","open":false},"3.15.3":{"title":"Waldの2つの病気：離散性とSE置換","html":"<p>二項データは離散なので名目95%被覆を連続的に調整できません。さらに真の標準誤差 $\\sqrt{p(1-p)/n}$ を不安定な $\\hat p$ で置き換えます。特に成功0件/全件でSEが0になるのが典型的破綻です。</p>","open":false},"3.15.4":{"title":"Wilson区間は帰無仮説側のpをSEに残して反転する","html":"<p>Score検定</p>\n<p>$$\\frac{\\hat p-p}{\\sqrt{p(1-p)/n}}$$</p>\n<p>の不等式を未知$p$について解くため、Waldのように分母まで$\\hat p$へ置き換えません。境界付近でも挙動が改善します。</p>","open":false},"3.15.6":{"title":"3の法則：0件観測はリスク0の証明ではない","html":"<p>失敗0件を$n$回観測したとき、95%上限の粗い近似として $3/n$ が使われます。0件という観測は『真の失敗確率が0』ではなく、『小さい確率と両立する』という情報です。</p>","open":false},"4.2.3":{"title":"検定統計量は帰無仮説からの距離を1数値にする","html":"<p>元データを、$H_0$の下で分布が分かる統計量$T$へ圧縮します。片側検定は事前に方向を限定し、両側検定は両方向の極端さを数えるため棄却域が2つに分かれます。</p>","open":false},"4.2.4":{"title":"Neyman–Pearson補題は単純仮説間の最強検定","html":"<p>$H_0:\\theta=\\theta_0$ と $H_1:\\theta=\\theta_1$ のような単純仮説では、尤度比 $L(\\theta_1)/L(\\theta_0)$ が大きいとき棄却する検定が、同じ有意水準の中で最も検出力が高いと述べます。</p>","open":false},"4.2.5":{"title":"LR・Wald・Scoreは同じ尤度山を別の場所から測る","html":"<p>尤度比は制約あり/なしの最大値差、Waldは推定値と帰無値の距離、Scoreは帰無値での傾きを使います。大標本では同等になりますが有限標本では違いが出ます。</p>","open":false},"4.3":{"title":"p値は効果量でもH0の確率でもない","html":"<p>p値は $P(観測値以上に極端\\mid H_0)$。効果の大きさや $P(H_0\\mid data)$ ではありません。標本が巨大なら微小な効果でもp値は小さくなり得ます。</p>","open":false},"4.3.2":{"title":"0.05は真偽の境界ではない","html":"<p>$p=0.049$ と $p=0.051$ に科学的な断絶はありません。有意/非有意の二値化だけでなく、効果量・信頼区間・研究設計・多重性を合わせて判断します。</p>","open":false},"4.3.3":{"title":"検定と信頼区間は同じ標本分布の双対","html":"<p>95%信頼区間に帰無値 $\\theta_0$ が含まれないことは、対応する5%両側検定で $H_0:\\theta=\\theta_0$ を棄却することと対応します。</p>","open":false},"4.4":{"title":"z検定とt検定の差は母分散を知っているか","html":"<p>母標準偏差$\\sigma$既知ならz統計量、未知で標本標準偏差$S$へ置き換えるなら追加の不確実性を反映するt分布を使います。</p>","open":false},"4.4.2":{"title":"対応あり二標本は『差を1標本にする』","html":"<p>同じ対象の前後測定なら各ペア差 $D_i=X_i-Y_i$ を作り、$D_i$ の平均が0かを一標本t検定します。ペア内相関を利用できるため独立二標本より効率が上がることがあります。</p>","open":false},"4.4.3":{"title":"Welch t検定は等分散を仮定しない","html":"<p>2群の分散が異なっても</p>\n<p>$$\\frac{\\bar X_1-\\bar X_2}{\\sqrt{S_1^2/n_1+S_2^2/n_2}}$$</p>\n<p>を使い、自由度をWelch–Satterthwaite近似します。等分散が確実でない実務では標準的な選択です。</p>","open":false},"4.5":{"title":"分散検定でχ²・Fが現れる理由","html":"<p>正規母集団では $(n-1)S^2/\\sigma^2\\sim\\chi^2_{n-1}$。2つの独立な分散推定量の比はF分布になります。分散検定が正規性に敏感なのはこの厳密分布が正規仮定に依存するためです。</p>","open":false},"4.6":{"title":"比率検定は二項データの標本比率を標準化する","html":"<p>$H_0:p=p_0$ の下で $\\hat p$ の平均は$p_0$、分散は $p_0(1-p_0)/n$。大標本ではCLTによりz統計量を作れます。小標本では正確二項検定を検討します。</p>","open":false},"4.7":{"title":"χ²検定は観測度数と期待度数のずれを測る","html":"<p>$$X^2=\\sum\\frac{(O-E)^2}{E}$$</p>\n<p>で、期待度数からの差を期待度数の尺度で規格化して足します。適合度検定も独立性検定も同じ形です。</p>","open":false},"4.7.1":{"title":"適合度検定の自由度は制約の数だけ減る","html":"<p>$k$カテゴリの度数は合計$n$という1制約があるのでまず$k-1$自由度。さらに$r$個の分布パラメータを同じデータから推定すれば、典型的に$k-1-r$へ減ります。</p>","open":false},"4.8":{"title":"正規性検定は『棄却しない＝正規』ではない","html":"<p>小標本では非正規を見抜く力が弱く、大標本では実務上小さなズレでも有意になります。QQプロットや解析目的と合わせて判断します。</p>","open":false},"4.9":{"title":"ノンパラメトリックは仮定ゼロではない","html":"<p>正規分布のような特定形を弱める代わりに、順位・符号・交換可能性・対称性など別の仮定を使います。何を仮定しているかを確認してください。</p>","open":false},"4.9.5":{"title":"並べ替え検定は帰無仮説下の交換可能性を使う","html":"<p>群ラベルを入れ替えても同じ分布になるという帰無仮説の下、ラベルを多数並べ替えた統計量分布を帰無分布として使います。標本分布を直接シミュレーションする発想です。</p>","open":false},"4.11":{"title":"効果量は差の大きさを標本数と分離して見る","html":"<p>p値は標本数で変わりますが、効果量は差の実質的大きさを表します。Cohenの$d$は平均差を標準偏差で割り、無次元化します。</p>","open":false},"4.12":{"title":"多重比較は検定回数を増やすほど偶然の有意が増える","html":"<p>各検定5%でも多数行えば少なくとも1つ偽陽性が出る確率は上がります。Bonferroni/HolmはFWER、BHはFDRという別のエラー指標を制御します。</p>","open":false},"4.13":{"title":"再現性問題は分析の自由度と選択的報告の問題でもある","html":"<p>多数の解析を試して有意なものだけ報告すると、名目p値の意味が崩れます。事前登録・全分析の透明化・効果量と区間報告が対策になります。</p>","open":false},"4.18.4":{"title":"同等性検定は『差がない』を示すための別仮説","html":"<p>通常の検定で非有意でも、差が小さいとは証明できません。TOSTなどの同等性検定では『実務上無視できない差がある』側を帰無に置き、あらかじめ決めた同等性マージン内であることを検証します。</p>","open":false},"4.20":{"title":"BHの直線は順位付きp値と許容FDRを対応させる","html":"<p>p値を $p_{(1)}\\le\\cdots\\le p_{(m)}$ と並べ、$p_{(i)}\\le iq/m$ を満たす最大$i$まで棄却します。大きな順位ほど許容閾値が緩くなり、棄却集合全体でFDRを制御します。</p>","open":false},"4.22":{"title":"e値は帰無仮説下で期待値1以下の証拠尺度","html":"<p>非負量$E$が $E_0[E]\\le1$ を満たすときe値と呼び、大きいほど$H_0$に反する証拠です。p値とは違う代数を持ち、任意依存や逐次解析で扱いやすい場合があります。</p>","open":false},"5.2.1":{"title":"線形回帰モデルは平均構造と誤差の分離","html":"<p>$Y_i=\\beta_0+\\beta_1x_i+\\varepsilon_i$。$\\beta_0+\\beta_1x_i$が条件付き平均、$\\varepsilon_i$が個々のズレです。$E[\\varepsilon_i\\mid X]=0$ が平均構造を正しく置いたという条件です。</p>","open":false},"5.2.2":{"title":"最小二乗解はRSSを微分して得る","html":"<p>$$RSS=\\sum_i(y_i-\\beta_0-\\beta_1x_i)^2$$</p>\n<p>を$\\beta_0,\\beta_1$で偏微分して0と置くと</p>\n<p>$$\\hat\\beta_1=\\frac{\\sum(x_i-\\bar x)(y_i-\\bar y)}{\\sum(x_i-\\bar x)^2},\\quad\n\\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x.$$</p>\n<p>傾きが共分散/分散に似るのは、Yとの一緒の動きをXの散らばりで規格化しているからです。</p>","open":false},"5.2.3":{"title":"残差の直交性は仮定ではなくOLS解の性質","html":"<p>切片を含むOLSでは残差和が0、説明変数と残差の内積も0になります。これは真の誤差$\\varepsilon$の性質を仮定した結果ではなく、RSS最小化の一階条件です。</p>","open":false},"5.2.4":{"title":"R²は標本内で説明した平方和の割合","html":"<p>切片ありなら $TSS=ESS+RSS$、$R^2=1-RSS/TSS$。高い$R^2$は因果性・正しいモデル・外挿性能を保証しません。</p>","open":false},"5.3.1":{"title":"正規方程式は残差が説明変数空間に直交する条件","html":"<p>$$X^T(y-X\\hat\\beta)=0$$</p>\n<p>すなわち $X^TX\\hat\\beta=X^Ty$。残差ベクトルがXの各列に直交する、という幾何学です。</p>","open":false},"5.3.2":{"title":"ハット行列はyを回帰空間へ射影する","html":"<p>$$\\hat y=Hy,\\qquad H=X(X^TX)^{-1}X^T.$$</p>\n<p>$H^2=H$の射影行列です。対角成分$h_{ii}$はレバレッジで、X空間で観測$i$がどれほど特殊な位置かを表します。</p>","open":false},"5.3.3":{"title":"回帰のn−pは標本分散のn−1と同じ構造","html":"<p>$p$個の係数を同じデータから推定すると、残差空間の自由度は$n-p$。したがって誤差分散の不偏推定は</p>\n<p>$$\\hat\\sigma^2=RSS/(n-p).$$</p>","open":false},"5.5":{"title":"回帰係数も標本を取り直せば変わる推定量","html":"<p>$\\hat\\beta$には標本分布があります。その分散を標準誤差として推定し、t検定・F検定・信頼区間を作ります。</p>","open":false},"5.5.4":{"title":"平均応答の区間と新観測の予測区間は幅が違う","html":"<p>平均応答の信頼区間は回帰線の位置の不確実性だけ。新しい個体の予測区間はさらに個体誤差$\\varepsilon$を足すため広くなります。</p>","open":false},"5.7.3":{"title":"影響点は残差だけでなくレバレッジも見る","html":"<p>Y方向に外れていてもXが普通なら回帰線を大きく動かさないことがあります。逆にX空間で遠い高レバレッジ点は線を強く引っ張ります。Cook距離は両者をまとめた影響度です。</p>","open":false},"5.7.4":{"title":"不均一分散は係数よりまず標準誤差を壊す","html":"<p>$E[\\varepsilon\\mid X]=0$が正しければOLS係数は一定条件下で一致しますが、通常のSE公式は $Var(\\varepsilon\\mid X)=\\sigma^2$ を使うため誤ります。頑健SEや分散モデルを検討します。</p>","open":false},"5.8":{"title":"変数選択は当てはまりと複雑さの交換","html":"<p>RSSだけなら変数を増やすほど良くなります。AIC/BICや交差検証は複雑さへのペナルティを通じて過剰適合を抑えます。</p>","open":false},"5.9.2":{"title":"IRLSはGLMを重み付き最小二乗へ反復変換する","html":"<p>GLMの尤度方程式は閉形式で解けないことが多いため、現在値の周りで線形化し、重み付き最小二乗を解く操作を繰り返します。</p>","open":false},"5.9.3":{"title":"ロジスティック回帰は確率をlog-oddsへ写す","html":"<p>$$\\log\\frac{p}{1-p}=X\\beta.$$</p>\n<p>$e^{\\beta_j}$は他の変数一定で説明変数が1増えたときのオッズ倍率です。確率差ではない点に注意します。</p>","open":false},"5.9.4":{"title":"Poisson回帰はカウントの平均をlogで正値に保つ","html":"<p>$$\\log\\mu=X\\beta$$</p>\n<p>なので $e^{\\beta_j}$ は期待カウントの倍率です。分散が平均より大きい過分散ではPoisson仮定が不足する場合があります。</p>","open":false},"5.10":{"title":"混合効果モデルは群内相関を階層で表す","html":"<p>同じロット・建物・個人内の観測は共通要因を持ち独立でないことがあります。群ごとのランダム切片・傾きを導入して、その相関と群間ばらつきを表します。</p>","open":false},"5.11.1":{"title":"『線形モデル』はXに直線という意味だけではない","html":"<p>$Y=\\beta_0+\\beta_1X+\\beta_2X^2+\\varepsilon$ はXには曲線ですが、係数$\\beta$には線形なので線形回帰として扱えます。非線形回帰はパラメータ自体が非線形に入るモデルです。</p>","open":false},"5.15":{"title":"頑健標準誤差は係数ではなくSE計算を直す","html":"<p>不均一分散でも平均モデルが正しければOLS係数は使える場合があります。サンドイッチ分散は誤差分散の形を特定せずSEを頑健化します。ただし平均モデルの誤指定は直しません。</p>","open":false},"5.17":{"title":"クラスター相関は見かけの標本数を水増しする","html":"<p>同じ群の観測が似ると独立観測$n$個ほどの情報はありません。通常SEは過小評価されがちで、クラスターロバストSEや階層モデルが必要になります。</p>","open":false}};

const V2B={"6.2.1":{"title":"一元配置ANOVAのモデルは全体平均＋群効果＋誤差","html":"<p>典型的には</p>\n<p>$$Y_{ij}=\\mu+\\alpha_i+\\varepsilon_{ij}.$$</p>\n<p>$\\mu$が全体平均、$\\alpha_i$が群$i$特有の平均差、$\\varepsilon_{ij}$が同じ群内の個体差です。</p>\n<p>$\\mu$と$\\alpha_i$はそのままだと一意に決まらないので、$\\sum_i\\alpha_i=0$ などの制約を置きます。</p>","open":false},"6.2.2":{"title":"平方和分解は偏差を二つの成分へ分ける","html":"<p>$$Y_{ij}-\\bar Y=(\\bar Y_i-\\bar Y)+(Y_{ij}-\\bar Y_i).$$</p>\n<p>全平均との差は『群平均が全体平均からずれた分』と『個体が群平均からずれた分』に分かれます。二乗して全観測で足すと交差項が消え、</p>\n<p>$$SS_T=SS_B+SS_W$$</p>\n<p>となります。</p>","open":false},"6.2.3":{"title":"F統計量は信号＋ノイズをノイズだけで割る","html":"<p>帰無仮説の下では群間平均平方$MS_B$も群内平均平方$MS_W$も同じ誤差分散$\\sigma^2$を推定するので、F比は1付近です。</p>\n<p>群平均が本当に違うと$MS_B$だけが大きくなり、</p>\n<p>$$F=MS_B/MS_W$$</p>\n<p>が1より大きくなります。</p>","open":false},"6.2.4":{"title":"ANOVAと回帰は同じ線形モデル","html":"<p>群をダミー変数で表せば、一元配置ANOVAは通常の重回帰と同じです。ANOVAのF検定は『群ダミー係数が同時に0か』という回帰の部分F検定に対応します。</p>","open":false},"6.3":{"title":"多重比較はANOVA後の『どの群が違うか』問題","html":"<p>ANOVAの有意結果は『少なくとも1群は違う』までしか言いません。どの組合せが違うかを多数比較すると偽陽性が増えるため、TukeyやBonferroniなどで多重性を補正します。</p>","open":false},"6.3.3":{"title":"Tukey HSDは全ての群平均ペアを同時に比較する","html":"<p>全ペア比較でFWERを制御するため、単純なt分布ではなくstudentized range分布を使います。群数が増えても『少なくとも1つ偽陽性』の確率を所定水準に抑えます。</p>","open":false},"6.4.1":{"title":"二元配置モデルでは主効果と交互作用を分ける","html":"<p>$$Y_{ijk}=\\mu+\\alpha_i+\\beta_j+(\\alpha\\beta)_{ij}+\\varepsilon_{ijk}.$$</p>\n<p>$\\alpha_i$がAの主効果、$\\beta_j$がBの主効果、$(\\alpha\\beta)_{ij}$が『Aの効果がBで変わる分』です。</p>","open":false},"6.4.2":{"title":"交互作用図では平行性を見る","html":"<p>各水準の平均を線で結び、線が平行なら交互作用は小さい、非平行なら交互作用が疑われます。交差していなくても傾きが違えば交互作用です。</p>","open":false},"6.5.1":{"title":"乱塊法は既知のばらつきをブロックとして引き算する","html":"<p>実験単位に位置・ロット・日などの既知差があるなら、それをブロックとしてモデルへ入れます。処理効果と無関係なばらつきを誤差から除き、検出力を上げます。</p>","open":false},"6.5.2":{"title":"split-plotは無作為化の単位が因子で違う","html":"<p>大きな装置設定のように頻繁に変えにくい因子はwhole-plot、小さく変えやすい因子はsubplotで無作為化します。誤差構造が2階層になるため、通常ANOVAと同じ誤差項を使えません。</p>","open":false},"6.6.1":{"title":"固定効果と変量効果は一般化先が違う","html":"<p>特定の3配合だけを比較するなら固定効果。観測したロットを多数あるロット母集団の一部とみなし、ロット間分散を推定したいなら変量効果です。</p>\n<p>『水準がランダムに選ばれたか』だけでなく、どこまで一般化したいかが本質です。</p>","open":false},"6.6.2":{"title":"期待平均平方はどの分散成分がどのMSへ入るかを見る","html":"<p>変量効果では各平均平方の期待値に、誤差分散と群間分散が係数付きで現れます。その連立関係を利用して分散成分を推定します。</p>","open":false},"6.7":{"title":"実験計画の三原則は解析前に効く","html":"<p>無作為化は交絡を平均化、反復は誤差分散の推定、ブロック化は既知の変動を除去します。後から高度な統計手法を使っても、悪い実験設計を完全には救えません。</p>","open":false},"6.8.1":{"title":"$2^k$計画は各因子2水準の全組合せ","html":"<p>$k$因子を低/高の2水準にすると$2^k$条件。$-1,+1$で符号化すると主効果・交互作用の列が直交し、効果推定が非常に整理しやすくなります。</p>","open":false},"6.8.2":{"title":"効果の有意性判定は誤差分散が必要","html":"<p>反復があれば純粋誤差から標準誤差を作れます。反復なしの$2^k$では高次交互作用を誤差とみなす等の追加仮定が必要になることがあります。</p>","open":false},"6.9.1":{"title":"一部実施計画は実験数を減らす代わりに交絡する","html":"<p>全$2^k$から一部だけ実施すると、ある主効果と交互作用をデータ上区別できなくなります。alias structureを確認し、『高次交互作用は小さい』などの仮定で解釈します。</p>","open":false},"6.9.3":{"title":"田口法のSN比は目的関数の選び方","html":"<p>SN比は平均性能とばらつきを一つの尺度へまとめ、ノイズに頑健な条件を探す考えです。統計的推論の一般理論というより、ロバスト設計の実務的目的関数として位置付けると理解しやすいです。</p>","open":false},"6.10":{"title":"応答曲面法は局所的な曲面を当てて最適条件を探す","html":"<p>一次モデルで勾配方向へ進み、最適付近では二次モデル</p>\n<p>$$y=\\beta_0+\\sum\\beta_ix_i+\\sum\\beta_{ii}x_i^2+\\sum\\beta_{ij}x_ix_j+\\varepsilon$$</p>\n<p>を当てて曲率を表します。実験計画と最適化の橋です。</p>","open":false},"7.2.1":{"title":"平均ベクトルと共分散行列は1変量統計の拡張","html":"<p>$p$変数なら平均は $\\mu=(\\mu_1,\\ldots,\\mu_p)^T$、共分散行列の対角は各分散、非対角は各ペアの共分散です。</p>\n<p>$\\Sigma$は対称で半正定値なので、任意の方向$a$について $a^T\\Sigma a\\ge0$。これは『どの線形結合の分散も負にならない』という意味です。</p>","open":false},"7.2.2":{"title":"Mahalanobis距離は共分散で座標を白色化した距離","html":"<p>$$d_M^2=(x-\\mu)^T\\Sigma^{-1}(x-\\mu).$$</p>\n<p>分散の大きい方向は軽く、分散の小さい方向は重く評価し、相関した方向も補正します。標準化Euclidean距離の多変量版です。</p>","open":false},"7.3":{"title":"多変量正規では線形結合も正規になる","html":"<p>$X\\sim N_p(\\mu,\\Sigma)$なら任意のベクトル$a$に対して $a^TX$ も正規分布です。条件付き分布・周辺分布も正規に保たれるため解析が非常に扱いやすい分布です。</p>","open":false},"7.4.1":{"title":"PCAの固有値問題は分散最大化から出る","html":"<p>方向$a$へ射影した分散は $a^T\\Sigma a$。$a^Ta=1$の制約で最大化するとLagrange条件</p>\n<p>$$\\Sigma a=\\lambda a$$</p>\n<p>が出ます。最大固有値に対応する固有ベクトルが第1主成分方向です。</p>","open":false},"7.4.2":{"title":"寄与率は全分散のうちその主成分が持つ割合","html":"<p>主成分$j$の分散は固有値$\\lambda_j$。したがって寄与率は</p>\n<p>$$\\lambda_j/\\sum_k\\lambda_k.$$</p>\n<p>累積寄与率は何次元まで残すと総変動の何割を保持するかを示します。</p>","open":false},"7.4.3":{"title":"PCA前の標準化は単位の選択そのもの","html":"<p>共分散行列PCAでは単位の大きい変数が支配しやすいです。各変数を標準化して相関行列PCAにすると、1標準偏差を共通単位として扱います。</p>","open":false},"7.4.4":{"title":"SVDとPCAは同じ幾何を別の行列から見る","html":"<p>中心化データ行列 $X=UDV^T$ とSVDすると、$V$の列が主成分方向、$D^2/(n-1)$が共分散行列の固有値に対応します。</p>","open":false},"7.4.5":{"title":"負荷量は元変数と主成分の関係を読む","html":"<p>主成分方向の係数や主成分との相関を負荷量として見ます。大きい絶対値を持つ変数が、その主成分の意味付けへ強く寄与します。</p>\n<p>符号は固有ベクトル全体を反転しても同じ主成分なので、絶対的な向きに意味はありません。</p>","open":false},"7.5.1":{"title":"因子分析は共通因子＋独自誤差の生成モデル","html":"<p>$$X=\\Lambda F+\\varepsilon.$$</p>\n<p>$F$が複数観測変数へ共通に影響し、$\\varepsilon$が各変数固有の部分を表します。観測共分散を潜在因子で説明するモデルです。</p>","open":false},"7.5.2":{"title":"PCAと因子分析は目的が違う","html":"<p>PCAは観測変数の総分散を効率的に圧縮する線形変換。因子分析は共分散の背後に潜在因子があるという生成モデルを置き、共通分散を説明します。</p>","open":false},"7.5.3":{"title":"回転は因子軸の解釈を変えるが再現共分散は保つ","html":"<p>因子モデルには回転の不定性があり、直交回転Varimaxや斜交回転Promax等で『一因子に少数変数が強く載る』単純構造を目指します。</p>","open":false},"7.6.1":{"title":"クラスタリング前に距離を決める","html":"<p>Euclidean、Manhattan、相関距離などで『似ている』の意味が変わります。変数尺度が違うなら標準化しないと大きな単位の変数が距離を支配します。</p>","open":false},"7.6.2":{"title":"階層クラスタリングはクラスタ間距離の定義が結果を変える","html":"<p>single linkageは最短点、completeは最遠点、Ward法は群内平方和増加を基準に結合します。同じ距離行列でもlinkageで樹形図は変わります。</p>","open":false},"7.6.3":{"title":"k-meansは群内平方和を最小化する","html":"<p>各点を最寄り重心へ割当て、重心を再計算する操作を繰り返します。目的関数は群内平方和で、局所最適に依存するため初期値を変えて複数回実行します。</p>","open":false},"7.7.1":{"title":"Fisher判別は群間差を群内ばらつきで割った方向を探す","html":"<p>2群なら射影方向$w$について</p>\n<p>$$J(w)=\\frac{(w^T\\mu_1-w^T\\mu_2)^2}{w^TS_Ww}$$</p>\n<p>を最大化し、群平均を離しつつ群内散らばりを小さくする軸を選びます。</p>","open":false},"7.10":{"title":"次元の呪いは高次元でデータが急速に疎になること","html":"<p>次元が増えると同じ点数でも空間を覆えなくなり、最近傍距離が大きくなります。密度推定・kNN・クラスタリングが不安定になり、変数選択や次元削減が重要になります。</p>","open":false},"8.2.1":{"title":"事前・尤度・事後は役割が違う","html":"<p>事前 $p(\\theta)$ はデータ前の不確実性、尤度 $p(y\\mid\\theta)$ は各$\\theta$の下でデータがどれほど整合するか、事後 $p(\\theta\\mid y)$ はデータ後の不確実性です。</p>","open":false},"8.2.2":{"title":"逐次更新は前回の事後を次回の事前にする","html":"<p>独立データなら、1個ずつ更新しても全データを一度に掛けても同じ事後になります。Bayes更新がオンライン学習に自然な理由です。</p>","open":false},"8.2.3":{"title":"頻度論とBayesでランダムな対象が違う","html":"<p>頻度論では母数は固定、データがランダム。Bayesでは観測後のデータは固定し、母数の不確実性を分布で表します。</p>","open":false},"8.3.1":{"title":"Beta–Binomialは擬似成功・失敗回数として読める","html":"<p>$p\\sim\\mathrm{Beta}(\\alpha,\\beta)$、成功$x$回/試行$n$なら</p>\n<p>$$p\\mid x\\sim\\mathrm{Beta}(\\alpha+x,\\beta+n-x).$$</p>\n<p>$\\alpha,\\beta$が事前の成功/失敗情報に似た形でデータ件数へ加わります。</p>","open":false},"8.3.2":{"title":"Gamma–Poissonはイベント率の更新","html":"<p>$\\lambda\\sim\\mathrm{Gamma}(a,b)$でPoissonカウントを観測すると、総カウントが形状パラメータへ、観測時間がrate側へ加算される形で事後もGammaになります。</p>","open":false},"8.3.3":{"title":"正規–正規では平均が精度加重平均になる","html":"<p>既知分散の正規尤度と正規事前では、事後平均は事前平均と標本平均の重み付き平均になります。重みは分散の逆数＝精度が大きい方ほど強くなります。</p>","open":false},"8.4.1":{"title":"『無情報事前』はパラメータ化で無情報でなくなる","html":"<p>$\\theta$で一様な事前を置いても、$\\phi=g(\\theta)$へ変換すると$\\phi$では一様にならないことがあります。『何も言わない』は座標に依存し得ます。</p>","open":false},"8.4.2":{"title":"Jeffreys事前はFisher情報で変換不変性を得る","html":"<p>$$\\pi_J(\\theta)\\propto\\sqrt{I(\\theta)}.$$</p>\n<p>パラメータ変換に対して自然に変換されるため、単純一様事前より不変性を持ちます。ただし不適切事前になり得る点に注意します。</p>","open":false},"8.4.3":{"title":"弱情報事前はあり得ない値だけを抑える","html":"<p>完全に平坦にするのではなく、物理的・実務的にあり得ない極端値へだけ弱いペナルティを置きます。少データでも推定を安定させつつ、データが十分あれば事後をデータに任せます。</p>","open":false},"8.5.1":{"title":"事後予測チェックはモデルが再現すべき特徴を見る","html":"<p>事後から$\\theta$を引き、そこから複製データ$\\tilde y$を生成し、実データの統計量・図と比較します。p値のような単一指標ではなく、モデルがデータのどの特徴を再現できないかを見る診断です。</p>","open":false},"8.6":{"title":"Bayes点推定は損失関数で決まる","html":"<p>二乗損失なら事後平均、絶対損失なら事後中央値、0-1損失に近い設定ではMAPが自然になります。『Bayes推定値』は1種類ではなく、意思決定の損失で変わります。</p>","open":false},"8.7.1":{"title":"Bayes因子はモデルの周辺尤度比","html":"<p>$$BF_{10}=\\frac{p(y\\mid M_1)}{p(y\\mid M_0)}.$$</p>\n<p>各モデルでパラメータを事前分布について積分した周辺尤度を比べます。事前分布の広さに敏感なのが重要な特徴です。</p>","open":false},"8.7.2":{"title":"WAIC・LOOは予測性能でモデルを比較する","html":"<p>Bayes因子がモデル証拠を比較するのに対し、WAIC/LOOは未観測データの対数予測密度を重視します。『真のモデル選択』より予測を目的にするとき自然です。</p>","open":false},"8.8.1":{"title":"部分プーリングは全部同じと全部別の中間","html":"<p>群ごと完全別推定は小標本群が不安定、全群同一は群差を無視します。階層モデルは群効果を共通分布から生成したと考え、データ量に応じて全体平均へ縮約します。</p>","open":false},"8.9.2":{"title":"MCMCは事後分布から間接的に標本を作る","html":"<p>高次元事後の積分が難しいとき、目標事後分布を定常分布に持つMarkov連鎖を設計します。生成標本は独立でないため、自己相関を考慮した実効標本サイズが重要です。</p>","open":false},"8.9.3":{"title":"収束診断は複数の観点で見る","html":"<p>トレースプロット、$\\hat R$、実効標本サイズ、divergence等を確認します。単に反復数が多いだけでは別モードを探索できていない可能性があります。</p>","open":false},"9.2.1":{"title":"加法モデルと乗法モデルは変動のスケールが違う","html":"<p>加法 $Y=T+S+E$ は季節変動幅が水準と独立、乗法 $Y=T\\times S\\times E$ は水準が大きいほど季節幅も大きいときに自然です。乗法は対数を取ると加法へ変換できます。</p>","open":false},"9.3.1":{"title":"弱定常は平均一定・共分散がラグだけに依存","html":"<p>$$E[X_t]=\\mu,\\qquad Cov(X_t,X_{t-k})=\\gamma(k).$$</p>\n<p>絶対時刻$t$ではなく時間差$k$だけで依存が決まるため、過去で推定した相関構造を未来へ持ち出せます。</p>","open":false},"9.3.2":{"title":"ランダムウォークは分散が時間とともに増える","html":"<p>$$X_t=X_{t-1}+\\varepsilon_t=X_0+\\sum_{s=1}^t\\varepsilon_s.$$</p>\n<p>独立ショックの分散が加算され、$Var(X_t)=t\\sigma^2$。一定分散でないので非定常です。</p>","open":false},"9.3.3":{"title":"単位根検定は『非定常を帰無』に置く","html":"<p>ADFではランダムウォーク型の単位根ありを帰無仮説に置きます。非有意だから定常と結論するのではなく、単位根を棄却できなかっただけです。</p>","open":false},"9.4.1":{"title":"自己相関は同じ系列を時間だけずらして相関する","html":"<p>$$\\rho(k)=Corr(X_t,X_{t-k}).$$</p>\n<p>定常なら$t$に依存せずラグ$k$だけで決まります。周期性・持続性・モデル次数の手掛かりになります。</p>","open":false},"9.4.3":{"title":"標本ACFの帯は『白色雑音ならこの程度は偶然出る』","html":"<p>大標本の白色雑音では各ラグACFが概ね標準誤差$1/\\sqrt n$を持つため、$\\pm1.96/\\sqrt n$帯が目安になります。多数ラグを見る多重性や時系列依存では単純解釈に注意します。</p>","open":false},"9.4.4":{"title":"PACFは中間ラグの影響を取り除いた相関","html":"<p>ラグ$k$のPACFは $X_t$ と $X_{t-k}$ の関係から $1,\\ldots,k-1$ラグの線形影響を除いた残りの相関です。AR次数同定に使われます。</p>","open":false},"9.5.1":{"title":"MA(q)は過去q期のショックの線形結合","html":"<p>$$X_t=\\mu+\\varepsilon_t+\\theta_1\\varepsilon_{t-1}+\\cdots+\\theta_q\\varepsilon_{t-q}.$$</p>\n<p>ショックが$q$期を越えると直接残らないため、理論ACFはラグ$q$以降で0になります。</p>","open":false},"9.5.3":{"title":"AR(p)は過去の値から現在値を作る","html":"<p>AR(1)なら $X_t=\\phi X_{t-1}+\\varepsilon_t$。$|\\phi|<1$なら過去ショックの影響$\\phi^k$が消えて定常解が存在します。</p>","open":false},"9.5.4":{"title":"Yule–Walkerは自己共分散とAR係数の連立方程式","html":"<p>ARモデル式の両辺に過去値を掛けて期待値を取ると、$\\gamma(k)$と$\\phi_j$の関係が得られます。標本自己共分散を代入してAR係数推定にも使えます。</p>","open":false},"9.6.1":{"title":"ARIMAのdは何回差分したか","html":"<p>非定常系列を $d$ 回差分してARMA(p,q)にするのがARIMA(p,d,q)。差分しすぎると不要なMA構造やノイズ増加を生むため、最小限にします。</p>","open":false},"9.7":{"title":"Box–Jenkinsは同定→推定→診断の反復","html":"<p>ACF/PACF等で候補次数を決め、パラメータ推定し、残差が白色雑音に近いか診断します。残差に自己相関が残ればモデルが構造を取り切れていません。</p>","open":false},"9.8.1":{"title":"最小MSE予測は条件付き期待値","html":"<p>二乗損失の下で未来値$X_{t+h}$の最良予測は</p>\n<p>$$\\hat X_{t+h|t}=E[X_{t+h}\\mid\\mathcal F_t].$$</p>\n<p>条件付き期待値が『情報を知った後の平均』として実際の予測問題に現れます。</p>","open":false},"9.9.1":{"title":"状態空間は見えない状態と観測を分ける","html":"<p>状態方程式 $x_t=Fx_{t-1}+w_t$ と観測方程式 $y_t=Hx_t+v_t$ に分けます。真の状態と測定ノイズを別々に扱えるのが利点です。</p>","open":false},"9.9.2":{"title":"Kalman filterは予測と観測を精度で融合する","html":"<p>前時点から状態を予測し、その不確実性と観測ノイズからKalman gainを計算して更新します。観測が高精度なら観測を重く、モデル予測が高精度なら予測を重くします。</p>","open":false},"9.10":{"title":"スペクトルは分散を周波数ごとに分ける","html":"<p>自己相関を時間領域で見る代わりに、スペクトル密度はどの周波数帯がどれだけ分散を持つかを示します。構造振動では周期・共振の把握と直感的につながります。</p>","open":false},"9.10.1":{"title":"Wiener–Khinchinは自己共分散とスペクトルがFourier対","html":"<p>スペクトル密度は自己共分散関数のFourier変換です。時間差での依存構造と周波数成分は同じ情報を別の座標で見ています。</p>","open":false},"9.11":{"title":"GARCHは分散そのものが時間変動するモデル","html":"<p>平均がほぼ定常でも、変動が大きい時期が固まるvolatility clusteringがあります。GARCHは条件付き分散を過去の二乗ショックと過去分散でモデル化します。</p>","open":false},"9.12":{"title":"見せかけの回帰は非定常系列同士で高R²が出る問題","html":"<p>無関係なランダムウォーク同士でも、共通の時間トレンドのような持続性により高い$R^2$・有意t値が出ることがあります。差分や共和分を検討します。</p>","open":false},"10.2.1":{"title":"生存関数・CDF・密度・ハザードを分ける","html":"<p>$S(t)=P(T>t)$、$F(t)=1-S(t)$、$f(t)=F'(t)$、$h(t)=f(t)/S(t)$。ハザードは確率ではなく、そこまで生存した条件下の瞬間率です。</p>","open":false},"10.2.2":{"title":"累積ハザードと生存関数は指数関係","html":"<p>$$H(t)=\\int_0^t h(u)du,\\qquad S(t)=e^{-H(t)}.$$</p>\n<p>ハザードを積分すると累積危険量になり、その負の指数が生存確率になります。</p>","open":false},"10.3.1":{"title":"右・左・区間打ち切りを区別する","html":"<p>右打ち切りは『寿命が少なくともc以上』、左打ち切りは『c以下』、区間打ち切りは『aとbの間』までしか分からない状態です。観測値が欠測しているのとは違います。</p>","open":false},"10.3.2":{"title":"打ち切り尤度では故障と生存で寄与が違う","html":"<p>右打ち切りデータでイベント指標$\\delta_i$を使うと典型的に</p>\n<p>$$L=\\prod_i f(t_i)^{\\delta_i}S(t_i)^{1-\\delta_i}.$$</p>\n<p>故障なら密度$f$、打ち切りなら『そこまでは生存した』確率$S$を使います。</p>","open":false},"10.4.1":{"title":"Kaplan–Meierは各故障時点の条件付き生存率を掛ける","html":"<p>故障時点$j$でリスク集合$n_j$、故障数$d_j$なら</p>\n<p>$$\\hat S(t)=\\prod_{t_j\\le t}\\left(1-\\frac{d_j}{n_j}\\right).$$</p>\n<p>各時点で生き残る条件付き確率の積です。</p>","open":false},"10.4.2":{"title":"Greenwood分散はKM曲線の不確実性を近似する","html":"<p>KM推定量は階段関数ですが標本を取り直せば曲線自体が変わります。Greenwood公式はその分散を近似し、信頼区間作成に使います。</p>","open":false},"10.5":{"title":"ログランク検定は各故障時点の観測数と期待数を足し上げる","html":"<p>各時点で群に差がなければ、リスク集合の人数比に応じた故障数が期待されます。観測故障数と期待故障数の差を時点全体で累積して群間生存曲線を比較します。</p>","open":false},"10.6.1":{"title":"Cox比例ハザードモデルは基準ハザード×倍率","html":"<p>$$h(t\\mid x)=h_0(t)e^{x^T\\beta}.$$</p>\n<p>$e^{\\beta_j}$は共変量1増加あたりのハザード比で、時間に依存しないというのが比例ハザード仮定です。</p>","open":false},"10.6.2":{"title":"部分尤度は基準ハザードを消してβだけ推定する","html":"<p>各イベント時点で『その時点のリスク集合の中から誰が故障したか』の条件付き確率を作ると、共通の$h_0(t)$が分子・分母で消えます。これを掛けたものが部分尤度です。</p>","open":false},"10.7.2":{"title":"AFTは時間軸を倍率で伸縮する","html":"<p>加速寿命モデルでは</p>\n<p>$$\\log T=x^T\\beta+\\varepsilon$$</p>\n<p>とし、共変量が寿命時間を何倍にするかとして解釈できます。Coxのハザード比とは解釈軸が違います。</p>","open":false},"10.8.1":{"title":"Weibull形状母数は故障率の時間変化を表す","html":"<p>形状母数が1未満ならハザード低下、1なら一定、1超なら増加。初期故障・偶発故障・摩耗故障という信頼性の直感と対応します。</p>","open":false},"10.8.4":{"title":"直列・並列系では部品信頼度の結合則が違う","html":"<p>独立直列系は全て生存する必要があるので $R_s=\\prod R_i$。独立並列系は全て故障したときだけ系故障なので $R_p=1-\\prod(1-R_i)$。</p>","open":false},"10.9.2":{"title":"GEVは最大値の3極限型を1式へまとめる","html":"<p>形状母数$\\xi$の符号によりGumbel($\\xi=0$)、Fréchet($\\xi>0$)、Weibull型($\\xi<0$)に対応します。尾の重さ・上端の有無を表す重要パラメータです。</p>","open":false},"10.10.1":{"title":"再現期間は平均待ち時間であり周期ではない","html":"<p>年超過確率$p$なら再現期間$T=1/p$。100年再現値は『100年ごとに1回必ず起きる』ではなく、各年の超過確率が約1%という意味です。</p>","open":false},"10.10.3":{"title":"POTは閾値超過を全部使う","html":"<p>年最大値法が1年1点なのに対し、POTは高い閾値を超えた全イベントを使い、超過量へ一般化Pareto分布を当てます。情報効率は高い一方、閾値選択と独立化が必要です。</p>","open":false},"10.11.1":{"title":"限界状態関数で安全/破壊を1つの符号問題にする","html":"<p>$$g(X)=R-S.$$</p>\n<p>$g>0$を安全、$g\\le0$を破壊と定義すれば $P_f=P(g(X)\\le0)$。複数不確実入力を一つの破壊事象へまとめられます。</p>","open":false},"10.11.3":{"title":"FORMは標準正規空間で限界面への最短距離を求める","html":"<p>基本変数を標準正規空間へ変換し、原点から$g=0$面まで最も近い設計点を探します。その距離が信頼性指標$\\beta$で、限界面をその点で一次近似します。</p>","open":false}};
Object.assign(NOTES,V2B);
const V2C={"11.2":{"title":"相関と因果が食い違う4つの典型原因","html":"<p>交絡、逆因果、選択バイアス、偶然などにより、観測された関連は介入効果と一致しません。因果推論では『なぜその関連が生じたか』をデータ生成過程として考えます。</p>","open":false},"11.2.1":{"title":"Simpsonのパラドックスは層別と集約で関係が逆転する","html":"<p>交絡変数の分布が群間で異なると、各層では正の関係でも全体集計では負に見えることがあります。『全体平均だけ見る危険』を示す例です。</p>","open":false},"11.3.1":{"title":"個体因果効果は同時に観測できない","html":"<p>個体$i$の因果効果は</p>\n<p>$$\\tau_i=Y_i(1)-Y_i(0).$$</p>\n<p>同じ個体は処置あり/なしのどちらか一方しか経験できず、片方は反実仮想になります。これが因果推論の根本問題です。</p>","open":false},"11.3.2":{"title":"SUTVAは処置の意味と干渉を固定する仮定","html":"<p>SUTVAは、①他者の処置が自分の結果へ影響しない、②『処置1』に複数の隠れたバージョンがない、という考えを含みます。</p>\n<p>ネットワーク効果や施工品質のばらつきがあると破れ得ます。</p>","open":false},"11.3.3":{"title":"素朴な群平均差には因果効果と選択差が混ざる","html":"<p>処置群と対照群の平均差は、処置そのものの効果だけでなく『そもそも処置を受けた人/建物が違う』という選択差を含みます。無作為化や調整はこの差を消すためです。</p>","open":false},"11.4":{"title":"無作為化は処置割当と潜在結果を独立にする","html":"<p>処置をランダム割当すると、平均的に背景因子が処置群・対照群で釣り合います。そのため群平均差が平均因果効果を推定できます。</p>","open":false},"11.5.1":{"title":"DAGとd分離は独立関係をグラフから読む","html":"<p>DAGの矢印は因果仮定です。経路がフォーク・チェーン・コライダーのどの形かで、条件付けにより経路が開く/閉じるかが変わります。</p>","open":false},"11.5.2":{"title":"バックドア基準は処置へ入る非因果経路を閉じる","html":"<p>処置$A$へ矢印が入ってくる経路から結果$Y$へつながるバックドア経路を、適切な共変量集合$Z$で遮断します。処置の子孫を不用意に調整しないことも重要です。</p>","open":false},"11.5.3":{"title":"コライダー調整は無かった関連を作る","html":"<p>$X\\to C\\leftarrow Y$ の$C$はコライダーです。何も条件付けなければ経路は閉じていますが、$C$を固定すると経路が開き、$X$と$Y$に見かけの関連が生まれます。</p>","open":false},"11.5.4":{"title":"DAGと潜在結果は別表現だが同じ識別問題を扱う","html":"<p>DAGは因果構造・条件付き独立を視覚化し、潜在結果は介入あり/なしの結果を定義します。どちらも『観測データから何を因果効果として識別できるか』を考える枠組みです。</p>","open":false},"11.6":{"title":"回帰調整は交絡を測れて正しくモデル化できるとき有効","html":"<p>$E[Y\\mid A,X]$を回帰でモデル化し、共変量$X$を揃えた比較を作ります。ただし未観測交絡、モデル誤指定、外挿があると因果効果推定は偏ります。</p>","open":false},"11.7.1":{"title":"傾向スコアは処置確率を1次元へ圧縮する","html":"<p>$$e(X)=P(A=1\\mid X).$$</p>\n<p>同じ傾向スコアの集団内では、一定条件下で処置群・対照群の共変量分布が釣り合います。多変量$X$を一つのスカラーへ圧縮するbalancing scoreです。</p>","open":false},"11.7.2":{"title":"傾向スコアは推定後にマッチング・重み付け等へ使う","html":"<p>推定した$e(X)$を使い、近い個体をマッチ、層別化、あるいはIPW $1/e(X)$・$1/(1-e(X))$で擬似母集団を作ります。スコア推定自体が目的ではありません。</p>","open":false},"11.7.3":{"title":"バランス診断と共通サポートが必須","html":"<p>傾向スコア法の後は、処置群/対照群で共変量が実際に釣り合ったか標準化差等で確認します。またスコアがほぼ0/1の領域は比較相手が存在せず、強い外挿になります。</p>","open":false},"11.7.4":{"title":"二重頑健推定は2モデルのどちらか一方が正しければよい","html":"<p>アウトカムモデルと処置モデルを組み合わせ、一定条件下でどちらか一方が正しく指定されていれば一致推定になります。両方間違えば保証はありません。</p>","open":false},"11.8.1":{"title":"操作変数と2SLSは外生的な処置変動だけを使う","html":"<p>第一段階で $A$ を $Z$ から予測し、第二段階でその予測処置を使って$Y$を回帰します。$Z$がアウトカムへ直接影響しない排除制約など強い仮定が必要です。</p>","open":false},"11.8.2":{"title":"弱操作変数は2SLSを不安定にする","html":"<p>$Z$と$A$の関連が弱いと、外生的な処置変動がほとんどなく推定分散が大きく、有限標本バイアスも増えます。第一段階の強さを確認します。</p>","open":false},"11.8.3":{"title":"LATEは全員の平均効果ではなくcomplierの効果","html":"<p>IV推定が識別するのは、一定の単調性等の仮定下で、操作変数によって処置行動を変えるcomplier集団の平均因果効果です。ATEと同じとは限りません。</p>","open":false},"11.9.1":{"title":"差の差は二重差で時間不変の群差を消す","html":"<p>$$DID=(Y_{T,after}-Y_{T,before})-(Y_{C,after}-Y_{C,before}).$$</p>\n<p>鍵は、処置がなければ両群の平均結果が平行に動いたという平行トレンド仮定です。</p>","open":false},"11.9.2":{"title":"RDDは閾値の直前直後をほぼ同質とみなす","html":"<p>割当変数がカットオフを越えたら処置される制度では、閾値近傍の個体を比較して局所因果効果を推定します。操作変数の恣意的操作がないこと、関係が閾値以外で滑らかなことが重要です。</p>","open":false},"11.10":{"title":"感度分析は未観測交絡がどれくらい強ければ結論が崩れるかを見る","html":"<p>未観測交絡を完全に除いたと断言する代わりに、仮想的な交絡の強さを動かして推定効果がどこで消えるかを示します。因果結論の頑健性を定量化します。</p>","open":false},"12.2.1":{"title":"予測と推論は同じモデルでも評価軸が違う","html":"<p>推論では係数・効果の意味と不確実性、予測では未見データの誤差を重視します。係数解釈が難しくても予測に強いモデル、逆に解釈しやすいが予測性能が少し低いモデルがあります。</p>","open":false},"12.2.2":{"title":"教師あり学習は入力Xから出力Yを予測する規則を学ぶ","html":"<p>訓練データ $(X_i,Y_i)$ から関数 $\\hat f$ を学び、新しい $X_{new}$ に対して $\\hat f(X_{new})$ を出します。評価は訓練データではなく未見データで行います。</p>","open":false},"12.3.1":{"title":"バイアス–分散分解は予測誤差を3成分に分ける","html":"<p>二乗損失では固定$x$で概念的に</p>\n<p>$$E[(Y-\\hat f(x))^2]\n=\\text{irreducible noise}+\\text{Bias}^2+\\text{Variance}.$$</p>\n<p>モデルを複雑にするとBiasは減りやすい一方、標本ごとの学習結果が揺れてVarianceが増えやすくなります。</p>","open":false},"12.3.2":{"title":"過学習は訓練データの偶然まで学ぶこと","html":"<p>訓練誤差は小さくても、標本固有のノイズへ合わせすぎると新データで悪化します。汎化性能を直接観測できないため、検証データやCVで近似します。</p>","open":false},"12.4.1":{"title":"k-fold CVは全観測を一度ずつ検証側へ回す","html":"<p>データを$k$分割し、1foldを検証、残りを学習に使う操作を$k$回行います。各foldの評価を平均し、分割偶然性を減らします。</p>","open":false},"12.4.3":{"title":"情報リークは検証データを学習時に見てしまうこと","html":"<p>標準化・特徴選択・欠測補完を全データで先にfitすると、検証foldの情報が学習へ漏れます。前処理も各foldの学習部分だけでfitします。</p>","open":false},"12.5.1":{"title":"正則化は訓練誤差に係数の罰則を足す","html":"<p>$$\\min_\\beta RSS(\\beta)+\\lambda P(\\beta).$$</p>\n<p>$\\lambda$が大きいほど係数を強く縮め、少しBiasを増やす代わりにVarianceを下げます。</p>","open":false},"12.5.2":{"title":"RidgeはL2罰則で多重共線性を安定化する","html":"<p>$$\\hat\\beta=(X^TX+\\lambda I)^{-1}X^Ty.$$</p>\n<p>小さい固有値方向へ$\\lambda$を足すため逆行列が安定し、相関した説明変数の係数をなだらかに縮めます。</p>","open":false},"12.5.3":{"title":"LassoはL1罰則の角で係数を0にする","html":"<p>$$RSS+\\lambda\\sum_j|\\beta_j|$$</p>\n<p>を最小化します。L1制約領域に角があるため解が軸上へ乗りやすく、一部係数が厳密に0になって変数選択のように働きます。</p>","open":false},"12.5.4":{"title":"Elastic NetはRidgeとLassoを混ぜる","html":"<p>L1とL2罰則を併用し、スパース性と相関変数群の安定な扱いを両立します。強く相関した変数が多いとLasso単独より安定することがあります。</p>","open":false},"12.5.5":{"title":"λは訓練誤差でなくCVで選ぶ","html":"<p>$\\lambda$を小さくすれば訓練誤差は改善しやすいので、未見誤差の近似であるCVを使って選びます。one-standard-error ruleでより単純なモデルを選ぶこともあります。</p>","open":false},"12.6":{"title":"kNNは近い訓練点の平均・多数決で予測する","html":"<p>モデル式を仮定せず局所情報を使います。$k$が小さいと低Bias高Variance、大きいと高Bias低Variance。距離尺度と標準化が結果へ強く効きます。</p>","open":false},"12.7.1":{"title":"CARTは最も損失を減らす閾値で再帰分割する","html":"<p>回帰なら二乗誤差、分類ならGini不純度等を最も減らす変数・閾値を選び、左右ノードで同じ操作を繰り返します。</p>","open":false},"12.7.2":{"title":"剪定は深すぎる木のVarianceを下げる","html":"<p>完全成長木は訓練データへ過適合しやすいため、葉数に罰則を課すcost-complexity pruning等で枝を落とし、CVで複雑度を選びます。</p>","open":false},"12.8.1":{"title":"Baggingはモデル平均でVarianceを下げる","html":"<p>ブートストラップ標本ごとに不安定な学習器を学習し、予測を平均します。モデル誤差の相関が1でなければ、平均化でVarianceが減ります。</p>","open":false},"12.8.2":{"title":"Random Forestは木同士の相関も下げる","html":"<p>各分割で使える特徴をランダムに制限し、強い予測変数ばかりを全木が使うのを防ぎます。個々の木を少し弱くしても、木間相関を下げて平均性能を改善します。</p>","open":false},"12.8.3":{"title":"Gradient Boostingは残った誤差を逐次修正する","html":"<p>現在モデルの損失の負勾配を次の弱学習器で近似し、小さな学習率で足していきます。Baggingの並列平均とは対照的な逐次加法モデルです。</p>","open":false},"12.9.1":{"title":"SVMは誤分類だけでなくマージンを最大化する","html":"<p>分離可能なら、最も近い訓練点までの距離が最大の超平面を選びます。境界を決めるのは主にsupport vectorsです。</p>","open":false},"12.9.2":{"title":"Kernel trickは高次元特徴空間の内積だけ計算する","html":"<p>明示的に高次元写像$\\phi(x)$を作らず</p>\n<p>$$K(x,x')=\\phi(x)^T\\phi(x')$$</p>\n<p>だけ計算し、非線形境界を線形手法として扱います。</p>","open":false},"12.10.1":{"title":"Gaussian Processは関数の上に事前分布を置く","html":"<p>$$f\\sim GP(m(x),k(x,x')).$$</p>\n<p>任意の有限点での関数値ベクトルが多変量正規になる確率過程です。カーネル$k$が点同士の相関・滑らかさを決めます。</p>","open":false},"12.10.2":{"title":"GP事後は観測点近傍で不確実性が縮む","html":"<p>正規観測ノイズなら、事前と尤度がGaussianなので事後予測も閉形式の正規分布になります。予測平均だけでなく予測分散を直接得られます。</p>","open":false},"12.11.2":{"title":"ROCは閾値を動かした感度と偽陽性率の関係","html":"<p>分類確率の閾値を0〜1で動かし、TPRとFPRを描きます。AUCはランダムに選んだ正例が負例より高いスコアを持つ確率としても解釈できます。</p>","open":false},"12.11.3":{"title":"較正は予測確率と実現頻度の一致","html":"<p>『0.7と予測したケースの約70%が本当に陽性か』を見る性質です。順位性能が高いモデルでも確率較正が悪いことはあります。</p>","open":false},"12.18.2":{"title":"交換可能性は順序を入れ替えても同時分布が同じ","html":"<p>i.i.d.なら交換可能ですが、交換可能性はi.i.d.より弱い概念です。共形予測の有限標本被覆保証は、スコア順位が対称に扱えることに依存します。</p>","open":false},"12.19.1":{"title":"分割共形予測は学習と較正を分ける","html":"<p>学習セットでモデルをfitし、別のcalibrationセットで残差スコアを計算。その適切な上側分位点を新予測の幅へ足して予測区間を作ります。</p>","open":false},"12.19.2":{"title":"ceil((n+1)(1−α))番目は有限標本の順位補正","html":"<p>新しい1点を既存$n$個の較正スコアと同列に加えると$n+1$個。交換可能性の下で新点の順位が一様なので、所望被覆を保証するための保守的順位がこの式から出ます。</p>","open":false},"12.20.1":{"title":"周辺90%とxごと90%は別物","html":"<p>周辺被覆は全データ平均で90%入ればよく、特定のサブグループでは低被覆でも可能です。条件付き被覆は各$x$で90%を要求し、はるかに強い条件です。</p>","open":false},"12.21":{"title":"交換可能性が壊れると共形保証も壊れる","html":"<p>分布シフト・時系列・クラスター依存では、較正スコアと新点を同列の順位として扱えません。重み付き共形や時系列向け手法等、構造に合わせた修正が必要です。</p>","open":false},"13.2.1":{"title":"疑似乱数は決定論的でも統計的に乱数らしい","html":"<p>通常のPRNGはseedと内部状態から完全に決定論的に列を作ります。同じseedなら再現できることが科学計算では利点です。</p>","open":false},"13.2.5":{"title":"seed管理は再現性と独立系列の両方を見る","html":"<p>結果再現のためseedを記録し、並列計算では同じ乱数列を重複使用しないようstreamを管理します。都合のよいseedだけ選ぶのは結果選択になります。</p>","open":false},"13.3.1":{"title":"逆関数法はCDFの逆を使って一様乱数を変換する","html":"<p>$U\\sim U(0,1)$に対して</p>\n<p>$$X=F^{-1}(U)$$</p>\n<p>とすれば$X$はCDF $F$を持ちます。分位関数がそのまま乱数生成器になります。</p>","open":false},"13.3.2":{"title":"棄却法は引きやすい分布で包んで候補を選ぶ","html":"<p>$f(x)\\le M g(x)$を満たす提案密度$g$から候補$X$を引き、確率 $f(X)/(Mg(X))$ で受理します。包絡が緩いと棄却が多く効率が落ちます。</p>","open":false},"13.3.3":{"title":"Box–Mullerは2次元正規の極座標変換から出る","html":"<p>独立標準正規2変数の同時密度は円対称です。極座標へ変換すると角度が一様、半径二乗が指数型になり、一様乱数2個から正規乱数2個を作れます。</p>","open":false},"13.4.1":{"title":"Monte Carloの標準誤差がn^−1/2なのはCLTから","html":"<p>積分を期待値に書き、標本平均で推定するため</p>\n<p>$$SE\\approx \\frac{\\sigma_h}{\\sqrt n}.$$</p>\n<p>誤差を半分にするには試行数を約4倍必要です。</p>","open":false},"13.4.2":{"title":"稀事象では単純Monte Carloはほとんどイベントを見ない","html":"<p>$P_f=10^{-4}$なら1万試行で期待破壊回数は1回。相対誤差を小さくするにはさらに桁違いの試行数が必要で、重点サンプリング等が必要になります。</p>","open":false},"13.4.3":{"title":"対照変量は既知期待値を使ってVarianceを減らす","html":"<p>期待値既知で$H$と相関する$C$を使い</p>\n<p>$$H^*=H-a(C-E[C])$$</p>\n<p>とすると期待値は変えず、最適$a$で分散を下げられます。</p>","open":false},"13.4.4":{"title":"重点サンプリングは重要領域を多く引き重みで戻す","html":"<p>提案分布$q$から引き</p>\n<p>$$E_f[h(X)]=E_q\\left[h(X)\\frac{f(X)}{q(X)}\\right]$$</p>\n<p>と重み補正します。破壊領域近くへ$q$を集中できれば稀事象推定のVarianceが大きく減ります。</p>","open":false},"13.4.5":{"title":"層化サンプリングは全領域を層ごとに必ず見る","html":"<p>母空間を層に分け、各層から標本を取ります。層内が均質で層間差が大きいほど、単純無作為よりVarianceを下げられます。</p>","open":false},"13.5":{"title":"LHSは各変数の各分位区間を一度ずつ使う","html":"<p>各入力の累積確率を$n$層に分け、各層から1点ずつ選び、変数間でランダムに組み合わせます。1次元周辺分布を均等に覆うため空白が減ります。</p>","open":false},"13.6":{"title":"Pf=10^-4を数えるとき単純MCの限界が露出する","html":"<p>稀な破壊確率では『破壊を何回観測したか』自体が少なく、二項相対誤差が大きくなります。FORM・重点サンプリング・subset simulation等を検討する理由です。</p>","open":false},"13.7.1":{"title":"EMは潜在変数がある尤度最大化を分解する","html":"<p>観測データ尤度を直接最大化しにくいとき、潜在変数$Z$を仮想的に含む完全データ対数尤度を使います。E-stepで$Z\\mid X,\\theta^{old}$の期待値、M-stepでその期待対数尤度を最大化します。</p>","open":false},"13.7.2":{"title":"EMの尤度が下がらないのはJensen不等式から","html":"<p>対数尤度の下限を、現在パラメータでの潜在変数事後分布を使って作り、その下限をM-stepで最大化します。現在点では下限が尤度に接するため、反復で尤度が減りません。</p>","open":false},"13.8.1":{"title":"Newton法は勾配と曲率で一気に最適点へ近づく","html":"<p>1次元なら</p>\n<p>$$\\theta_{new}=\\theta_{old}-\\frac{\\ell'(\\theta)}{\\ell''(\\theta)}.$$</p>\n<p>局所二次近似の頂点へ移動する更新です。Fisher scoringは観測Hessianの代わりに期待Fisher情報を使います。</p>","open":false},"13.8.3":{"title":"プロファイル尤度は邪魔な母数を各候補値で最大化して消す","html":"<p>関心母数$\\psi$を固定し、その他$\\lambda$について尤度を最大化した $L_p(\\psi)$ を作ります。Wald近似より非対称な尤度形を保ちやすく、区間推定に使えます。</p>","open":false},"13.9.1":{"title":"有限母集団では有限母集団補正が効く","html":"<p>母集団サイズ$N$から非復元で$n$抽出すると、標本平均分散には</p>\n<p>$$\\left(1-\\frac nN\\right)$$</p>\n<p>の有限母集団補正が入ります。抽出率が小さければ約1ですが、大きいと無視できません。</p>","open":false},"13.9.2":{"title":"層化抽出は層間差を利用して精度を上げる","html":"<p>母集団を均質な層に分け、各層から独立に抽出します。層ごとの推定値を母集団比率で重み付けします。Neyman配分は層サイズと層内SDに応じて標本数を配ります。</p>","open":false},"13.9.3":{"title":"クラスター抽出はコストを下げる代わりに設計効果が出る","html":"<p>個体ではなく学校・地区・ロット等の群を抽出します。同一群内が似ていると実効標本サイズが減り、単純無作為よりVarianceが大きくなることがあります。</p>","open":false},"13.10.1":{"title":"MCAR・MAR・MNARは欠測メカニズムの仮定","html":"<p>MCAR：欠測が何にも依存しない。MAR：観測済み情報を条件にすれば未観測値へ依存しない。MNAR：未観測値自体に依存する。解析法の妥当性はこの仮定へ依存します。</p>","open":false},"13.10.2":{"title":"完全ケース削除が不偏になる条件は強い","html":"<p>欠測ケースを捨てると標本数が減るだけでなく、欠測が結果や説明変数に関連すれば残った標本が母集団を代表しなくなりBiasが生じます。</p>","open":false},"13.10.3":{"title":"多重代入は欠測値を一つに決め打ちしない","html":"<p>欠測を複数回ランダムに補完し、各完成データで解析し、Rubinのルールで点推定・分散を統合します。補完そのものの不確実性を結果へ反映します。</p>","open":false},"13.10.4":{"title":"MICEは各変数の条件付きモデルを順番に更新する","html":"<p>欠測変数ごとに他変数を説明変数とする回帰モデルを作り、順番に補完を反復します。各条件付きモデルが互いに整合するかは自動的には保証されません。</p>","open":false},"13.10.5":{"title":"MNARでは観測データだけで欠測機構を識別しにくい","html":"<p>欠測確率が未観測値自体に依存すると、観測データだけからその関係を完全に学べないことがあります。感度分析や外部情報が重要です。</p>","open":false},"14.2":{"title":"コンクリート受入検査では平均より下側保証を見る","html":"<p>平均強度だけでなく標本SD・標本数・下側分位点を見ます。『標本の5%点』『母集団の5%点』『95%信頼で保証した母集団5%点』は別の量です。</p>","open":true},"14.3":{"title":"回帰で1点が結論を変えるなら影響点を診断する","html":"<p>外れたYだけでなく、X空間で遠い高レバレッジ点が回帰線を強く引っ張ります。Cook距離・studentized residual・leverageを合わせて見ます。</p>","open":false},"14.4":{"title":"疲労試験のrun-outは右打ち切りとして扱う","html":"<p>試験上限まで壊れなかった供試体は『寿命が上限値だった』のではなく『寿命は少なくとも上限以上』です。生存解析の右打ち切りとして尤度へ残します。</p>","open":false},"14.5":{"title":"年最大風速では観測の連続性を疑う","html":"<p>観測所移転、風速計変更、周辺建物、測定高さの変更は人工的な段差を作ります。非定常気候モデルを当てる前にメタデータを確認します。</p>","open":false},"14.6":{"title":"構造モニタリングでは環境変動と損傷を分離する","html":"<p>固有振動数等は温度・湿度・運用条件でも変わります。季節性や環境共変量をモデル化し、その説明後の残差で異常を探す方が損傷検知として自然です。</p>","open":false},"14.7":{"title":"実データ演習では結果より分析の筋道を記録する","html":"<p>どのデータを除外したか、どの変換をしたか、どの仮定を置いたか、別手法でも結論が保たれるかを記録してください。再現可能性はコードだけでなく判断過程も含みます。</p>","open":false}};
